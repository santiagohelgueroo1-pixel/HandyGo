<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>HandyGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26573F">
<meta name="description" content="Te ayudamos a resolverlo, te conectamos si hace falta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: una sola columna tipo teléfono; en compu se muestra dentro de un marco de celular.
   Identidad HandyGo: verde bosque, verde menta, ámbar para botones y alertas; Poppins + Inter. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --sunk:#EAEFE8; --ink:#1E2A24; --mut:#5C6B62; --line:#D8E0D9;
  --pri:#26573F; --priInk:#FFFFFF; --priSoft:#E3F0E5; --mint:#B1D8B7;
  --acc:#F2B33D; --accInk:#1E2A24;
  --warnSoft:#FDF1D8; --warnInk:#7A4E00;
  --bad:#B8381F; --badSoft:#FBEAE5; --ok:#26573F; --okSoft:#E3F0E5;
  --desk:#DCE4DD; --frame:#1E2A24; --head:#26573F; --headInk:#FFFFFF; --dark:#1E2A24;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.r1>span{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* Sin zoom automático: el teléfono no acerca la pantalla al escribir (pasa con textos de menos de 16 px) ni con doble toque */
input,select,textarea{font-size:16px!important}
html,body{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.device{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
/* En el celular la app ocupa toda la pantalla, también la franja de abajo (la de la barrita de inicio del iPhone) */
@media (max-width:759px){
  html,body{height:100%;min-height:100vh;min-height:100lvh;overflow:hidden}
  .device{position:fixed;top:0;left:0;right:0;bottom:0;height:auto}
  body{background:var(--surface)}
  body:has(.splash){background:var(--head)}
}
@media (min-width:760px){
  body{display:grid;place-items:center;padding-block:20px}
  .device{width:400px;height:min(860px,100%);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 80px -30px rgba(20,40,30,.55)}
}

/* ---------- encabezado con borde de cinta métrica ---------- */
.top{position:relative;flex:none;background:var(--head);color:var(--headInk);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}

.top .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mark{display:block;flex:none;border-radius:22%;object-fit:cover}
.top .mark{display:none}
.top h1{margin:0;font:600 24px/1.15 var(--f-display);letter-spacing:-.01em}
small#hs{display:none}
small#hs.on{display:flex;align-items:center;gap:6px;margin-top:2px}
small#hs.on i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
small#hs.on.off i{background:rgba(255,255,255,.4)}
.hacts{display:flex;gap:4px;flex:none}
.hacts[hidden]{display:none}
.hbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--headInk);display:grid;place-items:center;cursor:pointer}
.hbtn:hover,.hbtn:focus-visible{background:rgba(255,255,255,.14)}
.hbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.top small{display:block;font:500 12px/1.3 var(--f-body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:99px;padding:8px 12px;font:600 14px/1 var(--f-body);background:var(--mint);color:#1E2A24;display:inline-flex;gap:8px;align-items:center}
.pill.off{background:rgba(255,255,255,.16);color:var(--headInk)}
body.prov .top{background:var(--dark)}

/* ---------- vista y navegación ---------- */
#view{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font:600 12px/1 var(--f-body);position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
nav .dot.sm{min-width:9px;width:9px;height:9px;padding:0;top:8px;left:calc(50% + 10px);background:var(--acc)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:600 12px/17px var(--f-body)}

/* ---------- tipografía y piezas ---------- */
h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 8px;text-wrap:balance}
h3{font:600 16px/1.3 var(--f-display);margin:0}
.eyebrow{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mut{color:var(--mut)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-top:24px}
.sec>.eyebrow{display:block;margin-bottom:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:12px 16px;font:600 16px/1.1 var(--f-body);text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.stickbar{position:sticky;bottom:-24px;z-index:3;margin:16px -16px -24px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -1px 0 var(--line),0 -8px 16px -12px rgba(20,40,30,.25);display:flex;flex-direction:column;gap:8px}
.stickbar .row{display:flex;gap:8px;flex-wrap:nowrap}
.stickbar .row .btn{flex:1}
.stickbar .row .btn.g{flex:0 0 auto}
.stickbar .hint{text-align:center;margin:0}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.g{border-color:var(--line);color:var(--mut);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(30,42,36,.05),0 0 0 1px rgba(30,42,36,.04)}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.v{background:var(--okSoft);color:var(--ok)}
.tag.r{background:var(--warnSoft);color:var(--warnInk)}
.tag.b{background:var(--priSoft);color:var(--pri)}
.tag.y{background:var(--acc);color:var(--accInk)}
.stars{color:var(--acc);letter-spacing:1px}
.num{font-variant-numeric:tabular-nums}

label.f{display:block;font:600 14px/1.3 var(--f-body)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pri);outline:none}
.gside input,input#e_espn{display:block;width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font:400 15px/1.3 var(--f-body);color:var(--ink)}
.gside input:focus,input#e_espn:focus{border-color:var(--pri);outline:none}
.hint{font-size:14px;color:var(--mut);font-weight:400;margin-top:4px;display:block}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}

/* ---------- bienvenida ---------- */
.splash{flex:1;min-height:0;overflow-y:auto;background:var(--head);color:var(--headInk);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(24px,env(safe-area-inset-left,0px))}
.splash .brandc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:24px}
.splash .mark{width:116px;height:116px;border-radius:26%;box-shadow:0 0 0 3px var(--mint),0 18px 40px -16px rgba(0,0,0,.45)}
.splash h1{margin:0;font:700 42px/1 var(--f-display);letter-spacing:-.02em;color:#FFFFFF}
.splash .slogan{margin:0;font:500 16px/1.45 var(--f-body);color:var(--mint);max-width:26ch;text-wrap:balance}
.splash .tape{height:9px;margin:0 calc(-1 * max(24px,env(safe-area-inset-left,0px))) 24px;background:linear-gradient(var(--acc),var(--acc)) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) top/100% 9px no-repeat}
.splash .acts{display:grid;gap:12px}
.splash .btn.o{background:transparent;border-color:#FFFFFF;color:#FFFFFF}
@media (prefers-reduced-motion:no-preference){.splash .brandc>*{animation:rise .5s ease-out both}.splash .brandc>*:nth-child(2){animation-delay:.08s}.splash .brandc>*:nth-child(3){animation-delay:.16s}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hero{background:var(--head);color:var(--headInk);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 32px) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.hero .mark{width:64px;height:64px;box-shadow:0 0 0 2px var(--mint)}
.hero h2{font-size:38px;line-height:1.05;margin:24px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;opacity:.9;max-width:32ch}
.pillars{display:grid;gap:12px;margin:24px 0 16px}
.pillar{display:flex;gap:12px;align-items:flex-start}
.pillar .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.pillar .ico.r{background:var(--warnSoft);color:var(--warnInk)}
.pillar .ico.v{background:var(--okSoft);color:var(--ok)}
.pillar svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font:600 16px/1.3 var(--f-display)}
.pillar span{font-size:14px;color:var(--mut)}
.role{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.role:hover{border-color:var(--pri)}
.role .ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.role .ico.y{background:var(--acc);color:var(--accInk)}
.role svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.role b{display:block;font:600 18px/1.3 var(--f-display);margin-bottom:2px}
.role span{font-size:14px;color:var(--mut)}

/* ---------- chat ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.m{max-width:84%;padding:10px 14px;border-radius:18px;background:var(--priSoft);border:0;font-size:16px;line-height:1.45;align-self:flex-start;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);color:var(--priInk);border-radius:18px}
.bot + .m.u,.m.u + .bot,.m.u + .chips,.chips + .m.u{margin-top:8px}
.m.bot:has(+ .m.bot){border-bottom-left-radius:6px}
.m.bot + .m.bot{border-top-left-radius:6px}
.m.u:has(+ .m.u){border-bottom-right-radius:6px}
.m.u + .m.u{border-top-right-radius:6px}
.chips.bot{margin-top:4px}
.m.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
.m img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:8px}
.m.sys{align-self:center;background:transparent;border:0;font-size:14px;color:var(--mut);padding:2px}
.who{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-body);color:var(--mut);margin:12px 0 2px 2px}
.who:first-child{margin-top:0}
.who .mark{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .m,.chips{animation:in .22s ease-out}
}
@keyframes blink{50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chips button{border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:99px;padding:8px 16px;font:600 14px/1.15 var(--f-body);text-align:left}
.chips button.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.pillin{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--sunk);border-radius:24px;padding:4px 4px 4px 16px;border:1px solid transparent;transition:border-color .15s,background .15s}
.pillin:focus-within{border-color:var(--line);background:var(--surface)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;padding:12px 0;max-height:110px;line-height:1.35;font-size:16px}
.composer textarea:focus{outline:none}
.pillin .cam{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.pillin .cam:hover{color:var(--pri)}
.pillin .cam svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.actbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:var(--priInk);display:grid;place-items:center;position:relative;transition:transform .12s}
.actbtn:active{transform:scale(.92)}
.actbtn svg{position:absolute;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease,opacity .18s ease}
.actbtn .i-send{opacity:0;transform:scale(.4) rotate(-45deg)}
.actbtn.send .i-mic{opacity:0;transform:scale(.4)}
.actbtn.send .i-send{opacity:1;transform:none}
.recbar{display:flex;align-items:center;gap:8px}
.recbar .t{flex:1;min-width:0;display:flex;align-items:center;gap:12px;font-weight:600;font-variant-numeric:tabular-nums;border-radius:24px;padding:12px 16px;background:var(--badSoft);color:var(--bad)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.wave{display:flex;align-items:center;gap:4px;height:18px;flex:1;min-width:0;overflow:hidden}
.wave i{width:3px;height:30%;border-radius:2px;background:currentColor;opacity:.75}
@media (prefers-reduced-motion:no-preference){.wave i{animation:wv .9s ease-in-out infinite}}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes wv{50%{height:100%}}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1s infinite}}
.m audio{display:block;width:230px;max-width:100%;height:40px}
.m .tr{font-size:14px;opacity:.9;margin-top:8px;font-style:italic}
.iconbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--mut);display:grid;place-items:center}
.iconbtn:hover{background:var(--sunk)}
.iconbtn.p{background:var(--pri);color:var(--priInk)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.attach{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:14px;color:var(--mut)}
.attach{flex-wrap:wrap}
.attach .thumbs{display:flex;gap:8px;flex-wrap:wrap}
.attach .th{position:relative;width:56px;height:56px}
.attach .th img{width:56px;height:56px;object-fit:cover;border-radius:10px;display:block}
.attach .thx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;padding:0;background:var(--ink);color:var(--bg);font-size:15px;line-height:22px;text-align:center;cursor:pointer}
.attach .thadd{width:56px;height:56px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;font-size:24px;color:var(--mut);cursor:pointer}
.m .mimgs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;max-width:220px;margin-bottom:8px}
.m .mimgs img{margin:0;aspect-ratio:1;object-fit:cover;border-radius:8px}
.attach button{border:0;background:none;color:var(--bad);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:8px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.off i{background:var(--mut)}

/* ---------- freno de seguridad ---------- */
.stop{border:2px solid var(--acc);background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:100%;align-self:stretch}
.stop .stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1E2A24 12px 24px)}
.stop .in{padding:16px}
.stop h4{margin:0 0 8px;font:700 24px/1 var(--f-display);color:var(--warnInk);display:flex;gap:8px;align-items:center}
.stop h4 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.stop p{margin:8px 0;font-size:16px}
.stop .now{background:var(--warnSoft);color:var(--warnInk);border-radius:10px;padding:12px 12px;font-size:14px;font-weight:600;margin:12px 0}
.stop .rule{font-size:12px;color:var(--mut);margin-top:12px}
.stop h5{margin:16px 0 4px;font:600 14px/1.3 var(--f-body)}
.stop ul{margin:0;padding-left:20px;font-size:14px;line-height:1.45}
.stop ul li{margin:2px 0}
.sos{width:100%;align-self:stretch;background:var(--bad);color:#fff;border-radius:16px;padding:16px}
.sos h4{margin:0 0 8px;font:700 18px/1.2 var(--f-display);display:flex;gap:8px;align-items:center}
.sos h4 svg,.sos .btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sos ol{margin:0 0 12px;padding-left:22px;font-size:16px;line-height:1.45;font-weight:600}
.sos .row{display:flex;gap:8px;flex-wrap:wrap}
.sos .row .btn{flex:1;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none}
.sos .row .btn:not(.p){background:#fff;color:var(--bad);border-color:#fff}
.sos p{margin:12px 0 0;font-size:14px;opacity:.95}
.meanwhile{width:100%;align-self:stretch;background:var(--warnSoft);color:var(--ink);box-shadow:none}
.meanwhile b{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--warnInk)}
.meanwhile b svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75}
.meanwhile ul{margin:8px 0 0;padding-left:20px;font-size:14px}
.handysays{display:flex;gap:12px;align-items:flex-start}
.handysays>.mark{width:36px;height:36px;border-radius:10px;flex:none}
.handysays p{font-size:15px}
.handysays .bub{flex:1;min-width:0;background:var(--priSoft);border-radius:4px 16px 16px 16px;padding:12px 14px}
.handysays .nm{display:block;font:600 12px/1 var(--f-body);color:var(--pri);margin-bottom:4px}
.handysays p{margin:0;font-size:16px;line-height:1.45}
.casaitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink)}
.casaitem .ci{width:44px;height:44px;border-radius:12px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex:none}
.casaitem .ci svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.casaitem .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.casaitem .ct b{font:600 16px/1.3 var(--f-display)}
.casaitem .go{width:18px;height:18px;transform:rotate(180deg);fill:none;stroke:var(--mut);stroke-width:1.75;flex:none}
.casaitem .cnt{min-width:24px;height:24px;border-radius:99px;background:var(--acc);color:var(--accInk);font:700 12px/24px var(--f-body);text-align:center;padding:0 6px}
.casastat{margin-top:16px;width:100%;border:0;display:flex;align-items:center;gap:20px;text-align:left;cursor:pointer;color:var(--ink)}
.casastat>span:not(.small){display:flex;flex-direction:column}
.casastat b{font:700 18px/1.2 var(--f-display)}
.casastat>span:last-child{margin-left:auto}
.task .why{font-size:14px;color:var(--mut);margin-top:4px}
.task .why b{color:var(--ink);font-weight:600}
.seg.segw{display:flex;width:100%}
.seg.segw button{flex:1}
.adh{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:var(--pri);margin-bottom:6px}
.adh .mark{width:16px;height:16px}
.fercard.ad{box-shadow:0 0 0 2px var(--pri)}
.ferl .adh{display:block;margin-bottom:4px}

/* ---------- tutorial ---------- */
.tut{background:var(--surface);border:0;box-shadow:0 1px 2px rgba(30,42,36,.06),0 0 0 1px rgba(30,42,36,.05);border-radius:16px;overflow:hidden;align-self:stretch;margin-top:4px}
.tut .hd{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.tut .hd h4{margin:8px 0 8px;font:700 18px/1.2 var(--f-display)}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.steps{list-style:none;margin:0;padding:8px 0}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 12px;align-items:center;padding:8px 16px}
.stimg{grid-column:2;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(100deg,var(--sunk) 30%,var(--priSoft) 50%,var(--sunk) 70%) 0 0/300% 100%}
@media (prefers-reduced-motion:no-preference){.stimg:empty{animation:shim 1.4s linear infinite}}
@keyframes shim{to{background-position:-150% 0}}
.stimg img{display:block;width:100%;height:100%;object-fit:cover}
.steps li+li{border-top:1px dashed var(--line)}
.steps .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.steps label{flex:1;display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.steps .n{font:700 12px/1 var(--f-mono);color:var(--mut);margin-top:4px}
.steps input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin:0 0 0 auto}
.steps li.done span.t{text-decoration:line-through;color:var(--mut)}
.steps .stuck{grid-column:2;justify-self:start;border:0;background:none;padding:0;font:500 12px/1.2 var(--f-body);color:var(--pri);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.steps li.done .stuck{display:none}
.warn{margin:0 16px 12px;padding:12px 12px;border-radius:10px;background:var(--warnSoft);color:var(--warnInk);font-size:14px;font-weight:600}
.tut .ft{padding:12px 16px 16px;display:grid;gap:8px;border-top:1px solid var(--line);background:var(--sunk)}

/* ---------- orden de caso ---------- */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;font-size:14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.m .ticket::before,.m .ticket::after{background:var(--bg)}
.ticket .tk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 12px/1 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ticket h4{margin:8px 0 12px;font:600 18px/1.3 var(--f-display)}
.ticket dl{margin:0;padding-top:12px;border-top:2px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:8px 12px}
.ticket dt{font:700 12px/1.5 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ticket dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ticket .photo{width:64px;height:64px;object-fit:cover;border-radius:8px}
.ticket .touched{display:flex;gap:8px;align-items:flex-start;background:var(--warnSoft);color:var(--warnInk);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.ticket .touched svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;margin-top:1px}
.ficha{width:100%;display:grid;gap:16px}
.ficha .fq b{display:block;font:600 14px/1.3 var(--f-body);margin-bottom:8px}
.fopts{display:flex;flex-wrap:wrap;gap:8px}
.fopts button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font:500 14px/1.2 var(--f-body);cursor:pointer}
.fopts button.on{border-color:var(--pri);background:var(--priSoft);color:var(--pri);font-weight:600}
.fopts button:disabled{opacity:.6;cursor:default}
.tag.mat{background:var(--priSoft);color:var(--pri)}
.tag.mat svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2}
.tag.plus{background:var(--ink);color:var(--bg);gap:4px}
.tag.plus .mark{width:14px;height:14px;border-radius:4px}
.review .reply{margin:8px 0 0 12px;padding:8px 12px;border-left:3px solid var(--mint);background:var(--sunk);border-radius:0 8px 8px 0;font-size:14px}
.review .reply b{display:block;font:600 12px/1.3 var(--f-body);color:var(--pri);margin-bottom:2px}
.conds{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 16px}
.conds>div{display:flex;flex-direction:column;gap:2px;min-width:90px}
.conds span{font-size:12px;color:var(--mut)}
.conds b{font:600 16px/1.2 var(--f-display)}
.conds small{font-size:12px;color:var(--mut)}
.offer .inc{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.whyb{display:inline-flex;align-items:center;gap:6px;justify-self:start;align-self:flex-start}
.whyb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75}
.whylist{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.whylist li{display:flex;gap:12px;align-items:flex-start}
.whylist li>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.whylist .wi{width:36px;height:36px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center;flex:none}
.whylist .wi svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
label.incl{display:inline-flex}
label.incl input{position:absolute;opacity:0;pointer-events:none}
label.incl span{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font:500 14px/1.2 var(--f-body);cursor:pointer}
label.incl input:checked+span{border-color:var(--pri);background:var(--priSoft);color:var(--pri);font-weight:600}
label.incl input:focus-visible+span{outline:3px solid var(--acc);outline-offset:2px}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px}
label.chk input{width:20px;height:20px;accent-color:var(--pri);flex:none;margin:0}
.casaitem .ci .mark{width:44px;height:44px;border-radius:12px}
.cimg{position:relative;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--sunk);color:var(--mut);border-radius:12px;width:44px;height:44px}
.cimg>svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.cimg img{position:absolute;inset:14%;width:72%;height:72%;object-fit:contain;background:var(--sunk)}
.cimg.xl img{inset:20%;width:60%;height:60%}
.cimg.sm{width:42px;height:42px;border-radius:10px}
.cimg.md{width:64px;height:64px;border-radius:14px}
.cimg.lg{width:100%;height:auto;aspect-ratio:1;border-radius:12px}
.cimg.lg>svg{width:36px;height:36px}
.cimg.xl{width:100%;height:auto;aspect-ratio:4/3;border-radius:16px}
.cimg.xl>svg{width:48px;height:48px}
.casaitem.big{padding:12px}
.casaitem.done .cimg{opacity:.55}
.okt{color:var(--ok);font-weight:600}
.offband{display:flex;gap:12px;align-items:center;background:var(--warnSoft);color:var(--warnInk);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.offband>svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75}
.offband>div{flex:1;min-width:0;display:flex;flex-direction:column}.offband .btn{flex:none}
.convrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink)}
.convrow .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.convrow .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.convrow .r1 b{font:600 16px/1.3 var(--f-display)}
.convrow .cs{font-weight:600;color:var(--pri)}
.convrow .lm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convrow.un .lm{color:var(--ink);font-weight:600}
.convhead .top2{display:flex;gap:16px;align-items:center}
.convhead .cdata{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.convhead .cdata svg{width:15px;height:15px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.75}
.convjob{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.convjob .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.thread.conv{margin-top:16px}
.jobcard.pcard{display:flex;align-items:center;gap:12px;text-align:left}
.pcard .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pcard .ct b{font:600 16px/1.3 var(--f-display)}
.pcard .ct .small svg{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.75}
.pcard .meta:empty{display:none}
.pcard .go{width:18px;height:18px;transform:rotate(180deg);fill:none;stroke:var(--mut);stroke-width:1.75;flex:none}
.armado .todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.armado .todo button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left;color:var(--ink);cursor:pointer}
.armado .todo li+li button{border-top:1px solid var(--line)}
.armado .todo .tb{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.armado .todo .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.armado .todo .go{width:16px;height:16px;transform:rotate(180deg);fill:none;stroke:var(--mut);stroke-width:1.75;flex:none}
.gal{display:grid;grid-auto-flow:column;grid-auto-columns:42%;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-top:12px;padding-bottom:4px;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .gph{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:14px;overflow:hidden;background:var(--sunk);scroll-snap-align:start;cursor:pointer}
.gal .gph.cover{grid-column:span 2;aspect-ratio:auto}
.gal .gph img{width:100%;height:100%;object-fit:cover;display:block}
.gal .gph span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font:600 12px/1.3 var(--f-body);text-align:left}
.gal.pub{grid-auto-columns:70%}.gal.pub .gph.cover{grid-column:auto;aspect-ratio:1}
.galempty{display:flex;align-items:center;gap:12px;width:100%;margin-top:12px;border:2px dashed var(--line);box-shadow:none;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.galempty .ct{display:flex;flex-direction:column;gap:2px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid .gph{aspect-ratio:1;border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--sunk);cursor:pointer}
.pgrid .gph img{width:100%;height:100%;object-fit:cover;display:block}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat3 .card{padding:12px}
.stat3 b{display:block;font:700 20px/1.1 var(--f-display)}
.stat3 span{font-size:12px;color:var(--mut)}
.gedit{display:flex;flex-direction:column;gap:12px}
.gitem{display:flex;gap:12px;padding:10px}
.gimg{position:relative;width:96px;height:96px;flex:none;border-radius:10px;overflow:hidden;background:var(--sunk)}
.gimg img{width:100%;height:100%;object-fit:cover}
.gcov{position:absolute;left:6px;top:6px;font-size:11px}
.gside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;justify-content:space-between}
.gside .btn svg{width:14px;height:14px}
.gadd{cursor:pointer}
.lbox{border-radius:16px;overflow:hidden;background:var(--sunk)}.lbox img{width:100%;display:block;max-height:60vh;object-fit:contain}
.galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:24px}
.galcat{margin:22px 0 10px;font-size:16px}
.galitem{display:flex;flex-direction:column;gap:4px;font-size:12px}
.galitem .ph{aspect-ratio:1;border-radius:10px;background:var(--sunk);display:grid;place-items:center;overflow:hidden;color:var(--mut)}
.galitem .ph img{width:100%;height:100%;object-fit:cover}
.galitem .ph svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.75}
.galitem b{font-size:12px;line-height:1.2}
.galitem code{font-size:10px;color:var(--mut)}
.tmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tmeta .small{display:inline-flex;align-items:center;gap:4px}
.tmeta svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.75}
.tfacts{display:flex;gap:20px;flex-wrap:wrap;padding:12px 14px;background:var(--sunk);border-radius:12px}
.tfacts>div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.tfacts>div>span:first-child{font-size:12px;color:var(--mut)}
.tfacts b{font:600 16px/1.2 var(--f-display)}
.guiacard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;cursor:pointer;color:var(--ink);padding:12px}
.guiacard .ct{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.guiacard .ct b{font:600 16px/1.3 var(--f-display)}
.guiacard .go{width:18px;height:18px;transform:rotate(180deg);fill:none;stroke:var(--mut);stroke-width:1.75;flex:none}
.gprog{display:block;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.gprog i{display:block;height:100%;background:var(--ok);border-radius:99px}
#log .guiacard{align-self:stretch}
.tut.guia{margin-bottom:8px}
.kitgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kititem{display:flex;flex-direction:column;gap:8px;padding:10px;border:0;text-align:left;cursor:pointer;color:var(--ink)}
.kititem b{font:600 14px/1.25 var(--f-display)}
.statbtn{border:0;text-align:left;cursor:pointer;color:var(--ink)}
.statbtn span{display:inline-flex;align-items:center;gap:4px}
.statbtn span svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75}

/* ---------- prestadores y pedidos ---------- */
.offer{display:grid;gap:12px}
.offer .top2{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--priSoft);color:var(--pri)}
.av.lg{width:64px;height:64px;font-size:24px}
.price{font:700 24px/1 var(--f-display);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.quote{font-size:14px;color:var(--mut);border-left:3px solid var(--line);padding-left:12px}
.list{display:grid;gap:12px}
.jobcard{display:grid;gap:8px;text-align:left;width:100%;color:var(--ink)}
.jobcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{text-align:center;padding:32px 16px;color:var(--mut)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--line);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.thread .m{font-size:16px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;border:1px solid transparent;border-radius:24px;padding:12px 16px;background:var(--sunk)}
.sendrow input:focus{outline:none;border-color:var(--line);background:var(--surface)}
.back{border:0;background:none;color:var(--pri);font-weight:700;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.ratebtns{display:flex;gap:8px}
.ratebtns button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 0;font:700 18px/1 var(--f-display)}
.ratebtns button.on{border-color:var(--acc);background:var(--warnSoft);color:var(--warnInk)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .card b{display:block;font:700 24px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat .card span{font-size:14px;color:var(--mut)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--ok)}.tg.on::after{left:25px}
details.offerf{margin-top:4px}

.maplibregl-map{font-family:var(--f-body)}
.maplibregl-popup-content{border-radius:14px;padding:12px 16px;box-shadow:0 10px 26px -10px rgba(0,0,0,.35);font-size:14px;color:#1E2A24}
.maplibregl-popup-close-button{font-size:18px;padding:2px 8px;color:#5C6B62}
.maplibregl-ctrl-attrib{font-size:12px}
.pinm{cursor:pointer;width:30px;height:38px}
.pinm svg{width:30px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .15s}
.pinm.on svg{transform:scale(1.25)}
.fercard{cursor:pointer}
.sub{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.sub svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}
.sub .ok{color:var(--ok);font-weight:600}
.sub .warn{color:var(--warnInk);font-weight:600}
.sub .sep::before{content:"·";margin-right:8px;color:var(--line)}
.stagetxt{font:600 14px/1.2 var(--f-body);color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.stagetxt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.stagetxt.y::before{background:var(--acc)}.stagetxt.v::before{background:var(--ok)}.stagetxt.r::before{background:var(--bad)}.stagetxt.n::before{background:var(--pri)}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.textlink{color:var(--pri);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
button.textlink{border:0;background:none;padding:0;cursor:pointer;font:600 14px/1.3 var(--f-body)}
.review{border-top:1px solid var(--line);padding-top:12px}
.legal ul.cred{padding-left:18px;font-size:13px;line-height:1.45}.legal ul.cred li{margin-bottom:6px}.legal ul.cred a{color:var(--pri)}
.review:first-child{border-top:0;padding-top:0}
/* ---------- detalle del arreglo ---------- */
.jhead{margin:4px 0 16px}
.offers{gap:16px}
.offer2{display:grid;gap:14px;padding:18px}
.offer2 .obest{justify-self:start}
.oh{display:flex;gap:12px;align-items:center}
.oh .on{flex:1;min-width:0;display:grid;gap:2px}
.oh .on h3{margin:0;font-size:17px;line-height:1.2}
.oh .op{flex:none;display:grid;justify-items:end;gap:4px;text-align:right}
.oh .op span{font-size:12px;color:var(--mut)}
.odet{list-style:none;margin:0;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;gap:10px}
.odet li{display:grid;grid-template-columns:20px 84px 1fr;gap:8px;align-items:start;font-size:14px}
.odet li svg{width:18px;height:18px;fill:none;stroke:var(--mut);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;margin-top:1px}
.odet li>span{color:var(--mut)}
.odet li b{font-weight:600}
.odet .oinc div{display:flex;flex-wrap:wrap;gap:6px}
.oact{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{display:grid;gap:12px;padding:18px}
.pcard .pver{justify-self:start}
.pcard .pver .go{width:16px;height:16px;transform:rotate(180deg);fill:none;stroke:currentColor;stroke-width:2}
.chatcard{padding:16px}
.chatcard .thread{margin:0 0 16px;gap:10px}
.chatcard .chint{display:flex;align-items:center;gap:6px;margin:12px 0 0}
.chatcard .chint svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;flex:none}
.revcard{padding:18px}
.revcard h3{margin:0 0 4px}
.jcancel{margin-top:24px;text-align:center}
.chatcard .m.sysl{border-radius:12px;font-size:13px;text-wrap:balance}
.jhead .tag{font-size:13px;padding:6px 10px}

/* ---------- chat con el prestador ---------- */
.chatentry{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);padding:16px}
.chatentry .ce{flex:1;min-width:0;display:grid;gap:2px}
.chatentry .ce b{font:600 16px/1.25 var(--f-display)}
.chatentry .ce .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatentry .go{width:18px;height:18px;transform:rotate(180deg);fill:none;stroke:var(--mut);stroke-width:2;flex:none}
.jfin{display:grid;gap:4px;text-align:center}
.pchead{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(8px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.pchead .pt{flex:1;min-width:0;display:grid;gap:1px}
.pchead .pt b{font:600 16px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchead .pt .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pchead .av{width:40px;height:40px;font-size:14px}
#plog{flex:1;min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px}
#plog .m.bot:has(+ .m.bot){border-bottom-left-radius:6px}
#plog .m.bot + .m.bot{border-top-left-radius:6px}
#plog .m.sys{border-radius:12px;background:var(--sunk);padding:6px 12px;font-size:13px;text-wrap:balance;text-align:center;margin:6px 0}
#plog .chint{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 0}
#plog .chint svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.75;flex:none}
.pcclosed{text-align:center;padding:16px}

/* Fotos mandadas en el chat: sin globo, directo sobre el fondo */
.m.u.pics{background:transparent;padding:0;width:212px;max-width:62%;border-radius:0}
.m.u.pics .mimgs{display:grid;gap:4px;margin:0;max-width:none;grid-template-columns:repeat(2,1fr)}
.m.u.pics .mimgs.n1{grid-template-columns:1fr}
.m.u.pics:has(.n1){width:150px}
.m.u.pics .mimgs img{width:100%;max-width:none;margin:0;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}
.m.u.pics .mimgs.n1 img{aspect-ratio:auto;max-height:260px}
.m.u.pics + .m.u{margin-top:2px}
/* Con el teclado abierto se esconde el menú de abajo */
body.kb #nav{display:none}
body.kb .composer{padding-bottom:8px}
</style>
</head>

    r.onload = () => { const img = new Image(); img.onerror = mal; img.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .78)); }; img.src = r.result; };
    r.readAsDataURL(f); });
}

let REC = null;
ACT.mic = async () => {
  if (REC) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') { toast('Este navegador no permite grabar audio'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { toast('Para mandar audios, permití el uso del micrófono'); return; }
  let mr; try { mr = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(t => t.stop()); toast('No se pudo empezar a grabar'); return; }
  REC = {mr, stream, chunks:[], t0:Date.now(), cancel:false};
  mr.ondataavailable = e => { if (e.data && e.data.size) REC && REC.chunks.push(e.data); };
  mr.onstop = async () => {
    const r = REC; REC = null; stream.getTracks().forEach(t => t.stop()); clearInterval(r.timer); recUI(false);
    if (r.cancel) return;
    const dur = (Date.now() - r.t0) / 1000;
    if (dur < 1) { toast('El audio es muy corto'); return; }
    const blob = new Blob(r.chunks, {type:mr.mimeType || 'audio/webm'});
    let audio;
    try { audio = await toWav(blob); } catch (e) { audio = {mime:(blob.type || 'audio/webm').split(';')[0], data:await b64(await blob.arrayBuffer())}; }
    sendAudio(blob, audio, dur);

    const sec = Math.floor((Date.now() - REC.t0) / 1000); const el = chatEl.querySelector('#recT'); if (el) el.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (sec >= 60) ACT.recStop();
  }, 250);
  mr.start(); recUI(true);
};
ACT.recStop = () => { if (REC && REC.mr.state !== 'inactive') REC.mr.stop(); };
ACT.recCancel = () => { if (REC) { REC.cancel = true; if (REC.mr.state !== 'inactive') REC.mr.stop(); } };
function recUI(on) { if (!chatEl) return; chatEl.querySelector('.composer .bar').hidden = on; chatEl.querySelector('#recbar').hidden = !on; if (on) chatEl.querySelector('#recT').textContent = '0:00'; }
async function b64(buf) { const u8 = new Uint8Array(buf); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }

  w(0, 'RIFF'); v.setUint32(4, 36 + d.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);

}

async function ai(txt, imgs, t, audio, bub) {
  imgs = imgs || []; const img = imgs[0] || null;
  CH.h.push({role:'user', text:txt || (audio ? '(audio)' : imgs.length > 1 ? `Te mando ${imgs.length} fotos del problema.` : 'Te mando una foto del problema.'), images:imgs.map(x => ({mime:'image/jpeg', data:x.split(',')[1]})), audio:audio || null});
  CH.bub = bub || null;
  const th = say('<span class="typing" aria-label="Escribiendo"><i></i><i></i><i></i></span>', '', false);
  try {
    const body = JSON.stringify({tema_actual:CH.caso || '', messages:CH.h.slice(-12).map((m, i, a) => i < a.length - 1 ? {role:m.role, text:m.text} : m), catalog:Object.values(TUT).map(x => ({id:x.id, titulo:x.n, rubro:x.rubro, cuando:x.syn}))});
    let d = null, lastErr = null;
    for (let intento = 0; intento < 2 && !d; intento++) {
      if (intento) await new Promise(r => setTimeout(r, 1500));
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 32000);
      try {
        const res = await apiFetch(API_URL, {method:'POST', headers:{'content-type':'application/json'}, signal:ctl.signal, body});
        const j = await res.json().catch(() => null);
        if (res.status === 429 || res.status === 401) { lastErr = new Error(res.status === 429 ? 'limite' : 'sin_sesion'); break; }
        if (res.ok && j && j.ok) d = j; else { lastErr = new Error((j && j.error) || 'api'); if (j && j.detail) console.warn('IA:', j.detail); }
      } catch (err) { lastErr = err; }
      clearTimeout(to);
    }
    if (!d) throw lastErr || new Error('api');
    if (d.audioPerdido && audio) { th.remove(); CH.h.pop(); CH.resp.pop(); say('Ahora no puedo escuchar audios. Escribime con palabras qué pasa y te ayudo igual.'); return; }
    th.remove(); if (AI_OK !== true) { AI_OK = true; setMode(); }
    handleAI(d.reply, t);
  } catch (e) {
    th.remove(); console.warn('IA no disponible:', e);
    if (e && e.message === 'limite') { CH.h.pop(); say('Hiciste muchas consultas seguidas. Esperá un minuto y seguimos.', 'sys', false); return; }
    AI_OK = false; setMode(); CH.h.pop();
    clearTimeout(AI_RETRY); AI_RETRY = setTimeout(() => { AI_OK = null; setMode(); }, 60000);
    if (audio) { say('Ahora no me puedo conectar para escuchar audios. Escribime con palabras qué pasa y te ayudo igual.'); return; }
    if (!CH.started && !startConsulta()) return;

}

    if (tx && CH.bub) { const el = CH.bub.querySelector('.tr'); el.textContent = '“' + tx + '”'; el.hidden = false; }
    const h = tx && HARD.find(x => x.re.test(tx.toLowerCase()));

  }

  if (r.tema_nuevo && CH.caso) {

    resetTopic(); CH.h = [last]; CH.resp = [last.text]; if (last.images && last.images[0]) CH.img = 'data:image/jpeg;base64,' + last.images[0].data;
  }

  // Si ya le pasé la guía de este problema, no la repito: lo mando a la de más arriba
  if (CH.tutObj && !r.tema_nuevo && r.estado === 'guiar') {
    say(r.mensaje ? msg : 'Buenísimo, seguí con la guía que te dejé en Arreglos → En curso.');
    return chips([['Abrir la guía', () => ACT.toTut(), 'p'], ['Lo resolví', () => resolved()], ['No pude, quiero un profesional', () => { CH.intentos = 'Siguió la guía de HandyGo y no pudo resolverlo'; say('No pude, quiero un profesional', 'u'); derivar(); }]]);

    return showTut({id:'gen', gen:true, n:r.caso || 'Tu arreglo', rubro:CH.rubro || 'Carpintería', lvl:r.nivel || 'Fácil', min:r.minutos || 20,

      ctx:(CH.resp || []).join(' '), pz:(r.piezas || []).filter(id => GLOS_ID[id]),
      glos:(r.glosario || []).filter(g => g && g.termino && !termsIn(g.termino, tutCtx({n:r.caso, ctx:(CH.resp || []).join(' '), rubro:CH.rubro, steps:r.pasos.map(x => ['', x]), mat:(r.materiales || []).map(([n, a]) => ['', n, a])})).length).map(g => ({n:g.termino, q:g.que_es || '', d:g.donde || '', p:g.imagen || g.termino, s:g.firma || ''}))});
