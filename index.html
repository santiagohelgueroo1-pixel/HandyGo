<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandyGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26573F">
<meta name="description" content="Te ayudamos a resolverlo, te conectamos si hace falta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo teléfono; en compu se muestra dentro de un marco de celular.
   Identidad HandyGo: verde bosque, verde menta, ámbar para botones y alertas; Poppins + Inter. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --sunk:#EAEFE8; --ink:#1E2A24; --mut:#5C6B62; --line:#D8E0D9;
  --pri:#26573F; --priInk:#FFFFFF; --priSoft:#E3F0E5; --mint:#B1D8B7;
  --acc:#F2B33D; --accInk:#1E2A24;
  --warnSoft:#FDF1D8; --warnInk:#7A4E00;
  --bad:#B8381F; --badSoft:#FBEAE5; --ok:#2E7D4F; --okSoft:#E3F2E8;
  --desk:#DCE4DD; --frame:#1E2A24; --head:#26573F; --headInk:#FFFFFF; --dark:#1E2A24;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#7FD39E; --okSoft:#16301F;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#7FD39E; --okSoft:#16301F;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.r1>span{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.device{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){
  body{display:grid;place-items:center;padding-block:20px}
  .device{width:400px;height:min(860px,100%);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 80px -30px rgba(20,40,30,.55)}
}

/* ---------- encabezado con borde de cinta métrica ---------- */
.top{position:relative;flex:none;background:var(--head);color:var(--headInk);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 7px no-repeat}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{display:block;flex:none;border-radius:22%;object-fit:cover}
.top .mark{width:36px;height:36px;box-shadow:0 0 0 1.5px var(--mint)}
.top h1{margin:0;font:700 20px/1.1 var(--f-display);letter-spacing:-.01em}
.top small{display:block;font:500 12.5px/1.3 var(--f-body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:99px;padding:7px 12px;font:700 13px/1 var(--f-body);background:var(--acc);color:var(--accInk);display:inline-flex;gap:6px;align-items:center}
.pill.off{background:rgba(255,255,255,.16);color:var(--headInk)}
body.prov .top{background:var(--dark)}

/* ---------- vista y navegación ---------- */
#view{flex:1;min-height:0;overflow-y:auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font:600 11.5px/1 var(--f-body);position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--f-body)}

/* ---------- tipografía y piezas ---------- */
h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 6px;text-wrap:balance}
h3{font:700 17px/1.25 var(--f-body);margin:0}
.eyebrow{font:700 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mut{color:var(--mut)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-top:26px}
.sec>.eyebrow{display:block;margin-bottom:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:12px 16px;font:700 15.5px/1.1 var(--f-body);text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.g{border-color:var(--line);color:var(--mut);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12.5px/1 var(--f-body);padding:5px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.v{background:var(--okSoft);color:var(--ok)}
.tag.r{background:var(--warnSoft);color:var(--warnInk)}
.tag.b{background:var(--priSoft);color:var(--pri)}
.tag.y{background:var(--acc);color:var(--accInk)}
.stars{color:var(--acc);letter-spacing:1px}
.num{font-variant-numeric:tabular-nums}

label.f{display:block;font:600 14px/1.3 var(--f-body)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pri);outline:none}
.hint{font-size:13px;color:var(--mut);font-weight:400;margin-top:4px;display:block}
.err{color:var(--bad);font-weight:600;font-size:14.5px;min-height:20px}

/* ---------- bienvenida ---------- */
.hero{background:var(--head);color:var(--headInk);margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) 34px max(20px,env(safe-area-inset-left,0px));position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.hero .mark{width:64px;height:64px;box-shadow:0 0 0 2px var(--mint)}
.hero h2{font-size:38px;line-height:1.05;margin:22px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;opacity:.9;max-width:32ch}
.pillars{display:grid;gap:10px;margin:22px 0 18px}
.pillar{display:flex;gap:12px;align-items:flex-start}
.pillar .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.pillar .ico.r{background:var(--warnSoft);color:var(--warnInk)}
.pillar .ico.v{background:var(--okSoft);color:var(--ok)}
.pillar svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font-size:15.5px}
.pillar span{font-size:14px;color:var(--mut)}
.role{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.role:hover{border-color:var(--pri)}
.role .ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.role .ico.y{background:var(--acc);color:var(--accInk)}
.role svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role b{display:block;font-size:17px;margin-bottom:2px}
.role span{font-size:14px;color:var(--mut)}

/* ---------- chat ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;align-self:flex-start;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);border-color:var(--pri);color:var(--priInk);border-radius:18px 18px 6px 18px}
.m.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
.m img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:6px}
.m.sys{align-self:center;background:transparent;border:0;font-size:13px;color:var(--mut);padding:2px}
.who{display:flex;align-items:center;gap:6px;font:700 12px/1 var(--f-body);color:var(--mut);margin:4px 0 -4px 2px}
.who .mark{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .m,.chips{animation:in .22s ease-out}
}
@keyframes blink{50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chips button{border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:99px;padding:8px 14px;font:600 14.5px/1.15 var(--f-body);text-align:left}
.chips button.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);max-height:110px;line-height:1.35}
.composer textarea:focus{outline:none;border-color:var(--pri)}
.iconbtn{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--mut);display:grid;place-items:center}
.iconbtn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attach{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;color:var(--mut)}
.attach img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.attach button{border:0;background:none;color:var(--bad);font-weight:700}
.chatbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.chatbar b{color:var(--ink)}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.off i{background:var(--mut)}

/* ---------- freno de seguridad ---------- */
.stop{border:2px solid var(--acc);background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:100%;align-self:stretch}
.stop .stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1E2A24 12px 24px)}
.stop .in{padding:14px}
.stop h4{margin:0 0 6px;font:700 22px/1 var(--f-display);color:var(--warnInk);display:flex;gap:8px;align-items:center}
.stop h4 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stop p{margin:6px 0;font-size:15px}
.stop .now{background:var(--warnSoft);color:var(--warnInk);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:10px 0}
.stop .rule{font-size:12.5px;color:var(--mut);margin-top:6px}

/* ---------- tutorial ---------- */
.tut{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:stretch}
.tut .hd{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.tut .hd h4{margin:6px 0 8px;font:700 19px/1.1 var(--f-display);font-stretch:110%}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.steps{list-style:none;margin:0;padding:6px 0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 14px}
.steps li+li{border-top:1px dashed var(--line)}
.steps .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.steps label{flex:1;display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.steps .n{font:700 12px/1 var(--f-mono);color:var(--mut);margin-top:4px}
.steps input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin:0 0 0 auto}
.steps li.done span.t{text-decoration:line-through;color:var(--mut)}
.warn{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:var(--warnSoft);color:var(--warnInk);font-size:14px;font-weight:600}
.tut .ft{padding:12px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--line);background:var(--sunk)}

/* ---------- orden de caso ---------- */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;font-size:14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.m .ticket::before,.m .ticket::after{background:var(--bg)}
.ticket .tk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 12px/1 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ticket h4{margin:8px 0 12px;font:700 17px/1.25 var(--f-body)}
.ticket dl{margin:0;padding-top:12px;border-top:2px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.ticket dt{font:700 11.5px/1.5 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ticket dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ticket .photo{width:64px;height:64px;object-fit:cover;border-radius:8px}

/* ---------- prestadores y pedidos ---------- */
.offer{display:grid;gap:10px}
.offer .top2{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--priSoft);color:var(--pri)}
.av.lg{width:64px;height:64px;font-size:22px}
.price{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.quote{font-size:14.5px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px}
.list{display:grid;gap:10px}
.jobcard{display:grid;gap:8px;text-align:left;width:100%;color:var(--ink)}
.jobcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{text-align:center;padding:30px 14px;color:var(--mut)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.thread .m{font-size:15px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface)}
.back{border:0;background:none;color:var(--pri);font-weight:700;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.ratebtns{display:flex;gap:6px}
.ratebtns button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font:700 18px/1 var(--f-display)}
.ratebtns button.on{border-color:var(--acc);background:var(--warnSoft);color:var(--warnInk)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card b{display:block;font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat .card span{font-size:13px;color:var(--mut)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--ok)}.tg.on::after{left:25px}
details.offerf{margin-top:4px}
details.offerf summary{list-style:none;cursor:pointer}
details.offerf summary::-webkit-details-marker{display:none}
details.offerf[open] summary{display:none}

/* ---------- materiales ---------- */
.mat{display:flex;gap:12px;align-items:flex-start}
.mat .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--sunk);color:var(--ink);display:grid;place-items:center}
.ask{margin-top:6px;font:500 13px/1.4 var(--f-mono);background:var(--sunk);border-radius:8px;padding:6px 8px;display:block}
.ad{display:flex;gap:12px;align-items:center;border:1px dashed var(--mut);border-radius:var(--r);padding:12px;background:var(--surface)}
.ad .lg{flex:none;width:44px;height:44px;border-radius:10px;background:var(--mint);color:var(--accInk);display:grid;place-items:center;font:700 18px/1 var(--f-display)}
.map{display:block;width:100%;height:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk)}
.map .st{stroke:var(--surface)}
.map .av2{stroke:var(--line)}
.map text{font:700 10px var(--f-body);fill:var(--ink)}

/* ---------- hojas y avisos ---------- */

function useCredit(nuevo) {
  const u = me();
  if (u.cr <= 0) {
    say(nuevo ? '<b>Eso es un problema nuevo</b> y te quedaste sin consultas. Mirá un anuncio para sumar 2 o elegí un paquete.' : '<b>Te quedaste sin consultas.</b> Mirá un anuncio para sumar 2 o elegí un paquete.');

  say(nuevo ? `Nuevo problema · se usó 1 consulta (te quedan ${u.cr})` : `Consulta iniciada · te quedan ${u.cr}`, 'sys', false);

}

function onPic(e) {
  const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const img = new Image(); img.onload = () => {
      const max = 1024, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      pendingImg = c.toDataURL('image/jpeg', .8);
      const at = chatEl.querySelector('#att'); at.hidden = false; at.innerHTML = `<img src="${pendingImg}" alt="Foto adjunta"><span>Foto lista para enviar</span><button data-a="clearPic">Quitar</button>`;
    }; img.src = r.result; };
  r.readAsDataURL(f);
}
function clearPic() { pendingImg = null; const at = chatEl && chatEl.querySelector('#att'); if (at) { at.hidden = true; at.innerHTML = ''; } }
ACT.clearPic = clearPic;
ACT.send = () => { const i = chatEl.querySelector('#inp'); const t = i.value.trim(); if (!t && !pendingImg) return; i.value = ''; i.style.height = 'auto'; go(t, false); };

function go(txt, isReply) {
  const img = isReply ? null : pendingImg; clearPic();
  LOG().querySelectorAll('.chips').forEach(c => c.remove());
  say((img ? `<img src="${img}" alt="Foto enviada">` : '') + esc(txt || ''), 'u');
  const t = (txt || '').toLowerCase();
  const h = HARD.find(x => x.re.test(t));
  if (!CH.started) { if (!useCredit(false)) return; CH.started = true; }
  else if (h && !isReply && CH.topic !== 'hard:' + h.rubro) { if (!useCredit(true)) return; resetTopic(); CH.h = []; }
  if (img) CH.img = img;
  CH.resp.push(txt || '(foto)');
  if (h) return hardStop(h);
  ai(txt, img, t);
}

/* ---------- IA ---------- */
async function ai(txt, img, t) {
  CH.h.push({role:'user', text:txt || 'Te mando una foto del problema.', image:img ? {mime:'image/jpeg', data:img.split(',')[1]} : null});
  if (AI_OK === false) return rules(t, img);
  const th = say('<span class="typing" aria-label="Escribiendo"><i></i><i></i><i></i></span>', '', false);
  try {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 25000);
    const res = await fetch(API_URL, {method:'POST', headers:{'content-type':'application/json'}, signal:ctl.signal,
      body:JSON.stringify({tema_actual:CH.caso || '', messages:CH.h.slice(-12), catalog:Object.values(TUT).map(x => ({id:x.id, titulo:x.n, rubro:x.rubro, cuando:x.syn}))})});
    clearTimeout(to);
    const d = await res.json().catch(() => null);
    if (!res.ok || !d || !d.ok) throw new Error((d && d.error) || 'api');
    th.remove(); if (AI_OK !== true) { AI_OK = true; setMode(); }
    handleAI(d.reply, t);
  } catch (e) {
    th.remove(); console.warn('IA no disponible:', e);
    AI_OK = false; setMode(); CH.h.pop();
    say('Ahora no me puedo conectar con la IA, así que te ayudo con mis guías revisadas.', 'sys', false);
    rules(t, img);
  }
}
function handleAI(r, t) {
  if (r.tema_nuevo && CH.caso) {
    const last = CH.h[CH.h.length - 1];
    if (!useCredit(true)) { CH.h.pop(); CH.resp.pop(); return; }
    resetTopic(); CH.h = [last]; CH.resp = [last.text]; if (last.image) CH.img = 'data:image/jpeg;base64,' + last.image.data;
  }
  const msg = esc(r.mensaje || '¿Me contás un poco más?');
  CH.h.push({role:'assistant', text:r.mensaje || ''});
  if (r.caso) CH.caso = r.caso;
  if (RUBROS.includes(r.rubro)) CH.rubro = r.rubro;
  const tut = TUT[r.tutorial];
  if (r.estado === 'derivar' && r.riesgo) {
    const h = HARD.find(x => x.rubro === r.rubro);
    return hardStop({k:r.caso || (h ? h.k : 'Trabajo riesgoso'), rubro:RUBROS.includes(r.rubro) ? r.rubro : 'Albañilería', why:r.mensaje || (h ? h.why : ''),
      now:h ? h.now : 'Si hay riesgo inmediato, alejate de la zona y cortá la llave general.', rule:h ? h.rule : 'Intervención profesional'});
  }
  if (r.estado === 'preguntar') { say(msg); if ((r.opciones || []).length) chips(r.opciones.slice(0, 3).map(o => [String(o), () => go(String(o), true)])); return; }
  if (r.estado === 'guiar' && tut) { say(msg); return showTut(tut); }
  if (r.estado === 'guiar' && !tut) { say('Para esto todavía no tengo una guía revisada por HandyGo y no quiero improvisar. Lo mejor es que lo vea un profesional.'); return derivar(); }
  if (r.estado === 'derivar') { say(msg); return derivar(); }
  say(msg);
}

/* ---------- reglas (sin conexión) ---------- */
function rules(t, img) {
  if (CH.pend) { // respuesta a la pregunta de acotado
    const tut = TUT[CH.pend]; CH.pend = null;
    const o = tut.o.find(x => x[0].toLowerCase() === t);
    if (o && o[1] === 'ok') return showTut(tut);
    if (o && o[1] === 'pro') { say('Con eso, <b>conviene que lo vea un profesional</b>.'); return derivar(); }
  }
  const tut = Object.values(TUT).find(x => x.re.test(t));
  if (!tut) {
    say(img && !t ? 'Recibí la foto. Para orientarte sin conexión necesito que me cuentes con palabras qué pasa, por ejemplo “la canilla gotea” o “la puerta no cierra”.'
                 : 'No llegué a entender qué se rompió. Probá con otras palabras, por ejemplo “la canilla gotea”, “la puerta roza”, “el inodoro pierde agua” o “se quemó la lámpara”.');
    return;
  }
  if (CH.topic && CH.topic !== tut.id) { const keep = CH.resp[CH.resp.length - 1]; if (!useCredit(true)) { CH.resp.pop(); return; } resetTopic(); CH.resp = [keep]; }
  CH.topic = tut.id; CH.caso = tut.n; CH.rubro = tut.rubro; CH.pend = tut.id;
  say(`Entendido: <b>${esc(tut.n)}</b>. Una pregunta para acotar:<br>${esc(tut.q)}`);
  chips(tut.o.map(([lbl]) => [lbl, () => go(lbl, true)]));
}

/* ---------- freno de seguridad ---------- */
function hardStop(h) {
  CH.topic = 'hard:' + h.rubro;
  CH.hard = true; CH.caso = CH.caso || h.k; CH.rubro = h.rubro; CH.intentos = 'Ninguno · derivado por seguridad, sin pasos';
  block(`<div class="stop" role="alert"><div class="stripe"></div><div class="in">
    <h4>${ico('alert')} Frená acá</h4>
    <p><b>${esc(h.k)}.</b> No te voy a dar pasos para hacerlo por tu cuenta.</p>
    <p>${esc(h.why)}</p>
    <div class="now">${esc(h.now || 'Ante cualquier riesgo, alejate de la zona y cortá la llave general.')}</div>
    <div class="rule">${esc(h.rule || '')}</div></div></div>`);
  const lbl = `Pedir un ${h.rubro === 'Gas' ? 'gasista matriculado' : h.rubro === 'Electricidad' ? 'electricista matriculado' : 'profesional'}`;
  chips([[lbl, () => { say(lbl, 'u'); derivar(); }, 'p'], ['Igual quiero hacerlo yo', () => insist(h)]]);
}
function insist(h) {
  say('Igual quiero hacerlo yo', 'u');
  say('Te entiendo, pero en este caso no te voy a dar instrucciones: el riesgo para vos y para tu casa es alto. Lo que sí puedo hacer es armarte el resumen para que el profesional llegue sabiendo qué pasa y te cobre solo lo necesario.');
  chips([['Armar el resumen y pedir presupuesto', () => { say('Armar el resumen y pedir presupuesto', 'u'); derivar(); }, 'p']]);
}

/* ---------- tutorial ---------- */
function showTut(tut) {
  CH.topic = tut.id;
  CH.tut = tut.id; CH.caso = tut.n; CH.rubro = tut.rubro; CH.hard = false; CH.pend = null;
  const id = 't' + uid();
  const b = block(`<div class="tut" id="${id}"><div class="hd"><span class="eyebrow">Guía paso a paso · revisada por HandyGo</span><h4>${esc(tut.n)}</h4>
     <div class="row" style="margin-bottom:10px"><span class="tag v">${tut.lvl}</span><span class="tag">≈ ${tut.min} min</span><span class="tag">${tut.steps.length} pasos</span></div>
     <div class="prog"><i></i></div></div>
   <ol class="steps">${tut.steps.map(([ic, tx], i) => `<li><span class="ic">${ico(ic)}</span><label><span class="n num">${String(i + 1).padStart(2, '0')}</span><span class="t">${esc(tx)}</span><input type="checkbox" aria-label="Paso ${i + 1} hecho"></label></li>`).join('')}</ol>
   ${tut.alert ? `<div class="warn">⚠ ${esc(tut.alert)}</div>` : ''}
   <div class="ft"><button class="btn sm" data-a="tab" data-v="mat">${ico('box')} Ver materiales y ferreterías cerca</button></div></div>`);
  const box = b.querySelector('.tut');
  box.addEventListener('change', () => {
    const all = box.querySelectorAll('input'), done = [...all].filter(x => x.checked);
    box.querySelectorAll('li').forEach((li, i) => li.classList.toggle('done', all[i].checked));
    box.querySelector('.prog i').style.width = (done.length / all.length * 100) + '%';
  });
  chips([['Lo resolví', () => resolved(), 'p'], ['No pude, quiero un profesional', () => { CH.intentos = 'Siguió la guía de HandyGo y no pudo resolverlo'; say('No pude, quiero un profesional', 'u'); derivar(); }]]);
}
function resolved() {
  say('Lo resolví', 'u');
  const u = me(); u.resueltos = (u.resueltos || 0) + 1; save();
  say(`¡Bien ahí! Te ahorraste una visita de ${CH.rubro ? CH.rubro.toLowerCase() : 'un profesional'} (≈ ${money(BASE[CH.rubro] || 18000)}). Si vuelve a pasar, acá estoy.`);
  chips([['Nueva consulta', () => ACT.newCase()]]);
}

/* ---------- derivación ---------- */
function summary() {
  return {caso:CH.caso || 'Problema del hogar', rubro:CH.rubro || 'Plomería', hard:CH.hard, code:CH.code,
    desc:CH.resp.filter(x => x && x !== '(foto)').join(' · ') || 'Ver foto adjunta',
    intentos:CH.intentos || (CH.tut ? 'Siguió la guía de HandyGo' : 'Ninguno'), img:CH.img};
}
function ticketHTML(s, extra = '') {
  return `<div class="ticket"><div class="tk"><span>Orden de caso</span><span>${esc(s.code)}</span></div>
   <h4>${esc(s.caso)}</h4>
   <dl><dt>Rubro</dt><dd>${esc(s.rubro)}${s.hard ? ' · <span class="tag r">Requiere matriculado</span>' : ''}</dd>
   <dt>Relato</dt><dd>${esc(s.desc)}</dd>
   <dt>Intentos</dt><dd>${esc(s.intentos)}</dd>
   ${s.zona ? `<dt>Zona</dt><dd>${esc(s.zona)}</dd>` : ''}
   ${s.img ? `<dt>Foto</dt><dd><img class="photo" src="${s.img}" alt="Foto del problema"></dd>` : ''}${extra}</dl></div>`;
}
function derivar() {
  if (!CH.rubro) CH.rubro = 'Plomería';
  say('Te armé un resumen del caso. El prestador lo recibe antes de presupuestar, así no empieza de cero.');
  const s = summary(); s.zona = me().zona;
  block(`<div style="width:100%">${ticketHTML(s)}</div>`);
  chips([[`Enviar a prestadores de ${CH.rubro.toLowerCase()}`, () => pedir(), 'p']]);
}
function pedir() {
  const u = me(), s = summary();
  const j = {id:'j' + uid(), uid:u.id, un:u.nombre, zona:u.zona, caso:s.caso, rubro:s.rubro, hard:s.hard, code:s.code, desc:s.desc, intentos:s.intentos, img:s.img, estado:'nuevo', offers:[], msgs:[], ts:Date.now()};
  DB.jobs.unshift(j); save();
  say(`Listo. Enviamos tu caso <b class="num">${esc(j.code)}</b> a prestadores verificados de ${esc(j.rubro.toLowerCase())} en tu zona. Los presupuestos van a aparecer en <b>Pedidos</b>.`);
  chips([['Ver mi pedido', () => { V.tab = 'ped'; V.job = j.id; render(); }, 'p'], ['Nueva consulta', () => ACT.newCase()]]);
  const ps = PROVS.filter(p => p.r === j.rubro);
  const msgs = ['Hola, vi tu caso. Con el resumen ya sé qué llevar. Puedo pasar mañana a la mañana.', 'Buenas, puedo ir esta semana. El precio incluye la visita y la mano de obra.'];
  ps.forEach((p, i) => setTimeout(() => {
    const jj = DB.jobs.find(x => x.id === j.id); if (!jj || jj.estado !== 'nuevo') return;
    jj.offers.push({pid:p.id, precio:BASE[j.rubro] + (i ? 4000 : 0) + Math.round(Math.random() * 3) * 1000, msg:msgs[i % 2], when:i ? 'Jueves 14 a 18 h' : 'Mañana 9 a 12 h'}); save();
    toast('Nuevo presupuesto de ' + p.n);
    if (DB.cur && DB.cur.t === 'u' && ((V.tab === 'ped' && !V.job) || V.job === jj.id)) render(); else if (DB.cur) renderNav();
  }, 2500 + i * 2800));
}

  sheet(`<div class="top2" style="display:flex;gap:14px;align-items:center"><span class="av lg">${ini(p.n)}</span><div><h2 style="margin:0">${esc(p.n)}</h2><span class="mut">${esc(p.r)} · ${esc(p.z || 'CABA')}</span></div></div>
   <div class="meta" style="margin:14px 0"><span class="tag v">${ico('shield')} DNI verificado (RENAPER)</span>${p.m ? `<span class="tag b">${esc(p.m)}</span>` : '<span class="tag">Oficio sin matrícula obligatoria</span>'}</div>
   <div class="stat"><div class="card"><b>${typeof p.s === 'number' ? String(p.s).replace('.', ',') : '—'}</b><span>${p.v} reseñas</span></div><div class="card"><b class="num">${p.y}</b><span>años de experiencia</span></div></div>
   <p class="mut small" style="margin:12px 0">${esc(p.resp || '')}</p>
   <span class="eyebrow">Reseñas</span><div class="card stack" style="margin-top:8px">${(p.rev || []).length ? p.rev.map(([n, c, s]) => `<div class="review"><span class="stars">${'★'.repeat(s)}</span> <b>${esc(n)}</b><div class="small mut">${esc(c)}</div></div>`).join('') : '<span class="mut small">Todavía no tiene reseñas.</span>'}</div>
   <button class="btn g w" style="margin-top:14px" data-a="close">Cerrar</button>`);
};
ACT.acc = i => {
  const j = DB.jobs.find(x => x.id === V.job), o = j.offers[+i];
  Object.assign(j, {prov:o.pid, precio:o.precio, estado:'aceptado'});
  j.msgs.push({f:'p', t:`¡Gracias por elegirme! Quedamos ${o.when.toLowerCase()}. Ya leí el resumen del caso.`});
  save(); toast('Presupuesto aceptado'); render();
};
ACT.msg = () => {
  const j = DB.jobs.find(x => x.id === V.job), i = $('#mi'), t = i.value.trim(); if (!t) return;
  j.msgs.push({f:DB.cur.t, t}); save(); render();
  const auto = DB.cur.t === 'u' ? PROVS.some(p => p.id === j.prov) : j.uid === 'demo';
  if (auto) setTimeout(() => { j.msgs.push({f:DB.cur.t === 'u' ? 'p' : 'u', t:DB.cur.t === 'u' ? 'Perfecto, te confirmo. Cualquier cosa me escribís por acá.' : 'Dale, te espero. Gracias.'}); save(); if (V.job === j.id) render(); }, 1400);
};
ACT.fin = () => { const j = DB.jobs.find(x => x.id === V.job); j.estado = 'finalizado'; j.fin = Date.now(); save(); toast('Trabajo finalizado'); render(); };

/* ============================================================
   PRESTADOR
   ============================================================ */
function provQueue() { const p = me(); if (!p || DB.cur.t !== 'p') return []; return DB.jobs.filter(j => j.estado === 'nuevo' && j.rubro === p.rubro && !j.offers.some(o => o.pid === p.id) && !(p.desc || []).includes(j.id)); }
function vPedP() {
  const p = me(), js = provQueue();
  view(`<h2>Pedidos nuevos</h2><p class="mut small">Clientes de tu zona que necesitan ${esc(p.rubro.toLowerCase())}, con el problema ya explicado.</p>
   ${!p.on ? '<div class="card" style="margin-top:10px;border-color:var(--acc)"><b>Estás como “No disponible”.</b><div class="small mut">No vas a recibir pedidos nuevos hasta que te actives.</div></div>' : ''}
   ${js.length ? `<div class="list" style="margin-top:12px">${js.map(j => `<button class="card jobcard" data-a="job" data-v="${j.id}">
     <div class="r1"><h3>${esc(j.caso)}</h3><span class="mut small" style="font-family:var(--f-mono)">${esc(j.code)}</span></div>
     <div class="small mut">${esc(j.desc)}</div>
     <div class="meta"><span class="tag">${ico('pin').replace('<svg', '<svg style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2"')} ${esc(j.zona.split(',')[0])}</span>${j.hard ? '<span class="tag r">Derivado por seguridad</span>' : ''}${j.img ? '<span class="tag b">Con foto</span>' : ''}</div></button>`).join('')}</div>`
   : emptyState('inbox', 'No hay pedidos nuevos', 'Cuando un vecino de tu zona necesite ' + esc(p.rubro.toLowerCase()) + ', te llega acá con el resumen del caso.')}`);
}
function offerForm(j) {
  return `<div class="sec card"><h3>Enviar presupuesto</h3><p class="mut small">El cliente compara precio, reseñas y disponibilidad.</p>
   <div class="stack" style="margin-top:10px">${field('pr', 'Precio (ARS)', 'number', String(BASE[j.rubro] || 20000))}
   <label class="f" for="pw">Disponibilidad<select id="pw"><option>Mañana 9 a 12 h</option><option>Mañana 14 a 18 h</option><option>Esta semana</option><option>Urgente · hoy</option></select></label>
   ${field('pm', 'Mensaje para el cliente', 'text', 'Ej: con el resumen ya sé qué llevar')}
   <button class="btn p w" data-a="offer">Enviar presupuesto</button><button class="btn g w" data-a="desc">Descartar pedido</button></div></div>`;
}
ACT.offer = () => {
  const j = DB.jobs.find(x => x.id === V.job), pr = +$('#pr').value;
  if (!pr || pr < 1000) { toast('Ingresá un precio válido'); return; }
  const o = {pid:DB.cur.id, precio:pr, when:$('#pw').value, msg:$('#pm').value.trim() || 'Hola, leí el resumen y puedo tomar el trabajo.'};
  j.offers.push(o); save(); toast('Presupuesto enviado'); V.job = null; V.tab = 'trab'; render();
  if (j.uid === 'demo') setTimeout(() => {
    Object.assign(j, {estado:'aceptado', prov:DB.cur.id, precio:pr}); j.msgs.push({f:'u', t:'Hola, me sirve tu presupuesto. ¿Te queda bien ' + o.when.toLowerCase() + '?'}); save();
    toast(first(j.un) + ' aceptó tu presupuesto'); if (DB.cur && DB.cur.t === 'p') { if (V.job && V.job !== j.id) renderNav(); else render(); }
  }, 3000);
};
ACT.desc = () => { const p = me(); (p.desc = p.desc || []).push(V.job); save(); V.job = null; render(); };
function vTrab() {
  const p = me(), js = DB.jobs.filter(j => j.prov === p.id || j.offers.some(o => o.pid === p.id));
  view(`<h2>Mis trabajos</h2>${js.length ? `<div class="list" style="margin-top:12px">${js.map(j => { const st = j.prov === p.id ? EST[j.estado] : (j.estado === 'nuevo' ? 'Presupuesto enviado' : 'Eligió a otro prestador'); return `<button class="card jobcard" data-a="job" data-v="${j.id}">
     <div class="r1"><h3>${esc(j.caso)}</h3><span class="price" style="font-size:17px">${j.prov === p.id ? money(j.precio) : ''}</span></div>
     <div class="meta"><span class="tag ${j.estado === 'finalizado' && j.prov === p.id ? 'v' : j.estado === 'aceptado' && j.prov === p.id ? 'b' : ''}">${st}</span><span class="tag">${esc(j.un)}</span></div></button>`; }).join('')}</div>`
   : emptyState('clip', 'Todavía no tenés trabajos', 'Cuando envíes presupuestos, los vas a seguir desde acá.')}`);
}
ACT.tog = () => { const p = me(); p.on = !p.on; save(); render(); };

/* ============================================================
   PERFIL
   ============================================================ */
function vPer() {
  const u = me(), t = DB.cur.t;
  if (t === 'u') {
    const js = DB.jobs.filter(j => j.uid === u.id);
    view(`<div style="display:flex;gap:14px;align-items:center"><span class="av lg">${ini(u.nombre)}</span><div style="min-width:0"><h2 style="margin:0">${esc(u.nombre)}</h2><span class="mut small">${esc(u.mail)} · ${esc(u.zona)}</span></div></div>
     <div class="stat" style="margin-top:16px"><div class="card"><b>${u.resueltos || 0}</b><span>problemas resueltos por tu cuenta</span></div><div class="card"><b>${js.length}</b><span>pedidos a profesionales</span></div></div>
     <div class="card" style="margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:10px"><div><b class="num">${u.cr} consultas</b><div class="small mut">Plan gratuito</div></div><button class="btn y sm" data-a="credits">Sumar</button></div>
     ${tail()}`);
  } else {
    const fin = DB.jobs.filter(j => j.prov === u.id && j.estado === 'finalizado');
    view(`<div style="display:flex;gap:14px;align-items:center"><span class="av lg" style="background:var(--acc);color:var(--accInk)">${ini(u.nombre)}</span><div style="min-width:0"><h2 style="margin:0">${esc(u.nombre)}</h2><span class="mut small">${esc(u.rubro)} · ${esc(u.zona)}</span></div></div>
     <div class="meta" style="margin:14px 0"><span class="tag v">${ico('shield')} Identidad verificada</span>${u.mat ? `<span class="tag b">Matrícula ${esc(u.mat)}</span>` : ''}<span class="tag">${u.anios} años de experiencia</span></div>
     <div class="card switch"><div><b>Disponible para pedidos</b><div class="small mut">Los clientes te ven en las búsquedas</div></div><button class="tg ${u.on ? 'on' : ''}" data-a="tog" aria-pressed="${u.on}" aria-label="Disponible"></button></div>
     <div class="stat" style="margin-top:10px"><div class="card"><b>${avg(u) === 'Nuevo' ? '—' : String(avg(u)).replace('.', ',')}</b><span>${u.rev.length} reseñas</span></div><div class="card"><b class="num" style="font-size:21px">${money(fin.reduce((a, j) => a + j.precio, 0))}</b><span>cobrado en ${fin.length} trabajo${fin.length === 1 ? '' : 's'}</span></div></div>
     ${u.rev.length ? `<div class="sec"><span class="eyebrow">Tus reseñas</span><div class="card stack">${u.rev.slice().reverse().map(r => `<div class="review"><span class="stars">${'★'.repeat(r.s)}</span> <b>${esc(r.from)}</b>${r.c ? `<div class="small mut">${esc(r.c)}</div>` : ''}</div>`).join('')}</div></div>` : ''}
     ${tail()}`);
  }
}
function tail() {
  return `<div class="sec stack"><button class="btn w" data-a="logout">Cerrar sesión</button><button class="btn g w" data-a="reset">Borrar datos del dispositivo</button>
   <p class="hint" style="text-align:center">HandyGo · Te ayudamos a resolverlo, te conectamos si hace falta.</p></div>`;
}

/* ---------- arranque ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
