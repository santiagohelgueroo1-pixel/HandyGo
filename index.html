ertas"},{"id":"marco","n":"Marco de la puerta","a":["el marco","marcos?"],"q":"Es la estructura fija alrededor de la puerta, donde van las bisagras y el agujero del pestillo.","d":"Rodeando la puerta, amurado a la pared.","ctx":"puerta|pestillo|bisagra|roza","neg":"ventana","c":"puertas"},{"id":"cerradura","c":"puertas","n":"Cerradura","a":["cerraduras?"],"q":"Es el mecanismo que traba la puerta con llave.","d":"Embutida en el canto de la puerta, del lado de la manija."},{"id":"cerradura_embutir","c":"puertas","n":"Cerradura de embutir","a":["cerraduras? de embutir"],"q":"Es la cerradura que va metida adentro de la puerta; solo se ven el frente y el cilindro.","d":"En el canto de la puerta. Se saca aflojando los tornillos del frente."},{"id":"cerrojo","c":"puertas","n":"Cerrojo","a":["cerrojos?"],"q":"Es una traba extra que se cierra con llave o con una perilla.","d":"En la puerta de entrada, arriba o abajo de la cerradura."},{"id":"pasador","c":"puertas","n":"Pasador","a":["pasador(es)?"],"q":"Es una traba que se corre a mano.","d":"En puertas de baño, ventanas y portones."},{"id":"cerradero","c":"puertas","n":"Cerradero (chapa del marco)","a":["cerraderos?","chapa del marco","contrafrente"],"q":"Es la chapita del marco donde entra el pestillo. Si la puerta no traba, muchas veces hay que correrla.","d":"En el marco, a la altura de la cerradura.","ctx":"puerta|marco"},{"id":"llave_puerta","c":"puertas","n":"Llave","a":["llaves? de (la )?puerta","copia de llave"],"q":"Es la llave de la cerradura. Si cuesta girar, poné grafito en el cilindro.","d":"Para hacer una copia, llevá la original a una cerrajería."},{"id":"tope_puerta","c":"puertas","n":"Tope de puerta","a":["topes? de puerta"],"q":"Es una pieza de goma que evita que la puerta golpee la pared.","d":"En el piso o el zócalo, detrás de donde abre la puerta."},{"id":"cierrapuertas","c":"puertas","n":"Cierrapuertas","a":["cierrapuertas","brazo hidr[aá]ulico"],"q":"Es el brazo que cierra la puerta sola y despacio.","d":"Arriba de la puerta. Tiene tornillos para regular la velocidad."},{"id":"mirilla","c":"puertas","n":"Mirilla","a":["mirillas?"],"q":"Es la lente chica de la puerta para ver quién está afuera.","d":"En la puerta de entrada, a la altura de los ojos."},{"id":"barredor","c":"puertas","n":"Burlete inferior de puerta","a":["barredor(es)?","burlete (de )?(la )?puerta","cepillo de la puerta"],"q":"Es la tira de goma o cepillo de abajo de la puerta que frena el aire y la tierra.","d":"En la parte de abajo de la puerta. Se atornilla o se pega."},{"id":"cadena_seguridad","c":"puertas","n":"Cadena de seguridad","a":["cadena de seguridad","traba de cadena"],"q":"Es una cadena que deja abrir la puerta solo un poco.","d":"En la puerta de entrada, del lado de adentro."},{"id":"bisagra_municion","c":"puertas","n":"Bisagra a munición","a":["bisagras? a munici[oó]n","munici[oó]n"],"q":"Es la bisagra de las puertas de madera, con un perno que se puede sacar.","d":"En el costado de la puerta y el marco. Un poco de lubricante la deja sin ruido.","ctx":"puerta"},{"id":"puerta_corrediza","c":"puertas","n":"Puerta corrediza","a":["puertas? corredizas?"],"q":"Es la puerta que se desliza sobre un riel en vez de abrirse.","d":"En placares, baños y divisiones. Las ruedas se limpian y se ajustan."},{"id":"bocallave","c":"puertas","n":"Bocallave","a":["bocallaves?","escudo de la cerradura"],"q":"Es la tapita de metal alrededor del agujero de la llave.","d":"En la puerta, alrededor de la cerradura."},{"id":"roseta","c":"puertas","n":"Roseta","a":["rosetas?"],"q":"Es el disco de metal que va detrás del picaporte, contra la puerta.","d":"En la base del picaporte."},{"id":"contramarco","c":"puertas","n":"Contramarco","a":["contramarcos?","tapajuntas"],"q":"Es la moldura de madera que tapa la unión entre el marco y la pared.","d":"Alrededor del marco de la puerta."},{"id":"hoja_puerta","c":"puertas","n":"Hoja de la puerta","a":["hoja de la puerta","puerta placa"],"q":"Es la puerta en sí, la parte que se mueve.","d":"Colgada de las bisagras."},{"id":"cerradura_electrica","c":"puertas","n":"Cerradura eléctrica","a":["cerraduras? el[eé]ctricas?","portero que abre la puerta"],"q":"Es la cerradura que abre el portero eléctrico.","d":"En la puerta de calle."},{"id":"manijon","c":"puertas","n":"Manijón","a":["manij[oó]n(es)?","tirador de puerta"],"q":"Es la manija fija grande de puertas de entrada o de vidrio.","d":"En la puerta de entrada."},{"id":"rodillo","n":"Rodillo de la persiana","a":["rodillo de arriba","rodillo"],"q":"Es el tubo que está arriba de la ventana, adentro de la caja de la persiana, donde se enrolla.","d":"Arriba de la ventana, detrás de una tapa (el cajón de la persiana).","ctx":"persiana|cortina de enrollar|enrollador","c":"ventanas"},{"id":"enrollador","n":"Enrollador de persiana","a":["enrollador(es)?"],"q":"Es la cajita en la pared donde se enrolla la cinta de la persiana.","d":"En la pared al lado de la ventana, a la altura de la mano.","c":"ventanas"},{"id":"cinta_persiana","n":"Cinta de persiana","a":["cintas? de (la )?persiana","la cinta (vieja|nueva)"],"q":"Es la tira de tela que tirás para subir y bajar la persiana.","d":"Sale del enrollador de la pared y sube hasta el rodillo de arriba.","c":"ventanas"},{"id":"manija_ventana","n":"Manija de la ventana","a":["manijas?"],"q":"Es la manija que gira para trabar y destrabar la ventana. En las de abrir se llama cremona.","d":"En el marco de la hoja de la ventana. Se sujeta con dos tornillos que quedan tapados por una tapita que gira.","ctx":"ventana|corrediz|aluminio|abertura","c":"ventanas"},{"id":"rueda_ventana","n":"Rueditas de la ventana corrediza","a":["ruedas?","rueditas?","roldanas?"],"q":"Son las ruedas chiquitas en la parte de abajo de la hoja, que corren sobre el riel. Si se gastan o se ensucian, la ventana se traba o hace ruido.","d":"Abajo de la hoja de la ventana o de la puerta corrediza. Para verlas hay que levantar la hoja y sacarla del riel.","ctx":"ventana|corrediz|placard|puerta corrediza|mampara","c":"ventanas"},{"id":"riel_corrediza","n":"Riel de la corrediza","a":["gu[ií]as?","riel(es)?"],"q":"Es la canaleta por donde corren las ruedas de la ventana o la puerta corrediza. Si junta tierra, la hoja se traba.","d":"Abajo (y a veces arriba) del marco. Se limpia con aspiradora y un pincel.","ctx":"ventana|corrediz|placard|mampara|puerta corrediza","c":"ventanas"},{"id":"riel_cortina","n":"Riel de la cortina","a":["gu[ií]as?","riel(es)?"],"q":"Es el perfil donde se cuelgan y corren los ganchitos de la cortina.","d":"Arriba de la ventana, atornillado al techo o a la pared.","ctx":"cortina|barral|rollers?","c":"ventanas"},{"id":"marco_ventana","n":"Marco de la ventana","a":["el marco","marcos?"],"q":"Es la parte fija de la ventana, amurada a la pared. La hoja es la parte que se mueve.","d":"Rodeando la ventana. Ahí se pegan los burletes.","ctx":"ventana|chiflete|burlete|vidrio","c":"ventanas"},{"id":"felpa","n":"Felpa de la ventana","a":["felpas?"],"q":"Es una tira tipo cepillito que va en los bordes de las ventanas corredizas para frenar el aire y la tierra.","d":"En los perfiles de la hoja de la ventana corrediza. Se vende por metro.","c":"ventanas"},{"id":"ventana_corrediza","c":"ventanas","n":"Ventana corrediza","a":["ventanas? corredizas?"],"q":"Es la ventana cuyas hojas se deslizan sobre un riel.","d":"En casi todos los departamentos, de aluminio o PVC."},{"id":"ventana_batiente","c":"ventanas","n":"Ventana de abrir","a":["ventanas? de abrir","ventana batiente"],"q":"Es la ventana que se abre girando sobre bisagras, como una puerta.","d":"Se traba con una manija o cremona."},{"id":"banderola","c":"ventanas","n":"Banderola","a":["banderolas?","ventiluz"],"q":"Es la ventanita de arriba que se abre inclinándose hacia adentro.","d":"Arriba de puertas o ventanas, en baños y cocinas."},{"id":"persiana","c":"ventanas","n":"Persiana de enrollar","a":["persianas?","cortina de enrollar"],"q":"Es la cortina de tablillas que sube y baja enrollándose en una caja arriba de la ventana.","d":"Afuera o adentro de la ventana; se acciona con una cinta o una manivela."},{"id":"cajon_persiana","c":"ventanas","n":"Cajón de la persiana","a":["caj[oó]n de la persiana","taparrollo"],"q":"Es la caja de arriba de la ventana donde se enrolla la persiana.","d":"Arriba de la ventana, con una tapa que se saca para llegar al rodillo.","ctx":"persiana"},{"id":"manivela","c":"ventanas","n":"Manivela de la persiana","a":["manivelas?"],"q":"Es la manija que se gira para subir o bajar algunas persianas.","d":"Al costado de la ventana.","ctx":"persiana"},{"id":"topes_persiana","c":"ventanas","n":"Topes de la persiana","a":["topes de la persiana"],"q":"Son las piecitas de la última tablilla que frenan la persiana para que no se meta entera en el cajón.","d":"En la tablilla de abajo de todo.","ctx":"persiana"},{"id":"vidrio","c":"ventanas","n":"Vidrio","a":["vidrios?"],"q":"Es el panel de vidrio de la ventana o la puerta. Si está rajado, lo cambia un vidriero.","d":"En las hojas de ventanas y puertas, sostenido por los contravidrios."},{"id":"contravidrio","c":"ventanas","n":"Contravidrio","a":["contravidrios?"],"q":"Son las varillas que sostienen el vidrio dentro de la hoja.","d":"En el borde interno de la hoja, alrededor del vidrio."},{"id":"masilla_vidrio","c":"ventanas","n":"Masilla para vidrios","a":["masilla para vidrios","masilla de vidriero"],"q":"Es una pasta que sella el borde del vidrio en ventanas de madera o hierro.","d":"Alrededor del vidrio, del lado de afuera."},{"id":"mosquitero","c":"ventanas","n":"Mosquitero","a":["mosquiteros?"],"q":"Es el marco con tela fina que no deja pasar insectos.","d":"En ventanas y puertas. La tela rota se cambia o se emparcha."},{"id":"tela_mosquitero","c":"ventanas","n":"Tela de mosquitero","a":["tela de mosquitero","tela met[aá]lica","malla mosquitero"],"q":"Es la malla fina del mosquitero; se vende por metro.","d":"En ferreterías, en rollos de distintos anchos."},{"id":"cremona","c":"ventanas","n":"Cremona","a":["cremonas?"],"q":"Es el mecanismo con manija que traba la ventana arriba y abajo a la vez.","d":"En el costado de la hoja de ventanas de abrir."},{"id":"cortina_roller","c":"ventanas","n":"Cortina roller","a":["cortinas? roller","roller"],"q":"Es una cortina de tela que se enrolla en un tubo con una cadenita.","d":"Arriba de la ventana. Si se traba, se revisa el mecanismo de la cadena."},{"id":"cadena_roller","c":"ventanas","n":"Cadena de la cortina roller","a":["cadena(s)? de la (cortina|roller)"],"q":"Es la cadenita de plástico que sube y baja la cortina roller.","d":"Al costado de la cortina.","ctx":"roller|cortina"},{"id":"soporte_barral","c":"ventanas","n":"Soporte del barral","a":["soportes? del barral"],"q":"Son las piezas atornilladas a la pared que sostienen el barral.","d":"A los costados de la ventana, arriba. Van con tarugos.","ctx":"barral|cortina"},{"id":"deslizador","c":"ventanas","n":"Deslizadores de cortina","a":["deslizador(es)?","ganchos? de (la )?cortina","argollas?"],"q":"Son los ganchitos o argollas que corren por el barral o el riel y sostienen la cortina.","d":"Arriba de la cortina.","ctx":"cortina|barral|riel"},{"id":"burlete_ventana","c":"ventanas","n":"Burlete de ventana","a":["burletes? de (la )?ventana"],"q":"Es la tira que sella la ventana para que no entre aire ni agua.","d":"En el borde de la hoja o del marco."},{"id":"policarbonato","c":"ventanas","n":"Policarbonato","a":["policarbonatos?"],"q":"Es una placa plástica transparente para techitos y cerramientos.","d":"En aleros, patios y balcones."},{"id":"film_ventana","c":"ventanas","n":"Film para vidrio","a":["film para (vidrio|ventana)","lamina de seguridad"],"q":"Es una lámina que se pega al vidrio para dar privacidad o seguridad.","d":"Pegada del lado de adentro del vidrio."},{"id":"toldo","c":"ventanas","n":"Toldo","a":["toldos?"],"q":"Es la lona que da sombra en ventanas o balcones.","d":"Arriba de la ventana o el balcón."},{"id":"cortina_tela","c":"ventanas","n":"Cortina de tela","a":["cortinas? de tela","cortina com[uú]n"],"q":"Es la cortina que cuelga del barral o riel.","d":"Arriba de la ventana."},{"id":"argollas_cortina","c":"ventanas","n":"Argollas de cortina","a":["argollas? de (la )?cortina","ganchitos? de (la )?cortina"],"q":"Son los aros o ganchos que cuelgan la cortina del barral.","d":"En el borde de arriba de la cortina."},{"id":"rueditas","n":"Ruedas de la silla","a":["ruedas?","rueditas?","ruedas? de (la )?silla"],"q":"Son las ruedas giratorias de la silla de oficina. Se sacan tirando fuerte: están encastradas a presión.","d":"Abajo de la silla, en las puntas de la base con forma de estrella.","ctx":"silla","c":"muebles"},{"id":"eje","n":"Eje de la rueda","a":["ejes?"],"q":"Es la varita de metal en el medio de la rueda, sobre la que gira. Ahí se enredan pelos y pelusas.","d":"En el centro de cada rueda.","ctx":"rueda|silla","c":"muebles"},{"id":"guias","n":"Guías o rieles del cajón","a":["gu[ií]as?","riel(es)?"],"q":"Son las piezas de metal a los costados del cajón por donde corre.","d":"Adentro del mueble, a los costados del cajón. Se ven al sacarlo.","ctx":"caj[oó]n|cajones","c":"muebles"},{"id":"regaton","n":"Regatón","a":["regat[oó]n(es)?","fieltros?"],"q":"Es una tapita de goma o fieltro que va en la punta de las patas. Protege el piso y nivela.","d":"En ferreterías, en bolsitas. Hay que medir el grosor de la pata.","c":"muebles"},{"id":"escuadra","n":"Escuadra metálica","a":["escuadras?"],"q":"Es una pieza de metal en forma de L con agujeros, que refuerza una unión de madera.","d":"En ferreterías, con sus tornillos.","c":"muebles"},{"id":"tablillas","n":"Tablillas","a":["tablillas?"],"q":"Son las tiras horizontales que forman la persiana.","d":"Es la persiana en sí: cada \"listón\" es una tablilla.","c":"muebles"},{"id":"manija_mueble","n":"Tirador del mueble","a":["manijas?","tirador(es)?"],"q":"Es la manija o perilla de donde tirás para abrir el cajón o la puerta del mueble. Se sujeta con uno o dos tornillos desde adentro.","d":"En el frente del cajón o de la puerta. El tornillo se ajusta desde la parte de adentro.","ctx":"caj[oó]n|cajones|mueble|placard|alacena|c[oó]moda|ropero","c":"muebles"},{"id":"bisagra_mueble","n":"Bisagra de mueble (cazoleta)","a":["bisagras?","cazoletas?"],"q":"Es la bisagra escondida de las puertas de muebles de cocina y placares. Tiene tornillitos para subir, bajar o acercar la puerta.","d":"Adentro del mueble, del lado de las bisagras. Se ajusta con un destornillador Phillips.","ctx":"alacena|placard|mueble|puertita|bajo mesada|ropero|vajillero","c":"muebles"},{"id":"tarugo_madera","n":"Tarugo de madera (espiga)","a":["tarugos? de madera","espigas?","tarugos?"],"q":"Es un palito de madera cilíndrico con estrías que une dos piezas de un mueble. Va pegado con cola adentro de agujeros.","d":"En las uniones de sillas, mesas y muebles armados. Se venden en bolsitas por diámetro (6, 8 o 10 mm).","ctx":"mueble|madera|silla|mesa|cama|encastr|cola vin","c":"muebles"},{"id":"excentrico","n":"Excéntrico (minifix)","a":["exc[eé]ntricos?","minifix"],"q":"Es la piecita redonda de metal que traba las placas de los muebles armables. Se gira con un destornillador para apretar.","d":"En los costados de los muebles de melamina, en agujeros redondos.","c":"muebles"},{"id":"guias_telescopicas","c":"muebles","n":"Guías telescópicas","a":["gu[ií]as? telesc[oó]picas?","correderas?"],"q":"Son los rieles de metal con bolillas que hacen correr los cajones.","d":"A los costados del cajón y dentro del mueble.","ctx":"caj[oó]n|cajones|mueble"},{"id":"perilla_mueble","c":"muebles","n":"Perilla de mueble","a":["perillas? de(l)? mueble","pomos?"],"q":"Es el tirador redondo de puertas y cajones.","d":"Se atornilla desde adentro del mueble."},{"id":"tornillo_madera","c":"muebles","n":"Tornillo para madera","a":["tornillos? para madera","tornillo autorroscante"],"q":"Es el tornillo con rosca gruesa que se agarra solo a la madera.","d":"En ferreterías, por largo y grosor."},{"id":"piston_silla","c":"muebles","n":"Pistón de la silla","a":["pist[oó]n(es)?","cilindro (a gas )?de la silla"],"q":"Es el cilindro que sube y baja el asiento de las sillas de oficina.","d":"Entre el asiento y la base de la silla. Si la silla baja sola, hay que cambiarlo.","ctx":"silla"},{"id":"base_estrella","c":"muebles","n":"Base estrella de la silla","a":["base estrella","base de la silla"],"q":"Es la base de cinco patas con ruedas de las sillas de oficina.","d":"Abajo de la silla. Las ruedas salen tirando fuerte.","ctx":"silla"},{"id":"tablillas_cama","c":"muebles","n":"Tablillas del somier","a":["tablillas? de(l)? (somier|cama)"],"q":"Son las maderas curvas que sostienen el colchón.","d":"En la base de la cama, encastradas en soportes de goma o plástico.","ctx":"cama|somier"},{"id":"soporte_estante","c":"muebles","n":"Soporte de estante","a":["soportes? de estante","m[eé]nsulas?"],"q":"Son las escuadras que sostienen una repisa en la pared.","d":"En la pared, abajo del estante, fijadas con tarugos.","ctx":"estante|repisa"},{"id":"repisa","c":"muebles","n":"Repisa","a":["repisas?","estantes?"],"q":"Es un estante fijado a la pared.","d":"En la pared, sobre soportes o escuadras."},{"id":"patas_mueble","c":"muebles","n":"Patas regulables","a":["patitas? del mueble"],"q":"Son las patas que se enroscan para nivelar un mueble.","d":"Abajo del mueble. Se giran para subir o bajar."},{"id":"placard","c":"muebles","n":"Placard","a":["placards?","placares","ropero"],"q":"Es el armario empotrado o el ropero.","d":"En dormitorios y pasillos."},{"id":"puerta_mueble","c":"muebles","n":"Puertita de mueble","a":["puertitas?","puerta de la alacena"],"q":"Es la puerta de una alacena, un bajo mesada o un placard.","d":"Se ajusta desde las bisagras de cazoleta."},{"id":"cajon","c":"muebles","n":"Cajón","a":["caj[oó]n(es)?"],"q":"Es el cajón del mueble, que corre sobre guías.","d":"Si se traba, revisá las guías y que no esté sobrecargado."},{"id":"iman_mueble","c":"muebles","n":"Cierre imantado","a":["cierres? imantados?","im[aá]n de (la puerta|mueble)"],"q":"Es un imán chico que mantiene cerradas las puertitas de los muebles.","d":"En el borde interno del mueble."},{"id":"piston_mueble","c":"muebles","n":"Pistón de mueble","a":["pist[oó]n(es)? de (mueble|alacena|puerta rebatible)"],"q":"Es un brazo a gas que sostiene abiertas las puertas que abren hacia arriba.","d":"Al costado de la puerta de la alacena."},{"id":"cerradura_mueble","c":"muebles","n":"Cerradura de mueble","a":["cerraduras? de (mueble|caj[oó]n|escritorio)"],"q":"Es la cerradura chica de cajones y puertas de muebles.","d":"En el frente del cajón o la puerta."},{"id":"silla","c":"muebles","n":"Silla","a":["sillas?"],"q":"Es la silla común; las patas flojas se reencolan.","d":"En comedor o escritorio.","ctx":"madera|tambalea|patas|encolar"},{"id":"mesa","c":"muebles","n":"Mesa","a":["mesas?"],"q":"Es la mesa; si se mueve, se ajustan los tornillos o se nivelan las patas.","d":"En el comedor o la cocina.","ctx":"patas|tambalea|madera|comedor"},{"id":"cama","c":"muebles","n":"Cama","a":["cama"],"q":"Es el mueble de la cama, con su estructura y tablillas.","d":"En el dormitorio."},{"id":"sommier","c":"muebles","n":"Sommier","a":["sommiers?","somier"],"q":"Es la base de la cama sobre la que va el colchón.","d":"Debajo del colchón."},{"id":"colchon","c":"muebles","n":"Colchón","a":["colchones?"],"q":"Es el colchón de la cama.","d":"Se rota cada tanto para que no se hunda."},{"id":"biblioteca","c":"muebles","n":"Biblioteca","a":["bibliotecas?","estanter[ií]a"],"q":"Es el mueble con estantes para libros.","d":"Conviene sujetarla a la pared para que no se caiga."},{"id":"escritorio","c":"muebles","n":"Escritorio","a":["escritorios?"],"q":"Es la mesa de trabajo o estudio.","d":"En el dormitorio u oficina."},{"id":"sillon","c":"muebles","n":"Sillón","a":["sill[oó]n(es)?","sof[aá]"],"q":"Es el sillón o sofá del living.","d":"En el living."},{"id":"espejo_pared","c":"muebles","n":"Espejo de pared","a":["espejo de pared","colgar un espejo"],"q":"Es un espejo para colgar; necesita ganchos firmes.","d":"En la pared."},{"id":"perchero","c":"muebles","n":"Perchero","a":["percheros?","perchas? de pared"],"q":"Es el soporte para colgar ropa o camperas.","d":"En la entrada o el dormitorio."},{"id":"barral_placard","c":"muebles","n":"Barral del placard","a":["barral del placard","ca[ñn]o del placard"],"q":"Es el caño donde se cuelgan las perchas.","d":"Adentro del placard, apoyado en dos soportes."},{"id":"lija","n":"Lija","a":["lijas?","lij[aá]"],"q":"Es un papel áspero que se frota para gastar y alisar madera, pared o pintura. El número indica qué tan gruesa es: 80 gruesa, 220 fina.","d":"En ferreterías, por hoja.","c":"pared"},{"id":"tarugo","n":"Tarugo","a":["tarugos?","tarugos? de nylon","tacos?"],"q":"Es un taquito de plástico que va adentro del agujero de la pared. Al meter el tornillo, se abre y queda firme.","d":"En ferreterías, con el número del agujero: tarugo del 6 para mecha del 6.","ctx":"pared|taladr|colgar|agujero|cuadro|estante|repisa|espejo|barral|mecha","c":"pared"},{"id":"cinta_papel","n":"Cinta de papel","a":["cintas? de papel","cinta de enmascarar"],"q":"Es una cinta que se despega fácil y no deja marca. Sirve para que la silicona o la pintura queden prolijas.","d":"En ferreterías y librerías.","c":"pared"},{"id":"enduido","n":"Enduido","a":["enduidos?"],"q":"Es una pasta blanca para tapar agujeros chicos y grietas finitas en la pared antes de pintar.","d":"En ferreterías y pinturerías, en potes.","c":"pared"},{"id":"espatula","n":"Espátula","a":["esp[aá]tulas?"],"q":"Es una paleta de metal finita para poner y alisar el enduido.","d":"En ferreterías y pinturerías.","c":"pared"},{"id":"junta_ceramica","n":"Juntas de los cerámicos (pastina)","a":["juntas?","pastina","las juntas","la junta","pastinas?","junta de los cer[aá]micos"],"q":"Son las líneas finitas entre cerámico y cerámico, rellenas con pastina. Si se ponen negras o se salen, entra agua y aparecen hongos.","d":"Entre los cerámicos del piso o de la pared. La pastina se compra en pinturerías, del color de la que ya tenés.","ctx":"cer[aá]mic|azulejo|porcelanato|baldosa|pastina|piso del ba[ñn]o|revestimiento","c":"pared"},{"id":"rodillo_pintura","n":"Rodillo de pintar","a":["rodillos?"],"q":"Es la herramienta con un cilindro de lana o espuma que se carga de pintura y se pasa por la pared para pintar parejo y rápido.","d":"En pinturerías y ferreterías. Para paredes, uno de lana de 22 cm; para esmalte, uno de espuma.","ctx":"pint|pared|techo|l[aá]tex|enduido|esmalte","c":"pared"},{"id":"pincel","n":"Pincel","a":["pincel(es)?","pinceletas?"],"q":"Sirve para pintar bordes, esquinas y lugares chicos donde no entra el rodillo.","d":"En pinturerías. Una pinceleta de 2\" alcanza para casi todo.","c":"pared"},{"id":"bandeja_pintura","n":"Bandeja de pintura","a":["bandejas?"],"q":"Es la bandeja con una parte en rampa para cargar el rodillo y sacarle el exceso.","d":"En pinturerías, junto a los rodillos.","ctx":"pint|rodillo","c":"pared"},{"id":"latex","n":"Pintura látex","a":["l[aá]tex"],"q":"Es la pintura al agua para paredes y techos. Se limpia con agua y no tiene olor fuerte.","d":"En pinturerías. Para baño y cocina, pedí látex con antihongos.","c":"pared"},{"id":"fijador","n":"Fijador sellador","a":["fijador(es)?"],"q":"Es un líquido que se pasa antes de pintar para que la pintura agarre pareja y no se chupe la pared.","d":"En pinturerías. Se diluye con agua según el envase.","c":"pared"},{"id":"masilla_madera","n":"Masilla para madera","a":["masillas?"],"q":"Es una pasta del color de la madera para tapar agujeros, rayones y tornillos.","d":"En ferreterías y pinturerías, por color (cedro, roble, blanca).","ctx":"madera|mueble|puerta|marco","c":"pared"},{"id":"zocalo","n":"Zócalo","a":["z[oó]calos?"],"q":"Es la tira que va al pie de la pared, donde se junta con el piso. Protege la pared de golpes y humedad.","d":"Abajo de todo, en el borde de la pared. Se pega o se clava.","ctx":"pared|piso|madera|despegad","c":"pared"},{"id":"hidrofugo","n":"Hidrófugo","a":["hidr[oó]fugos?"],"q":"Es un producto que se mezcla o se pasa para que la pared no absorba agua. Se usa en revoques y paredes con humedad.","d":"En corralones y pinturerías.","c":"pared"},{"id":"tornillo","c":"pared","n":"Tornillos","a":["tornillos?"],"q":"Son las piezas con rosca que fijan cosas. Se piden por largo, grosor y tipo de cabeza.","d":"En ferreterías, sueltos o por caja."},{"id":"clavo","c":"pared","n":"Clavos","a":["clavos?"],"q":"Son los clavos de acero para madera o pared.","d":"En ferreterías, por largo."},{"id":"tarugo_durlock","c":"pared","n":"Tarugo para durlock","a":["tarugos? para durlock","tarugo mariposa","tarugo paraguas"],"q":"Es un tarugo que se abre del otro lado de la placa de yeso para que agarre.","d":"En ferreterías. Sirve para cosas livianas en paredes de durlock."},{"id":"gancho_cuadro","c":"pared","n":"Gancho para cuadros","a":["ganchos? para cuadros?","colgador(es)?"],"q":"Es un ganchito con clavo fino para colgar cuadros livianos.","d":"En ferreterías y bazares."},{"id":"durlock","c":"pared","n":"Placa de durlock","a":["durlock","placas? de yeso","tabique de yeso"],"q":"Es una pared o un cielorraso hecho con placas de yeso.","d":"Se reconoce porque suena hueco al golpearla."},{"id":"cinta_durlock","c":"pared","n":"Cinta para juntas de durlock","a":["cinta para juntas","cinta de papel para durlock"],"q":"Es la cinta que tapa las uniones entre placas de yeso antes del masillado.","d":"En corralones y pinturerías.","ctx":"durlock|yeso"},{"id":"masilla","c":"pared","n":"Masilla","a":["masillas?"],"q":"Es una pasta para tapar agujeros y fisuras chicas en la pared antes de pintar.","d":"En pinturerías. Se aplica con espátula y se lija al secar.","ctx":"pared|agujero|fisura|revoque"},{"id":"esmalte","c":"pared","n":"Esmalte sintético","a":["esmaltes?","esmalte sint[eé]tico"],"q":"Es la pintura brillante para madera y metal, como puertas y rejas.","d":"En pinturerías. Se limpia con aguarrás."},{"id":"pintura_antihongo","c":"pared","n":"Pintura antihongos","a":["pinturas? antihongos?","l[aá]tex antihongos?"],"q":"Es un látex con fungicida para baños, cocinas y paredes húmedas.","d":"En pinturerías."},{"id":"revoque","c":"pared","n":"Revoque","a":["revoques?","reboque"],"q":"Es la capa de mezcla que cubre el ladrillo de la pared.","d":"Si se cae o está húmedo, hay que picarlo y rehacerlo."},{"id":"cemento","c":"pared","n":"Cemento","a":["cemento"],"q":"Es el polvo gris que mezclado con arena y agua forma la mezcla.","d":"En corralones, en bolsas."},{"id":"arena","c":"pared","n":"Arena","a":["arena","arena fina"],"q":"Es el material que se mezcla con cemento o cal.","d":"En corralones, en bolsas o a granel."},{"id":"ladrillo","c":"pared","n":"Ladrillo","a":["ladrillos?"],"q":"Es el bloque con el que se hacen las paredes.","d":"En corralones."},{"id":"ceramico","c":"pared","n":"Cerámicos","a":["cer[aá]micos?"],"q":"Son las placas que cubren pisos y paredes.","d":"Si uno está flojo o roto, guardá uno igual para el reemplazo."},{"id":"pegamento_ceramico","c":"pared","n":"Pegamento para cerámicos","a":["pegamento para cer[aá]micos","adhesivo cementicio"],"q":"Es la mezcla en polvo que pega los cerámicos.","d":"En corralones. Se mezcla con agua."},{"id":"guardacanto","c":"pared","n":"Guardacanto","a":["guardacantos?"],"q":"Es el perfil que protege las esquinas de las paredes.","d":"En esquinas salientes, sobre el revoque o el durlock."},{"id":"yeso","c":"pared","n":"Yeso","a":["yeso"],"q":"Es un polvo que se mezcla con agua para tapar agujeros y hacer molduras.","d":"En corralones y ferreterías. Fragua rápido."},{"id":"sellador_fisuras","c":"pared","n":"Sellador de fisuras","a":["sellador de fisuras","tapa grietas"],"q":"Es una pasta elástica para cerrar grietas finas que se mueven.","d":"En pinturerías."},{"id":"malla_fibra","c":"pared","n":"Malla de fibra de vidrio","a":["malla de fibra de vidrio","malla para fisuras"],"q":"Es una malla que se pone sobre las fisuras para que no vuelvan a abrirse.","d":"En pinturerías."},{"id":"membrana_pintura","c":"pared","n":"Pintura impermeabilizante","a":["pintura impermeabilizante","impermeabilizante de paredes"],"q":"Es una pintura que no deja pasar el agua en paredes exteriores.","d":"En pinturerías."},{"id":"removedor","c":"pared","n":"Removedor de pintura","a":["removedor(es)?( de pintura)?"],"q":"Es un gel que ablanda la pintura vieja para sacarla con espátula.","d":"En pinturerías. Usalo con guantes y ventilación."},{"id":"convertidor","c":"pared","n":"Convertidor de óxido","a":["convertidor de [oó]xido","antióxido","antioxido"],"q":"Es un fondo que frena el óxido antes de pintar metales.","d":"En pinturerías."},{"id":"sellador_pared","c":"pared","n":"Sellador de paredes","a":["sellador de paredes","sellador al agua"],"q":"Es una base que se pasa antes de pintar para que la pintura agarre pareja.","d":"En pinturerías."},{"id":"moldura","c":"pared","n":"Moldura","a":["molduras?","cornisa"],"q":"Es la tira decorativa en el borde del techo o la pared.","d":"En la unión entre pared y techo."},{"id":"cielorraso","c":"pared","n":"Cielorraso","a":["cielorrasos?","techo de durlock"],"q":"Es el techo interior de la habitación, de yeso o durlock.","d":"Arriba de todo, en cada ambiente."},{"id":"azulejo","c":"pared","n":"Azulejo","a":["azulejos?"],"q":"Es el cerámico de pared de baños y cocinas.","d":"En las paredes húmedas."},{"id":"perfil_durlock","c":"pared","n":"Perfil de durlock","a":["perfil(es)? de (durlock|montante|solera)"],"q":"Es el perfil de chapa sobre el que se atornillan las placas.","d":"Dentro de las paredes y techos de durlock."},{"id":"tornillo_durlock","c":"pared","n":"Tornillo T2","a":["tornillos? (T1|T2|de durlock)"],"q":"Es el tornillo negro de punta fina para fijar placas de durlock.","d":"En ferreterías."},{"id":"piso_flotante","c":"pisos","n":"Piso flotante","a":["pisos? flotantes?","piso laminado"],"q":"Son tablas de material imitación madera que se encastran entre sí, sin pegar al contrapiso.","d":"En dormitorios y livings. Se levanta si le entra agua."},{"id":"parquet","c":"pisos","n":"Parquet","a":["parquet","tablitas? del piso"],"q":"Es el piso de tablitas de madera maciza pegadas.","d":"En casas y departamentos antiguos. Se plastifica o se encera."},{"id":"piso_vinilico","c":"pisos","n":"Piso vinílico","a":["pisos? vin[ií]licos?","vin[ií]lico"],"q":"Es un piso de PVC en tablas o rollos, resistente al agua.","d":"Se pega o se encastra sobre el piso existente."},{"id":"porcelanato","c":"pisos","n":"Porcelanato","a":["porcelanatos?"],"q":"Es un cerámico muy duro y de poca absorción, en placas grandes.","d":"En pisos y paredes. Se corta con disco especial."},{"id":"zocalo_flotante","c":"pisos","n":"Zócalo de piso flotante","a":["z[oó]calos? de (mdf|pvc)"],"q":"Es la tira que tapa el borde entre el piso flotante y la pared.","d":"Al pie de la pared, se pega o se clava."},{"id":"manta_piso","c":"pisos","n":"Manta bajo piso","a":["manta bajo piso","espuma bajo piso"],"q":"Es la lámina de espuma que va debajo del piso flotante.","d":"Entre el contrapiso y las tablas."},{"id":"alfombra","c":"pisos","n":"Alfombra","a":["alfombras?","moqueta"],"q":"Es el revestimiento textil del piso.","d":"Se limpia con aspiradora y se pega con cinta en los bordes."},{"id":"plastificador","c":"pisos","n":"Plastificador de pisos","a":["plastificador(es)?","plastificado"],"q":"Es el barniz que protege los pisos de madera.","d":"Se pasa con rodillo después de pulir."},{"id":"cera_pisos","c":"pisos","n":"Cera para pisos","a":["cera para pisos","cera l[ií]quida"],"q":"Da brillo y protege pisos de madera o cerámica.","d":"En el supermercado."},{"id":"umbral","c":"pisos","n":"Umbral","a":["umbral(es)?","perfil de transici[oó]n","tapajunta de piso"],"q":"Es la pieza que une dos pisos distintos debajo de una puerta.","d":"En el piso, justo en la puerta."},{"id":"baldosa","c":"pisos","n":"Baldosa","a":["baldosas?","mosaico"],"q":"Es cada pieza de un piso de baldosas o mosaicos calcáreos.","d":"En patios, cocinas y casas antiguas."},{"id":"canilla_jardin","c":"exterior","n":"Canilla de jardín","a":["canillas? de(l)? jard[ií]n","canillas? del patio"],"q":"Es la canilla exterior donde conectás la manguera para regar o lavar.","d":"En patios, jardines y terrazas, a la altura de la mano o cerca del piso."},{"id":"porton","c":"exterior","n":"Portón","a":["portones?"],"q":"Es la puerta grande del garaje o la entrada.","d":"En la entrada de autos. Las ruedas y las guías se lubrican."},{"id":"motor_porton","c":"exterior","n":"Motor del portón","a":["motor del port[oó]n","port[oó]n autom[aá]tico"],"q":"Es el motor que abre y cierra el portón con un control.","d":"Al costado o arriba del portón. Lo revisa un técnico."},{"id":"membrana_liquida","c":"exterior","n":"Membrana líquida","a":["membranas? l[ií]quidas?","impermeabilizante"],"q":"Es una pintura gruesa que impermeabiliza techos y terrazas.","d":"En pinturerías. Se aplica en varias manos sobre la superficie limpia."},{"id":"membrana","c":"exterior","n":"Membrana asfáltica","a":["membranas? asf[aá]lticas?","membrana"],"q":"Es el rollo impermeable que cubre techos y terrazas.","d":"En el techo. La coloca un techista."},{"id":"canaleta","c":"exterior","n":"Canaleta","a":["canaletas?"],"q":"Es el canal que junta el agua de lluvia del borde del techo.","d":"En el borde del techo. Se tapa con hojas y tierra."},{"id":"bajada_pluvial","c":"exterior","n":"Caño de bajada pluvial","a":["bajadas? pluvial(es)?","ca[ñn]o de bajada"],"q":"Es el caño que baja el agua de la canaleta hasta el piso.","d":"Pegado a la pared exterior, desde la canaleta."},{"id":"embudo_pluvial","c":"exterior","n":"Embudo de la terraza","a":["embudos?","boca de desag[uü]e de la terraza","desag[uü]e de la terraza"],"q":"Es la boca del piso de la terraza por donde se va el agua de lluvia.","d":"En el piso de la terraza o el balcón. Si se tapa, el agua se junta."},{"id":"rejilla_balcon","c":"exterior","n":"Rejilla del balcón","a":["rejillas? del balc[oó]n","desag[uü]e del balc[oó]n"],"q":"Es la rejilla del piso del balcón por donde se va el agua.","d":"En el piso del balcón, en un rincón."},{"id":"teja","c":"exterior","n":"Teja","a":["tejas?"],"q":"Es cada pieza del techo inclinado. Si se corre o se rompe, entra agua.","d":"En el techo. Mejor que la cambie un techista."},{"id":"chapa","c":"exterior","n":"Chapa del techo","a":["chapas?","techo de chapa"],"q":"Es la lámina de metal ondulada de algunos techos.","d":"Los tornillos con arandela de goma evitan que entre agua."},{"id":"manguera_jardin","c":"exterior","n":"Manguera de jardín","a":["manguera de(l)? jard[ií]n","manguera de riego"],"q":"Es la manguera para regar o lavar.","d":"Se conecta a la canilla del patio con un acople."},{"id":"acople_rapido","c":"exterior","n":"Acople rápido","a":["acoples? r[aá]pidos?","acople de manguera"],"q":"Es la pieza que une la manguera a la canilla o a otra manguera sin rosca.","d":"En las puntas de la manguera."},{"id":"aspersor_jardin","c":"exterior","n":"Regador","a":["regador(es)?","aspersor de jard[ií]n"],"q":"Es la pieza que reparte el agua de la manguera sobre el pasto.","d":"Al final de la manguera."},{"id":"pileta_natacion","c":"exterior","n":"Pileta de natación","a":["pileta de nataci[oó]n","piscina","pelopincho"],"q":"Es la pileta para bañarse, con su bomba y filtro.","d":"En el patio o la terraza."},{"id":"reja","c":"exterior","n":"Reja","a":["rejas?"],"q":"Son las rejas de hierro de ventanas y puertas.","d":"Se pintan con esmalte para que no se oxiden."},{"id":"buzon","c":"exterior","n":"Buzón","a":["buzones?"],"q":"Es la caja de la correspondencia.","d":"En la entrada o en la puerta."},{"id":"pala","c":"exterior","n":"Pala","a":["palas?"],"q":"Es la herramienta para cavar o juntar tierra.","d":"En el patio o el jardín."},{"id":"rastrillo","c":"exterior","n":"Rastrillo","a":["rastrillos?"],"q":"Sirve para juntar hojas y pasto cortado.","d":"En el jardín."},{"id":"tijera_podar","c":"exterior","n":"Tijera de podar","a":["tijeras? de podar"],"q":"Es la tijera para cortar ramas finas.","d":"En el jardín."},{"id":"cortadora_cesped","c":"exterior","n":"Cortadora de césped","a":["cortadoras? de (c[eé]sped|pasto)"],"q":"Es la máquina para cortar el pasto.","d":"En el jardín."},{"id":"bordeadora","c":"exterior","n":"Bordeadora","a":["bordeadoras?"],"q":"Es la máquina con tanza para cortar el pasto en los bordes.","d":"En el jardín."},{"id":"maceta","c":"exterior","n":"Maceta","a":["macetas?"],"q":"Es el recipiente para plantas; necesita agujero de drenaje.","d":"En balcones y patios."},{"id":"parrilla","c":"exterior","n":"Parrilla","a":["parrillas?","asador"],"q":"Es la parrilla para el asado.","d":"En el patio o la terraza."},{"id":"llave_francesa","n":"Llave francesa","a":["llaves? francesas?","llaves? inglesas?"],"q":"Es una llave de metal que se abre y se cierra con una ruedita para agarrar tuercas de distintos tamaños.","d":"En cualquier ferretería. Con una de 8 pulgadas alcanza para casi todo en la casa.","c":"herramientas"},{"id":"trincheta","n":"Trincheta","a":["trinchetas?","c[uú]ter"],"q":"Es un cúter con hoja que se desliza. Sirve para cortar cinta, silicona o pelusa.","d":"En librerías y ferreterías.","c":"herramientas"},{"id":"allen","n":"Llave Allen","a":["llaves? allen"],"q":"Es una llave de metal con forma de L y seis lados, para tornillos con agujero hexagonal (muy común en muebles para armar).","d":"Suele venir con los muebles. Si no, se venden en juegos.","c":"herramientas"},{"id":"nivel","n":"Nivel","a":["un nivel"],"q":"Es una regla con una burbuja adentro. Cuando la burbuja queda en el medio, está derecho.","d":"En ferreterías. También hay apps de nivel en el celular.","c":"herramientas"},{"id":"mecha","n":"Mecha de widia","a":["mechas?","widia"],"q":"Es la punta del taladro que hace el agujero. La de widia tiene la punta más ancha y si "herramientas"},{"id":"escalera","n":"Escalera","a":["escaleras?","banqueta"],"q":"Usá una escalera firme, abierta del todo, y no te pares en los últimos escalones. Si podés, que alguien te la sostenga.","d":"Si no tenés, se puede pedir prestada. Nunca uses una silla con ruedas.","c":"herramientas"},{"id":"destapador_inodoro","c":"herramientas","n":"Sopapa para inodoro","a":["sopapa para inodoro","sopapa de fuelle"],"q":"Es una sopapa más grande, con forma especial para entrar en la salida del inodoro.","d":"En ferreterías y supermercados.","ctx":"inodoro"},{"id":"multimetro","c":"herramientas","n":"Multímetro (téster)","a":["mult[ií]metros?","t[eé]ster"],"q":"Es un aparato que mide si hay tensión y cuánta.","d":"Lo usan los electricistas. Para chequear un enchufe, alcanza el buscapolo."},{"id":"llana","c":"herramientas","n":"Llana dentada","a":["llanas?","llana dentada"],"q":"Es la herramienta con dientes para esparcir el pegamento de los cerámicos.","d":"En ferreterías y corralones."},{"id":"cuchara_albanil","c":"herramientas","n":"Cuchara de albañil","a":["cuchara de alba[ñn]il"],"q":"Es la herramienta en forma de gota para mezcla y revoque.","d":"En ferreterías."},{"id":"fratacho","c":"herramientas","n":"Fratacho","a":["fratachos?"],"q":"Es la herramienta plana para alisar el revoque.","d":"En ferreterías."},{"id":"plomada","c":"herramientas","n":"Plomada","a":["plomadas?"],"q":"Es una pesa con hilo que marca la vertical.","d":"En ferreterías."},{"id":"destornillador_plano","c":"herramientas","n":"Destornillador plano","a":["destornillador(es)? plano"],"q":"Es el destornillador con punta chata, para tornillos con una sola ranura.","d":"En ferreterías. Usá la medida que entre justo en la ranura."},{"id":"destornillador_phillips","c":"herramientas","n":"Destornillador Phillips","a":["destornillador(es)? phillips","punta en cruz"],"q":"Es el destornillador con punta en cruz.","d":"En ferreterías. Es el más usado en muebles y artefactos."},{"id":"atornillador","c":"herramientas","n":"Atornillador eléctrico","a":["atornillador(es)?"],"q":"Es un taladro chico a batería para poner y sacar tornillos rápido.","d":"En ferreterías. Ahorra mucho tiempo armando muebles."},{"id":"llave_tubo","c":"herramientas","n":"Llave de tubo","a":["llaves? de tubo","llave de vaso"],"q":"Es una llave en forma de tubo que agarra la tuerca por todos lados.","d":"En ferreterías, por medida. Sirve para tuercas en lugares hundidos."},{"id":"llave_stillson","c":"herramientas","n":"Llave Stillson","a":["stillson","llave de ca[ñn]o"],"q":"Es una llave grande y dentada para agarrar caños.","d":"La usan los plomeros. Para la casa alcanza con una llave francesa."},{"id":"llave_combinada","c":"herramientas","n":"Llave combinada","a":["llaves? combinadas?","llave fija","llave estrella"],"q":"Es una llave con una boca abierta y un aro en la otra punta, de una medida fija.","d":"En ferreterías, en juegos de varias medidas.","ctx":"tuerca|bul[oó]n|ajust|tornillo|herramienta|ca[ñn]o|rueda|afloj"},{"id":"alicate","c":"herramientas","n":"Alicate","a":["alicates?"],"q":"Es la herramienta para cortar alambres y cables.","d":"En ferreterías."},{"id":"serrucho","c":"herramientas","n":"Serrucho","a":["serruchos?"],"q":"Es la sierra de mano para cortar madera.","d":"En ferreterías."},{"id":"sierra_metal","c":"herramientas","n":"Sierra para metales","a":["sierra para metales","sierra de arco"],"q":"Es la sierra con hoja fina para cortar caños y metal.","d":"En ferreterías."},{"id":"caladora","c":"herramientas","n":"Caladora","a":["caladoras?"],"q":"Es una sierra eléctrica para cortar madera con curvas.","d":"En ferreterías."},{"id":"amoladora","c":"herramientas","n":"Amoladora","a":["amoladoras?"],"q":"Es una herramienta eléctrica con disco para cortar y desbastar. Es peligrosa si no sabés usarla.","d":"La usan profesionales."},{"id":"mecha_madera","c":"herramientas","n":"Mecha para madera","a":["mechas? para madera"],"q":"Es la mecha con punta fina para agujerear madera.","d":"En ferreterías, por número."},{"id":"mecha_metal","c":"herramientas","n":"Mecha para metal","a":["mechas? para metal","mecha de acero r[aá]pido"],"q":"Es la mecha para agujerear metal.","d":"En ferreterías, por número."},{"id":"cepillo_alambre","c":"herramientas","n":"Cepillo de alambre","a":["cepillos? de alambre"],"q":"Es un cepillo con cerdas de metal para sacar óxido y pintura vieja.","d":"En ferreterías."},{"id":"aceitera","c":"herramientas","n":"Aceitera","a":["aceiteras?","aceite para m[aá]quinas"],"q":"Es un frasquito con pico para poner gotas de aceite en bisagras y mecanismos.","d":"En ferreterías."},{"id":"pistola_calor","c":"herramientas","n":"Pistola de calor","a":["pistola de calor"],"q":"Es una herramienta que tira aire muy caliente para sacar pintura o ablandar materiales.","d":"En ferreterías."},{"id":"cuter","c":"herramientas","n":"Cúter de hoja ancha","a":["c[uú]ter de hoja ancha"],"q":"Es una trincheta grande con hoja que se corta para renovar el filo.","d":"En ferreterías.","ctx":"silicona|burlete|alfombra"},{"id":"escuadra_carpintero","c":"herramientas","n":"Escuadra de carpintero","a":["escuadra de carpintero","escuadra met[aá]lica"],"q":"Es una regla en ángulo recto para marcar cortes derechos.","d":"En ferreterías."},{"id":"lapiz_carpintero","c":"herramientas","n":"Lápiz de carpintero","a":["l[aá]piz de carpintero"],"q":"Es un lápiz chato para marcar en madera y pared.","d":"En ferreterías."},{"id":"detector_cables","c":"herramientas","n":"Detector de caños y cables","a":["detector(es)? de (ca[ñn]os|cables)"],"q":"Es un aparato que avisa si hay caños o cables dentro de la pared antes de agujerear.","d":"En ferreterías. Muy útil antes de colgar algo pesado."},{"id":"pelacables","c":"herramientas","n":"Pinza pelacables","a":["pelacables","pinza pelacables"],"q":"Es la pinza que saca el plástico del cable sin cortar el cobre.","d":"En ferreterías."},{"id":"tenaza","c":"herramientas","n":"Tenaza","a":["tenazas?"],"q":"Es la herramienta para s function pumpImgs() {
  for (let i = 0; i < IMG_Q.length && IMG_ON < 8;) {
    const [el, src] = IMG_Q[i], ia = src.startsWith('/api/');

    IMG_Q.splice(i, 1); IMG_ON++; if (ia) IA_ON++;
    const img = new Image(); img.alt = ''; img.decoding = 'async';
    const done = () => { IMG_ON--; if (ia) IA_ON--; pumpImgs(); };
    img.onload = () => { if (el.isConnected) { el.innerHTML = ''; el.appendChild(img); } done(); };
    img.onerror = () => {
      // Un reintento a los pocos segundos (el servicio gratis a veces pide esperar); si tampoco, queda el ícono
      if (ia && !el.dataset.try) { el.dataset.try = 1; setTimeout(() => { IMG_Q.push([el, src]); pumpImgs(); }, 8000); }

ACT.saveEdit = async (x, btn) => {

    EDIT.foto = await upPhoto(EDIT.foto); EDIT.port = await Promise.all((EDIT.port || []).map(upPhoto)); if (btn) { btn.disabled = false; btn.textContent = 'Guardar cambios'; } }

  if (p && ['Gas', 'Electricidad'].includes(u.rubro) && !v('e_mat')) { $('#err').textContent = `Para ${u.rubro} la matrícula es obligatoria.`; return; }
  const usu = v('e_usuario').toLowerCase();
  if ((usu || u.usuario) && !USU_RE.test(usu)) { $('#err').textContent = 'Revisá el nombre de usuario: de 3 a 20 letras o números, sin espacios ni acentos (podés usar . y _).'; return; }

  if (usu && usu !== u.usuario) {
    try { const d = await libre(usu, null); if (!d.usuario) { $('#err').textContent = 'Ese nombre de usuario ya existe. Probá con otro.'; return; } }
    catch (e) { $('#err').textContent = 'No pudimos conectarnos. Revisá tu conexión e intentá de nuevo.'; return; }
  }
  Object.assign(u, {nombre:v('e_nombre'), tel:v('e_tel').slice(0, 30), zona:v('e_zona'), foto:EDIT.foto});
  if (usu) u.usuario = usu;
  if (p) Object.assign(u, {mat:v('e_mat'), anios:+v('e_anios') || 0, bio:v('e_bio'), esp:v('e_esp').split(',').map(x => x.trim()).filter(Boolean).slice(0, 8), hor:v('e_hor'), port:EDIT.port,

let SB = null, SNAP = {jobs:{}, me:null}, SYNC_T = null, RT = null, SYNCING = null, UNDO_ME = null;
const isUuid = x => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x || ''));
const snapJob = j => { SNAP.jobs[j.id] = JSON.stringify(j); };
let SB_LIB = null, SB_P = null;
function loadSB() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return SB_LIB || (SB_LIB = new Promise((res, rej) => { const sc = document.createElement('script'); sc.crossOrigin = 'anonymous'; sc.onerror = () => { SB_LIB = null; rej(new Error('No se pudo cargar Supabase')); }; sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); }));
}
function busy(btn, txt) { if (!btn) return () => {}; const old = btn.innerHTML; btn.disabled = true; btn.textContent = txt; return () => { btn.disabled = false; btn.innerHTML = old; }; }
function authError(e) {
  const m = String((e && e.message) || e || '');
  if (/usuario_repetido/i.test(m)) return 'Ese nombre de usuario ya existe. Probá con otro.';
  if (/telefono_repetido/i.test(m)) return 'Ese celular ya está registrado en otra cuenta.';
  if (/database error saving new user/i.test(m)) return 'Ese nombre de usuario o celular ya está en otra cuenta.';
  if (/already registered|already exists/i.test(m)) return 'Ese mail ya tiene una cuenta. Probá con “Ya tengo cuenta”.';
  if (/invalid login/i.test(m)) return 'Los datos o la contraseña no coinciden. Revisalos e intentá de nuevo.';
  if (/not confirmed/i.test(m)) return 'Todavía no confirmaste tu mail. Buscá el mail de HandyGo (fijate en spam) y tocá el link.';
  if (/rate limit|too many/i.test(m)) return 'Hubo demasiados intentos seguidos. Esperá unos minutos y probá de nuevo.';
  if (/password/i.test(m)) return 'La contraseña no es válida: usá al menos 6 caracteres.';
  return 'No pudimos conectarnos. Revisá tu conexión e intentá de nuevo.';
}
async function cloudLoad() {
  const { data:{ session } } = await SB.auth.getSession(); const user = session && session.user; if (!user) return false;
  const [pr, js] = await Promise.all([SB.from('profiles').select('id,tipo,data'), SB.from('jobs').select('id,data').order('updated_at', {ascending:false})]);
  if (pr.error) throw pr.error; if (js.error) throw js.error;
  const mine = pr.data.find(x => x.id === user.id); if (!mine) throw new Error('Falta el perfil');
  DB = {users:[], provs:[], jobs:[], cur:{t:mine.tipo, id:user.id}};
  pr.data.forEach(addProfile);
  DB.jobs = js.data.map(r => ({...r.data, id:r.id}));
  SNAP = {jobs:{}, me:null}; DB.jobs.forEach(snapJob); SNAP.me = JSON.stringify(me());
  subscribe();
  return true;
}
function addProfile(r) {
  const o = {...r.data, id:r.id}; if (r.tipo === 'p') { o.rev = o.rev || []; o.agenda = o.agenda || defAgenda(); }
  const list = r.tipo === 'p' ? DB.provs : DB.users, i = list.findIndex(x => x.id === r.id);
  if (i >= 0) { if (r.id !== DB.cur.id) list[i] = o; } else list.push(o);
}
async function ensureProfiles(j) {
  const ids = [j.prov, ...(j.offers || []).map(o => o.pid), j.uid].filter(x => isUuid(x) && x !== DB.cur.id && ![...DB.users, ...DB.provs].some(p => p.id === x));
  if (!ids.length) return false;
  const r = await SB.from('profiles').select('id,tipo,data').in('id', [...new Set(ids)]);
  if (r.error || !r.data.length) return false; r.data.forEach(addProfile); return true;
}
function subscribe() {
  if (RT) SB.removeChannel(RT);
  RT = SB.channel('jobs-' + DB.cur.id).on('postgres_changes', {event:'*', schema:'public', table:'jobs'}, onJobChange).subscribe();
}
function onJobChange(ev) {
  if (!DB.cur) return;
  if (ev.eventType === 'DELETE') { const id = ev.old && ev.old.id; DB.jobs = DB.jobs.filter(j => j.id !== id); delete SNAP.jobs[id]; return softRender(); }
  const row = ev.new; if (!row || !row.data) return;
  const inc = {...row.data, id:row.id}, incS = JSON.stringify(inc), cur = DB.jobs.find(j => j.id === row.id);
  if (cur) {
    if (JSON.stringify(cur) !== SNAP.jobs[cur.id]) return;           // hay cambios propios sin guardar: los mandamos primero
    if (SNAP.jobs[cur.id] === incS) return;
    const old = JSON.parse(SNAP.jobs[cur.id]);
    Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, inc); snapJob(cur);
    notify(old, cur);
  } else {
    DB.jobs.unshift(inc); snapJob(inc);
    if (DB.cur.t === 'p' && inc.estado === 'nuevo' && inc.uid !== 'demo') toast('Nuevo pedido de ' + String(inc.rubro || '').toLowerCase() + ' en tu zona');
  }
  ensureProfiles(cur || inc).then(ch => { if (ch) softRender(); });
  softRender();
}
function notify(old, j) {
  const mine = DB.cur.t === 'u' ? j.uid === DB.cur.id : j.prov === DB.cur.id;
  if ((j.offers || []).length > (old.offers || []).length && DB.cur.t === 'u' && j.uid === DB.cur.id) { const o = j.offers[j.offers.length - 1]; if (isUuid(o.pid)) toast('Nuevo presupuesto de ' + first(provInfo(o.pid).n)); }
  if ((j.msgs || []).length > (old.msgs || []).length && mine) {
    const m = j.msgs[j.msgs.length - 1];
    if (m.f === 's') toast(m.t); else if (m.f !== DB.cur.t) toast('Mensaje nuevo de ' + first(DB.cur.t === 'u' ? provInfo(j.prov).n : j.un));
  }
  if (DB.cur.t === 'p' && old.estado === 'nuevo' && j.estado === 'aceptado' && j.prov === DB.cur.id) { toast(first(j.un) + ' aceptó tu presupuesto'); setTimeout(() => openConv(j), 0); }
}
function softRender() {
  if (!DB.cur) return;
  if ($('#scrim') || (V.tab === 'chat' && !V.job) || V.edit) return renderNav();
  const mi = $('#mi'), val = mi ? mi.value : '', foc = document.activeElement === mi, sc = $('#view').scrollTop;
  const active = document.activeElement && document.activeElement.id && document.activeElement.id !== 'mi' && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (active) return renderNav();
  render();
  const mi2 = $('#mi'); if (mi2 && val) mi2.value = val; if (mi2 && foc) mi2.focus();
  $('#view').scrollTop = sc;
}
function cloudSave() { clearTimeout(SYNC_T); SYNC_T = setTimeout(cloudSync, 250); }
async function cloudSync() {
  if (!CLOUD || !DB.cur) return;
  if (SYNCING) { await SYNCING; }
  const ops = [];
  const m = me();
  if (m) { const s = JSON.stringify(m); if (s !== SNAP.me) {
    const old = SNAP.me ? JSON.parse(SNAP.me) : {}, patch = {};
    Object.keys(m).forEach(k => { if (k !== 'id' && k !== 'mail' && k !== 'pass' && JSON.stringify(m[k]) !== JSON.stringify(old[k])) patch[k] = m[k]; });
    const prevMe = SNAP.me; SNAP.me = s; if (Object.keys(patch).length) { ops.push(SB.rpc('profile_patch', {p_patch:patch})); UNDO_ME = () => { if (SNAP.me === s) SNAP.me = prevMe; }; } } }
  const undo = [];
  for (const j of DB.jobs) {
    const s = JSON.stringify(j), prev = SNAP.jobs[j.id];
    if (prev === s) continue;
    SNAP.jobs[j.id] = s; undo.push(() => { if (SNAP.jobs[j.id] === s) { if (prev === undefined) delete SNAP.jobs[j.id]; else SNAP.jobs[j.id] = prev; } });
    if (prev === undefined) {
      ops.push(SB.from('jobs').insert({id:j.id, uid:isUuid(j.uid) ? j.uid : null, demo_prov:j.uid === 'demo' ? DB.cur.id : null, rubro:j.rubro, estado:j.estado, prov:j.prov ? String(j.prov) : null, data:j}));
      continue;
    }
    const old = JSON.parse(prev), patch = {}, msgs = [], offers = [];
    Object.keys(j).forEach(k => {
      const a = JSON.stringify(j[k]), b = JSON.stringify(old[k]); if (a === b) return;
      if ((k === 'msgs' || k === 'offers') && Array.isArray(j[k]) && Array.isArray(old[k]) && j[k].length > old[k].length && JSON.stringify(j[k].slice(0, old[k].length)) === b) (k === 'msgs' ? msgs : offers).push(...j[k].slice(old[k].length));
      else patch[k] = j[k];
    });
    ops.push(SB.rpc('job_patch', {p_id:j.id, p_patch:patch, p_msgs:msgs, p_offers:offers}));
  }
  if (!ops.length) return;
  SYNCING = Promise.all(ops.map(p => Promise.resolve(p).catch(e => ({error:e}))));
  const res = await SYNCING; SYNCING = null;
  const bad = res.filter(r => r && r.error);
  if (bad.length) {
    console.warn('Sincronización:', bad.map(r => r.error));
    if (navigator.onLine === false || bad.some(r => /fetch|network|Failed/i.test(String((r.error && r.error.message) || r.error)))) { undo.forEach(f => f()); if (UNDO_ME) UNDO_ME(); netUI(); }
    else toast('No se pudo guardar un cambio. Intentá de nuevo.');
  }
  UNDO_ME = null;
}
async function upPhoto(dataUrl) {
  if (!CLOUD || !dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  try {
    const blob = await (await fetch(dataUrl)).blob(), path = DB.cur.id + '/' + uid() + '.jpg';
    const { error } = await SB.storage.from('fotos').upload(path, blob, {contentType:'image/jpeg', cacheControl:'31536000'});
    if (error) throw error;
    return SB.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  } catch (e) { console.warn('Foto:', e); return dataUrl; }
}
async function cloudRegister(d, btn) {

  if (REG.t === 'u') Object.assign(meta, {cr:5, resueltos:0}); else Object.assign(meta, {rev:[], on:true, desc:[]});
  const { data, error } = await SB.auth.signUp({email:d.mail, password:d.pass, options:{data:meta, emailRedirectTo:location.origin}});
  done();
  if (error) { $('#err').textContent = authError(error); return; }
  if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) { $('#err').textContent = authError('already registered'); return; }
  if (!data.session) {
    view(`<div class="empty" style="padding-top:72px">${ico('chat')}<h2>Revisá tu mail</h2><p>Te mandamos un link a <b>${esc(d.mail)}</b> para confirmar tu cuenta. Después volvé y tocá “Ya tengo cuenta”.</p>
      <button class="btn p w" style="margin-top:16px" data-a="login">Ya confirmé, ingresar</button></div>`); return;
  }
  try { await cloudLoad(); } catch (e) { console.warn(e); $('#err') && ($('#err').textContent = authError(e)); return; }
  if (REG.foto) { me().foto = await upPhoto(REG.foto); }
  if (REG.t === 'p') seedProvJobs(me());
  save();
  if (REG.t === 'p') { view(`<div class="empty" style="padding-top:80px">${ico('shield')}<h2>Revisando tu perfil…</h2><p>Validamos tu identidad${d.mat ? ' y tu matrícula' : ''}.</p></div>`); setTimeout(enter, 1500); }
  else enter();
}
async function cloudLogin(mail, pass, btn) {
  const done = busy(btn, 'Ingresando…');
  try { await SB_P; } catch (e) { done(); $('#err').textContent = 'No hay conexión. Probá de nuevo en un momento.'; return; }
  if (mail.includes('@')) {
    const { error } = await SB.auth.signInWithPassword({email:mail, password:pass});
    if (error) { done(); $('#err').textContent = authError(error); return; }
  } else {
    // Usuario o celular: el servidor busca la cuenta y devuelve la sesión
    let r = null, d = null;
    try { r = await fetch('/api/login', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:mail, pass})}); d = await r.json().catch(() => null); } catch (e) {}
    if (!r || !d || !d.ok) { done(); $('#err').textContent = !r ? authError('') : r.status === 401 ? 'Los datos o la contraseña no coinciden. Revisalos e intentá de nuevo.'
      : r.status === 429 ? 'Hubo demasiados intentos seguidos. Esperá un minuto y probá de nuevo.' : r.status === 501 ? 'Por ahora ingresá con tu mail.' : authError(''); return; }
    const { error } = await SB.auth.setSession({access_token:d.access_token, refresh_token:d.refresh_token});
    if (error) { done(); $('#err').textContent = authError(error); return; }
  }
  try { await cloudLoad(); } catch (e) { done(); $('#err').textContent = authError(e); return; }
  enter();
}

function netUI() { $('#offline').hidden = navigator.onLine !== false; }

/* ---------- arranque ---------- */
const T0 = performance.now(); let LAUNCH_ON = true;
function hideLaunch() {
  const el = $('#launch'); if (!el) { LAUNCH_ON = false; return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = Math.max(0, (reduce ? 300 : 1100) - (performance.now() - T0));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); LAUNCH_ON = false; }, 460); }, wait);
}
// Arranque: todo en paralelo. Si no hay sesión guardada, la bienvenida aparece sin esperar a la red.
async function boot() {
  if (location.hash === '#imagenes') return vGaleria();
  const recovery = /type=recovery/.test(location.hash);
  let cfg = null; try { cfg = JSON.parse(localStorage.getItem('hg-cfg') || 'null'); } catch (e) {}
  const fresh = fetch('/api/config', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)
    .then(c => { if (c && c.ok) { try { localStorage.setItem('hg-cfg', JSON.stringify(c)); } catch (e) {} } return c; });
  if (!cfg || !cfg.ok) cfg = await fresh;
  if (!cfg || !cfg.ok) return render();                          // sin Supabase: modo local
  const localDB = DB;
  $('#top').hidden = true; $('#nav').hidden = true;
  CLOUD = true; DB = {users:[], provs:[], jobs:[], cur:null};
  SB_P = loadSB().then(() => {
    SB = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'handygo-auth'}});
    SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') vNewPass(); });
    return SB;
  });
  SB_P.catch(e => { console.warn('Nube:', e); if (!DB.cur) { CLOUD = false; DB = localDB; } });
  let saved = false; try { saved = !!localStorage.getItem('handygo-auth'); } catch (e) {}
  if (!saved && !recovery) return welcome();                     // sin sesión: directo a la bienvenida
  try {
    await SB_P;
    const { data:{ session } } = await SB.auth.getSession();
    if (recovery && session) { history.replaceState(null, '', location.pathname); return vNewPass(); }
    if (session && await cloudLoad()) return enter();
  } catch (e) { console.warn('Nube:', e); if (!CLOUD) return render(); }
  welcome();
}
boot().catch(e => console.warn(e)).finally(hideLaunch);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
