":"canilla|sif[oó]n|ducha|manguera|caño|p[eé]rdida|gotea|flexible|tuerca|rosca|agua","c":"plomeria"},{"id":"sopapa","n":"Sopapa","a":["sopapas?"],"q":"Es una ventosa de goma con un palo. Al empujar y tirar, destapa el inodoro o la pileta.","d":"En ferreterías y supermercados. Para inodoro, mejor la de fuelle.","c":"plomeria"},{"id":"aireador","n":"Aireador","a":["aireador(es)?","mallita"],"q":"Es la puntita de la canilla con una mallita que mezcla aire con el agua para que no salpique.","d":"En la punta de la canilla. Se desenrosca a mano.","ctx":"canilla|grifo|chorro|salpica","c":"plomeria"},{"id":"zapatilla_canilla","n":"Zapatilla de la canilla","a":["zapatillas?"],"q":"Es la pieza donde va el cuerito, adentro de la canilla. Al cerrar, aprieta contra el asiento y corta el agua.","d":"Adentro del cuerpo de la canilla. Se ve al sacar el vástago con la llave francesa.","ctx":"canilla|grifo|gotea|cuerito","c":"plomeria"},{"id":"cartucho_mono","n":"Cartucho de la canilla monocomando","a":["cartuchos?"],"q":"Es la pieza de adentro de las canillas de una sola palanca. Mezcla agua fría y caliente. Cuando se gasta, la canilla gotea o cuesta mover la palanca.","d":"Adentro de la canilla, debajo de la palanca. Se compra según la medida (35 o 40 mm): llevá el viejo.","ctx":"monocomando|canilla de palanca|grifo de palanca","c":"plomeria"},{"id":"flexible","n":"Flexible","a":["flexibles?","manguera flexible","conexi[oó]n flexible"],"q":"Es el caño mallado que conecta la canilla o la mochila con la llave de paso de la pared. Con los años se oxida y pierde.","d":"Debajo de la bacha, de la pileta o al costado del inodoro. Se compra por largo (30 o 40 cm).","c":"plomeria"},{"id":"tapon","n":"Tapón de la pileta","a":["tap[oó]n(es)?","sopapa de la pileta"],"q":"Es la pieza que tapa el desagüe de la bacha para juntar agua. Ahí se enganchan pelos y restos que tapan.","d":"En el fondo de la bacha o de la bañera. Algunos se sacan girándolos.","ctx":"bacha|pileta|ba[ñn]era|lavatorio","c":"plomeria"},{"id":"sonda","n":"Sonda destapacañerías","a":["sondas?","destapador(es)? de cañer[ií]as?","cinta destapadora"],"q":"Es un cable de acero flexible y largo que se mete por el caño para empujar o enganchar lo que tapa.","d":"En ferreterías. Para la casa alcanza una de 5 metros.","c":"plomeria"},{"id":"vastago","n":"Vástago de la canilla","a":["v[aá]stagos?"],"q":"Es la pieza de bronce que se mueve al girar la manija. En la punta lleva la zapatilla con el cuerito.","d":"Adentro de la canilla. Se desenrosca con llave francesa después de sacar la manija.","c":"plomeria"},{"id":"arandela","n":"Arandela","a":["arandelas?"],"q":"Es un aro plano de metal o goma que va debajo de una tuerca o un tornillo para repartir la fuerza o sellar.","d":"En ferreterías, por medida.","c":"plomeria"},{"id":"canilla_doble","c":"plomeria","n":"Canilla de dos manijas","a":["canillas? de dos manijas","grifer[ií]a de dos llaves"],"q":"Es la canilla clásica con una manija para el agua fría y otra para la caliente.","d":"En baños y cocinas más antiguos. Cada manija tiene adentro su cuerito."},{"id":"monocomando","c":"plomeria","n":"Canilla monocomando","a":["monocomandos?","canillas? de palanca","grifo monocomando"],"q":"Es la canilla de una sola palanca: para arriba abre, para los costados mezcla fría y caliente.","d":"En baños y cocinas modernos. Adentro tiene un cartucho en lugar de cueritos."},{"id":"canilla_cocina","c":"plomeria","n":"Canilla de cocina","a":["canillas? de (la )?cocina","grifo de cocina"],"q":"Es la canilla alta de la pileta de la cocina, con pico largo que gira para llegar a las dos bachas.","d":"Sobre la mesada de la cocina.","ctx":"cocina"},{"id":"canilla_servicio","c":"plomeria","n":"Canilla de servicio","a":["canillas? de servicio","canillas? del lavarropas","canilla de pared"],"q":"Es una canilla simple, de pared, con rosca en la salida para conectar una manguera.","d":"En el lavadero, donde se conecta el lavarropas, o en patios y balcones."},{"id":"pico_canilla","c":"plomeria","n":"Pico de la canilla","a":["pico de la canilla","el pico"],"q":"Es el caño por donde sale el agua de la canilla.","d":"En la punta tiene el aireador; algunos giran o se extienden.","ctx":"canilla"},{"id":"campana_canilla","c":"plomeria","n":"Campana (tapa embellecedora)","a":["campanas?","rosetas? de la canilla","tapa embellecedora"],"q":"Es la tapa de metal que cubre la base de la manija y el mecanismo de la canilla.","d":"Debajo de la manija. Se desenrosca a mano o con una llave envuelta en un trapo.","ctx":"canilla"},{"id":"llave_esferica","c":"plomeria","n":"Llave de paso esférica","a":["llaves? esf[eé]ricas?","llave de cuarto de vuelta"],"q":"Es una llave de paso que se abre o se cierra con un cuarto de vuelta de la palanca.","d":"En la entrada de agua de la casa, del baño o de la cocina. Palanca en línea con el caño = abierta."},{"id":"llave_paso_valvula","c":"plomeria","n":"Llave de paso de volante","a":["llaves? de paso de volante","llave de paso redonda"],"q":"Es la llave de paso clásica que se cierra girando una manija redonda varias vueltas.","d":"Embutida en la pared del baño o la cocina, con una tapa cromada."},{"id":"llave_escuadra","c":"plomeria","n":"Llave de paso de escuadra","a":["llaves? de escuadra","llavecitas? de paso"],"q":"Es una llave de paso chiquita que corta el agua de un solo artefacto.","d":"Debajo de la bacha, de la pileta o al lado del inodoro, donde sale el flexible."},{"id":"sifon_botella","c":"plomeria","n":"Sifón de botella","a":["sif[oó]n de botella"],"q":"Es un sifón con forma de vaso que se desenrosca desde abajo para limpiarlo.","d":"Debajo de la bacha del baño. Poné un balde antes de desenroscarlo.","ctx":"bacha"},{"id":"valvula_desague","c":"plomeria","n":"Válvula de desagüe","a":["v[aá]lvulas? de desag[uü]e","desag[uü]e de la bacha"],"q":"Es la pieza metálica del fondo de la bacha por donde se va el agua, con su rejilla o tapón.","d":"En el fondo de la bacha o la pileta, enroscada al sifón por abajo."},{"id":"cano_pvc","c":"plomeria","n":"Caño de PVC","a":["ca[ñn]os? de pvc","ca[ñn]os? de pl[aá]stico"],"q":"Son los caños grises o blancos de plástico que se usan para desagües.","d":"Debajo de las piletas y dentro de las paredes. Se venden por diámetro (40, 50, 63, 110 mm)."},{"id":"codo","c":"plomeria","n":"Codo","a":["codos?"],"q":"Es una pieza que une dos caños y les cambia la dirección, en general a 90 grados.","d":"En las uniones de caños. Se pide por material y diámetro.","ctx":"ca[ñn]o"},{"id":"cupla","c":"plomeria","n":"Cupla","a":["cuplas?"],"q":"Es una pieza que une dos caños en línea recta.","d":"En las uniones de caños. Se pide por material y diámetro."},{"id":"union_doble","c":"plomeria","n":"Unión doble","a":["uniones? dobles?"],"q":"Es una pieza que permite unir y desunir dos caños sin girarlos, con una tuerca en el medio.","d":"En conexiones de agua que a veces hay que desarmar, como bombas o termotanques."},{"id":"te_cano","c":"plomeria","n":"Te","a":["\\bte\\b de ca[ñn]o","pieza en te","ramal"],"q":"Es una pieza con forma de T que divide un caño en dos salidas.","d":"En las instalaciones de agua, donde un caño se divide.","ctx":"ca[ñn]o"},{"id":"niple","c":"plomeria","n":"Niple","a":["niples?"],"q":"Es un caño cortito con rosca en las dos puntas para unir piezas.","d":"En conexiones de canillas, llaves y flexibles."},{"id":"buje_reduccion","c":"plomeria","n":"Buje de reducción","a":["bujes? de reducci[oó]n","reducci[oó]n"],"q":"Es una pieza que une dos caños o roscas de distinto diámetro.","d":"En conexiones donde cambia la medida, por ejemplo de 3/4 a 1/2 pulgada."},{"id":"tapon_rosca","c":"plomeria","n":"Tapón con rosca","a":["tap[oó]n(es)? (con|de) rosca","tap[oó]n macho"],"q":"Es una pieza que cierra la punta de un caño que quedó sin uso.","d":"Se enrosca en la salida libre de un caño. Se pide por medida."},{"id":"abrazadera","c":"plomeria","n":"Abrazadera","a":["abrazaderas?"],"q":"Es un aro de metal con tornillo que aprieta una manguera contra un caño para que no pierda.","d":"En mangueras de lavarropas, de jardín y de bombas."},{"id":"camara_inspeccion","c":"plomeria","n":"Cámara de inspección","a":["c[aá]maras? de inspecci[oó]n","c[aá]mara s[eé]ptica"],"q":"Es la tapa en el piso del patio por donde se revisa la cloaca.","d":"En el patio o la vereda."},{"id":"pileta_patio","c":"plomeria","n":"Pileta de patio","a":["piletas? de patio"],"q":"Es la rejilla con sifón del piso del baño o del patio donde llegan los desagües.","d":"En el piso del baño, del lavadero o del patio."},{"id":"ventilacion_cloacal","c":"plomeria","n":"Caño de ventilación","a":["ca[ñn]o de ventilaci[oó]n( cloacal)?"],"q":"Es el caño que sale al techo y deja salir los gases de la cloaca.","d":"En la terraza o el techo."},{"id":"cisterna","n":"Cisterna o mochila","a":["cisternas?","mochilas?"],"q":"Es el tanque del inodoro que guarda el agua para cuando tirás la cadena.","d":"Es la caja de loza que está atrás del inodoro o colgada arriba. La tapa se levanta con cuidado.","c":"bano"},{"id":"flotante","n":"Flotante","a":["flotantes?"],"q":"Es la pieza que flota en el agua de la mochila. Cuando sube, corta la entrada de agua. Si se rompe, el agua corre todo el tiempo.","d":"Adentro de la mochila, del lado donde entra el caño. Es una boya de plástico, redonda o alargada.","ctx":"inodoro|mochila|cisterna|ba[ñn]o","c":"bano"},{"id":"rebalse","n":"Tubo de rebalse","a":["tubos? de rebalse"],"q":"Es un caño vertical adentro de la mochila. Si el agua sube de más, se va por ahí al inodoro.","d":"Adentro de la mochila, en el medio. Es el tubo abierto arriba.","c":"bano"},{"id":"flor_ducha","n":"Flor de la ducha","a":["flor(es)? de la ducha","regadera"],"q":"Es la parte de arriba de la ducha, con los agujeritos por donde sale el agua.","d":"Arriba, en la punta del caño de la ducha. Se desenrosca girando hacia la izquierda.","c":"bano"},{"id":"junta_bano","n":"Junta de la bañera","a":["la junta"],"q":"Es la línea entre la bañera (o la bacha) y los azulejos, que se sella con silicona para que no pase agua.","d":"En el borde donde la bañera toca la pared.","ctx":"ba[ñn]era|silicona|ducha|bacha|azulejo","c":"bano"},{"id":"pulsador","n":"Pulsador del inodoro","a":["pulsador(es)?","bot[oó]n de la mochila","bot[oó]n de descarga"],"q":"Es el botón que apretás para tirar la cadena. Por abajo mueve la válvula que larga el agua.","d":"Arriba o al frente de la mochila. En las de embutir, en la pared.","c":"bano"},{"id":"valvula_descarga","n":"Válvula de descarga","a":["v[aá]lvulas? de descarga","sapitos?","campana de la mochila"],"q":"Es la pieza en el fondo de la mochila que se levanta para soltar el agua y vuelve a cerrar. Si cierra mal, el agua corre sola.","d":"Adentro de la mochila, en el medio del fondo.","ctx":"inodoro|mochila|cisterna","c":"bano"},{"id":"barral","n":"Barral","a":["barral(es)?"],"q":"Es el caño de donde se cuelga la cortina. Va sobre dos soportes atornillados a la pared.","d":"Arriba de la ventana o de la ducha.","c":"bano"},{"id":"mezcladora_ducha","c":"bano","n":"Mezcladora de ducha","a":["mezcladoras?","llaves? de la ducha","grifer[ií]a de ducha"],"q":"Son las llaves de la pared de la ducha que mezclan el agua fría y la caliente.","d":"Embutidas en la pared de la ducha, debajo de la flor.","ctx":"ducha"},{"id":"transferencia","c":"bano","n":"Transferencia de la ducha","a":["transferencias?","desviador"],"q":"Es la perilla que pasa el agua de la canilla de la bañera a la ducha.","d":"En la grifería de la bañera, en el medio o arriba del pico."},{"id":"brazo_ducha","c":"bano","n":"Brazo de la ducha","a":["brazo de la ducha","caño de la ducha"],"q":"Es el caño que sale de la pared y sostiene la flor de la ducha.","d":"Arriba, en la pared de la ducha. La flor se enrosca en su punta."},{"id":"ducha_telefono","c":"bano","n":"Ducha de mano (teléfono)","a":["ducha tel[eé]fono","ducha de mano","flor de mano"],"q":"Es la ducha que se agarra con la mano, unida a una manguera.","d":"En bañeras y duchas, colgada de un soporte."},{"id":"manguera_ducha","c":"bano","n":"Manguera de la ducha de mano","a":["manguera de la ducha"],"q":"Es la manguera flexible que une la grifería con la ducha de mano.","d":"Entre la grifería y la ducha de mano. Se enrosca a mano en las dos puntas.","ctx":"ducha"},{"id":"desague_banera","c":"bano","n":"Desagüe de la bañera","a":["desag[uü]e de la ba[ñn]era"],"q":"Es el agujero del fondo de la bañera con su rejilla y su tapón, donde se juntan pelos.","d":"En el fondo de la bañera, del lado de la grifería.","ctx":"ba[ñn]era"},{"id":"inodoro","c":"bano","n":"Inodoro","a":["inodoros?","\\bwc\\b"],"q":"Es el artefacto del baño donde se descarga el agua de la mochila.","d":"En el baño. Abajo está fijado al piso con dos tornillos y una junta."},{"id":"mochila_colgar","c":"bano","n":"Mochila de colgar","a":["mochilas? de colgar","dep[oó]sito alto"],"q":"Es el tanque de agua del inodoro que está alto en la pared, con un caño que baja.","d":"En baños antiguos, arriba del inodoro. Se acciona con una cadena o un botón."},{"id":"cisterna_embutida","c":"bano","n":"Mochila embutida","a":["mochilas? embutidas?","dep[oó]sito embutido","tecla de la pared"],"q":"Es la mochila escondida dentro de la pared; solo se ve la tecla para descargar.","d":"Dentro de la pared, detrás del inodoro. Se accede sacando la tecla."},{"id":"valvula_entrada","c":"bano","n":"Válvula de llenado","a":["v[aá]lvulas? de llenado","v[aá]lvula de entrada"],"q":"Es la pieza que deja entrar agua a la mochila y la corta cuando se llena.","d":"Adentro de la mochila, del lado donde entra el caño de agua.","ctx":"inodoro|mochila"},{"id":"sapito","c":"bano","n":"Sapito (obturador)","a":["sapitos?","obturador","flapper"],"q":"Es la goma que tapa el fondo de la mochila; se levanta al tirar la cadena y vuelve a cerrar.","d":"En el fondo de la mochila. Si está gastada, el agua corre sola.","ctx":"inodoro|mochila"},{"id":"cadena_inodoro","c":"bano","n":"Cadena de la mochila","a":["cadena de la mochila","cadenita"],"q":"Es la cadena que une la palanca o el botón con el sapito.","d":"Adentro de la mochila. Si está floja o enganchada, la descarga falla.","ctx":"inodoro|mochila"},{"id":"palanca_mochila","c":"bano","n":"Palanca de la mochila","a":["palanca de la mochila","manija del inodoro"],"q":"Es la manija que bajás para tirar la cadena.","d":"En el costado o el frente de la mochila.","ctx":"inodoro"},{"id":"conexion_inodoro","c":"bano","n":"Conexión de goma del inodoro","a":["conexi[oó]n de goma","manguito del inodoro","goma del inodoro"],"q":"Es la goma que une la salida del inodoro con el caño de desagüe del piso o de la pared.","d":"Detrás del inodoro, abajo. Si se seca, aparecen pérdidas y olor.","ctx":"inodoro"},{"id":"tapa_inodoro","c":"bano","n":"Tapa del inodoro","a":["tapas? del inodoro","asiento del inodoro"],"q":"Es el asiento con su tapa; se atornilla al inodoro con dos bisagras.","d":"Arriba del inodoro. Para cambiarla, medí la distancia entre los agujeros."},{"id":"bisagra_tapa","c":"bano","n":"Bisagras de la tapa del inodoro","a":["bisagras? de la tapa"],"q":"Son las piezas que sostienen la tapa y la dejan subir y bajar.","d":"Atrás del asiento, con un tornillo largo y una tuerca por debajo del inodoro.","ctx":"inodoro"},{"id":"bulones_inodoro","c":"bano","n":"Bulones del inodoro","a":["bulones? del inodoro","tornillos del inodoro"],"q":"Son los tornillos que fijan el inodoro al piso, tapados con unas tapitas.","d":"A los costados de la base del inodoro."},{"id":"bidet","c":"bano","n":"Bidet","a":["bidets?","bidet"],"q":"Es el artefacto bajo del baño para higiene, con su propia grifería.","d":"En el baño, al lado del inodoro."},{"id":"ducha_bidet","c":"bano","n":"Ducha del bidet","a":["ducha del bidet","flor del bidet"],"q":"Es la pieza del fondo del bidet de donde sale el chorro hacia arriba.","d":"En el fondo del bidet. Se tapa con sarro.","ctx":"bidet"},{"id":"lavatorio","c":"bano","n":"Lavatorio con pie","a":["lavatorios?","pie del lavatorio"],"q":"Es la bacha del baño apoyada sobre una columna de cerámica.","d":"En el baño. La columna esconde el sifón.","ctx":"ba[ñn]o"},{"id":"banera","c":"bano","n":"Bañera","a":["ba[ñn]eras?"],"q":"Es la tina del baño para bañarse.","d":"En el baño. Las juntas con la pared se sellan con silicona."},{"id":"mampara","c":"bano","n":"Mampara","a":["mamparas?"],"q":"Es el cerramiento de vidrio o acrílico de la ducha o la bañera.","d":"Sobre la bañera o el plato de ducha. Tiene rieles y burletes."},{"id":"plato_ducha","c":"bano","n":"Plato de ducha","a":["platos? de ducha","receptáculo"],"q":"Es la base del piso de la ducha, con su desagüe.","d":"En el piso de la ducha."},{"id":"botiquin","c":"bano","n":"Botiquín","a":["botiquines?"],"q":"Es el mueble con espejo que va colgado arriba de la bacha.","d":"En la pared del baño. Se cuelga con tarugos y tornillos."},{"id":"toallero","c":"bano","n":"Toallero","a":["toalleros?"],"q":"Es la barra para colgar las toallas.","d":"En la pared del baño, atornillado con tarugos."},{"id":"portarrollos","c":"bano","n":"Portarrollos","a":["portarrollos"],"q":"Es el soporte del papel higiénico.","d":"En la pared del baño, al lado del inodoro."},{"id":"extractor_bano","c":"bano","n":"Extractor de baño","a":["extractor(es)? de(l)? ba[ñn]o","ventilador del ba[ñn]o"],"q":"Es un ventilador chico que saca el vapor y la humedad del baño.","d":"En el techo o la parte alta de la pared del baño. La rejilla se limpia con agua y detergente."},{"id":"cortina_bano","c":"bano","n":"Cortina de baño","a":["cortinas? de(l)? ba[ñn]o"],"q":"Es la cortina impermeable de la ducha o la bañera.","d":"Colgada de un barral sobre la bañera."},{"id":"espejo","c":"bano","n":"Espejo","a":["espejos?"],"q":"Es el espejo de pared; los pesados se cuelgan con tarugos y ganchos firmes.","d":"En el baño o el dormitorio."},{"id":"asiento_inodoro","c":"bano","n":"Asiento de inodoro","a":["asientos? de(l)? inodoro"],"q":"Es el asiento donde te sentás; se cambia con dos tornillos.","d":"Sobre el inodoro, debajo de la tapa."},{"id":"pileta_lavadero","c":"bano","n":"Pileta de lavadero","a":["piletas? de lavadero","pileta del lavadero"],"q":"Es la pileta honda para lavar ropa a mano.","d":"En el lavadero."},{"id":"jabonera","c":"bano","n":"Jabonera","a":["jaboneras?"],"q":"Es el soporte para el jabón.","d":"En la pared de la ducha o el lavatorio."},{"id":"barral_ducha","c":"bano","n":"Barral de ducha","a":["barral de (la )?ducha"],"q":"Es el caño que sostiene la cortina de baño.","d":"Arriba de la bañera o la ducha."},{"id":"agarradera","c":"bano","n":"Agarradera de baño","a":["agarraderas?","barra de apoyo"],"q":"Es una barra firme para apoyarse en el baño.","d":"Junto al inodoro o la ducha."},{"id":"filtro_campana","n":"Filtro de la campana","a":["filtros?"],"q":"Es una malla de metal o una lámina que junta la grasa del vapor de la cocina. Si se satura, la campana chupa menos y gotea grasa.","d":"Abajo de la campana o del extractor, arriba del anafe. Se saca con una trabita o un clip.","ctx":"campana|extractor|purificador de cocina|grasa|anafe","c":"cocina"},{"id":"sifon_cocina","c":"cocina","n":"Sifón de la pileta de cocina","a":["sif[oó]n de la cocina","sif[oó]n doble"],"q":"Es el caño curvo de plástico debajo de la pileta de la cocina que junta agua para frenar el olor.","d":"Debajo de la pileta, dentro del bajo mesada.","ctx":"cocina"},{"id":"pileta_cocina","c":"cocina","n":"Pileta de cocina","a":["piletas? de (la )?cocina","bacha de (la )?cocina"],"q":"Es la bacha de acero o de loza de la mesada de la cocina.","d":"Sobre el bajo mesada. Abajo están el sifón y las llaves de paso."},{"id":"bajo_mesada","c":"cocina","n":"Bajo mesada","a":["bajo ?mesadas?"],"q":"Es el mueble que está debajo de la pileta de la cocina.","d":"Abajo de la mesada. Adentro están el sifón, los flexibles y las llaves de paso."},{"id":"mesada","c":"cocina","n":"Mesada","a":["mesadas?"],"q":"Es la superficie de trabajo de la cocina, de granito, mármol o laminado.","d":"En la cocina. Las juntas con la pared se sellan con silicona."},{"id":"canilla_extensible","c":"cocina","n":"Canilla con ducha extraíble","a":["ducha extra[ií]ble","canilla extensible","pico extra[ií]ble"],"q":"Es una canilla de cocina cuyo pico sale con una manguera para enjuagar.","d":"En la pileta de la cocina. La manguera corre por debajo de la mesada."},{"id":"campana_cocina","c":"cocina","n":"Campana de cocina","a":["campanas? de (la )?cocina","campana extractora","extractor de cocina"],"q":"Es el aparato que está arriba del anafe y absorbe el humo y la grasa.","d":"Arriba de la cocina. Los filtros se sacan por abajo.","ctx":"cocina|anafe|humo|grasa"},{"id":"extractor_cocina","c":"cocina","n":"Extractor de cocina","a":["extractor(es)? de (cocina|aire)"],"q":"Es un ventilador en la pared o ventana que saca el humo y el olor.","d":"En la pared de la cocina, cerca de la cocina."},{"id":"filtro_carbon","c":"cocina","n":"Filtro de carbón","a":["filtros? de carb[oó]n"],"q":"Es el filtro que retiene el olor en las campanas que no tienen salida afuera.","d":"Adentro de la campana, detrás del filtro de metal.","ctx":"campana|purificador|olor"},{"id":"alacena","c":"cocina","n":"Alacena","a":["alacenas?"],"q":"Es el mueble colgado arriba de la mesada.","d":"En la cocina, sobre la mesada."},{"id":"rejilla_cocina","c":"cocina","n":"Parrilla de la hornalla","a":["parrillas? de la (cocina|hornalla)","rejilla de la hornalla"],"q":"Es la parrilla de hierro donde apoyás las ollas.","d":"Arriba de las hornallas. Se saca para limpiar."},{"id":"horno_cocina","c":"cocina","n":"Horno de la cocina","a":["horno de la cocina","horno a gas"],"q":"Es el horno de la cocina a gas. Si no prende, llamá a un gasista.","d":"Abajo de las hornallas."},{"id":"bandeja_horno","c":"cocina","n":"Bandeja del horno","a":["bandejas? del horno","asadera"],"q":"Es la placa de metal que va adentro del horno.","d":"Adentro del horno, en las guías."},{"id":"grifo_filtro","c":"cocina","n":"Canilla con filtro","a":["canilla con filtro","purificador de agua"],"q":"Es una canilla o equipo que filtra el agua de beber.","d":"En la mesada o debajo de ella."},{"id":"dispenser_agua","c":"cocina","n":"Dispenser de agua","a":["dispensers? de agua","dispenser"],"q":"Es el aparato con bidón para agua fría y caliente.","d":"En la cocina o el comedor."},{"id":"filtro_agua","n":"Filtro de agua (cartucho)","a":["filtros?","cartuchos? del filtro","cartuchos?"],"q":"Es un cartucho que limpia el agua de la canilla: retiene tierra, cloro y sarro. Pierde efecto con el uso y hay que cambiarlo cada algunos meses.","d":"Debajo de la mesada, enroscado en la canilla o en una jarra filtrante. Llevá el viejo a la ferretería para comprar el mismo modelo.","ctx":"purificador|filtro de agua|agua de la canilla|agua potable|agua filtrada|sabor del agua","c":"agua"},{"id":"flotante_tanque","n":"Flotante del tanque de agua","a":["flotantes?","boya"],"q":"Es una boya con una válvula que corta la entrada de agua cuando el tanque está lleno. Si falla, el tanque rebalsa o no se llena.","d":"Adentro del tanque de agua de la casa, en la terraza o el techo. Si hay que subir alto, mejor que lo haga un plomero.","ctx":"tanque de agua|tanque|cisterna de la terraza","c":"agua"},{"id":"tanque_agua","c":"agua","n":"Tanque de agua","a":["tanques? de agua","tanque de reserva"],"q":"Es el tanque que guarda el agua de la casa, en la terraza o el techo.","d":"En la terraza o el techo. Se limpia cada 6 meses, mejor con un profesional."},{"id":"colector","c":"agua","n":"Colector del tanque","a":["colector(es)?"],"q":"Es el caño que reparte el agua que baja del tanque a los distintos ambientes.","d":"Debajo del tanque de agua, con varias llaves de paso.","ctx":"tanque"},{"id":"bomba_presurizadora","c":"agua","n":"Bomba presurizadora","a":["bombas? presurizadoras?","presurizadora"],"q":"Es una bomba que le da más fuerza al agua cuando sale con poca presión.","d":"Cerca del tanque o en el lavadero. Si arranca y para todo el tiempo, puede haber una pérdida."},{"id":"bomba_elevadora","c":"agua","n":"Bomba elevadora","a":["bombas? elevadoras?","bomba de agua"],"q":"Es la bomba que sube el agua de la cisterna al tanque de la terraza.","d":"En la sala de máquinas o el patio, al lado de la cisterna.","ctx":"tanque|cisterna"},{"id":"automatico_tanque","c":"agua","n":"Automático de tanque","a":["autom[aá]tico de tanque","flotante el[eé]ctrico","boya el[eé]ctrica"],"q":"Es un flotante con cable que prende y apaga la bomba según el nivel del tanque.","d":"Adentro del tanque o la cisterna, colgando del cable."},{"id":"valvula_retencion","c":"agua","n":"Válvula de retención","a":["v[aá]lvulas? de retenci[oó]n","v[aá]lvula anti ?retorno"],"q":"Es una válvula que deja pasar el agua en un solo sentido.","d":"En la cañería de las bombas, para que el agua no vuelva."},{"id":"filtro_sedimentos","c":"agua","n":"Filtro de sedimentos","a":["filtros? de sedimentos","filtro de entrada"],"q":"Es un filtro grande que retiene tierra y arenilla del agua que entra a la casa.","d":"En la entrada de agua o después del tanque.","ctx":"agua|tanque"},{"id":"termotanque","c":"agua","n":"Termotanque","a":["termotanques?"],"q":"Es el tanque que calienta y guarda agua caliente, a gas o eléctrico.","d":"En la cocina, el lavadero o un patio. Si es a gas, lo revisa un gasista matriculado."},{"id":"termotanque_electrico","c":"agua","n":"Termotanque eléctrico","a":["termotanques? el[eé]ctricos?"],"q":"Es el termotanque que calienta el agua con una resistencia eléctrica.","d":"Colgado en la pared o parado. La resistencia y el termostato los cambia un técnico."},{"id":"valvula_seguridad","c":"agua","n":"Válvula de seguridad del termotanque","a":["v[aá]lvula de seguridad"],"q":"Es la válvula que larga un poco de agua si sube mucho la presión; es normal que gotee de vez en cuando.","d":"En la entrada de agua fría del termotanque. No hay que taparla nunca.","ctx":"termotanque|calef[oó]n"},{"id":"medidor_agua","c":"agua","n":"Medidor de agua","a":["medidor(es)? de agua"],"q":"Es el aparato que mide el agua que consume la casa.","d":"En la vereda o la entrada."},{"id":"tapa_tanque","c":"agua","n":"Tapa del tanque","a":["tapa del tanque"],"q":"Es la tapa del tanque de agua; tiene que cerrar bien para que no entre suciedad.","d":"Arriba del tanque, en la terraza."},{"id":"ablandador","c":"agua","n":"Ablandador de agua","a":["ablandador(es)? de agua"],"q":"Es un equipo que saca el sarro del agua de la casa.","d":"En la entrada del agua."},{"id":"filtro_lav","n":"Filtro del lavarropas","a":["filtros?"],"q":"Es una pieza que junta pelusas, monedas y cosas de los bolsillos para que no tapen la bomba.","d":"Abajo, al frente del lavarropas, detrás de una tapita chica.","ctx":"lavarropas|lavasecarropas|lavadora","c":"electro"},{"id":"filtro_aspiradora","n":"Filtro de la aspiradora","a":["filtros?"],"q":"Es la pieza (de esponja, tela o papel plisado) que atrapa el polvo fino para que no vuelva al aire. Si está tapado, la aspiradora chupa menos.","d":"Adentro de la aspiradora, junto al depósito de mugre o detrás de una tapa en la parte de atrás.","ctx":"aspiradora|robot aspirador","c":"electro"},{"id":"filtro_lavavajillas","n":"Filtro del lavavajillas","a":["filtros?"],"q":"Es un cilindro con malla en el fondo del lavavajillas que junta restos de comida. Si se tapa, los platos salen sucios y queda agua abajo.","d":"Abajo de todo, adentro del lavavajillas, debajo de la bandeja inferior. Se desenrosca girándolo.","ctx":"lavavajillas|lavaplatos","c":"electro"},{"id":"burlete_heladera","n":"Burlete de la heladera","a":["burletes?","goma de la puerta"],"q":"Es la goma con imán alrededor de la puerta de la heladera. Hace que cierre bien y no se escape el frío. Si está roto o sucio, se forma hielo y gasta más.","d":"En todo el borde interno de la puerta. Se limpia con agua tibia y detergente.","ctx":"heladera|freezer|refrigerador","c":"electro"},{"id":"fuelle_lav","n":"Fuelle del lavarropas","a":["fuelles?","burletes?","goma de la puerta"],"q":"Es la goma gruesa alrededor de la boca del lavarropas de carga frontal. Ahí se junta agua, pelusa y hongos.","d":"En la boca del tambor, al abrir la puerta. Doblá el pliegue hacia afuera para limpiarlo.","ctx":"lavarropas|lavasecarropas|lavadora","c":"electro"},{"id":"bomba_lav","n":"Bomba de desagote","a":["bombas?( de desagote)?"],"q":"Es el motorcito que saca el agua del lavarropas al final del lavado. El filtro la protege de pelusas y monedas.","d":"Abajo del lavarropas, detrás del filtro. Si zumba y no saca agua, probablemente esté trabada con algo.","ctx":"lavarropas|lavasecarropas|lavavajillas","c":"electro"},{"id":"manguera_lav","n":"Manguera del lavarropas","a":["mangueras?( de desagote| de entrada)?"],"q":"Son dos: la de entrada trae agua de la canilla y la de desagote la tira a la pileta o al caño. Si se doblan o se tapan, no carga o no desagota.","d":"Atrás del lavarropas. La gris o blanca corrugada es la de desagote.","ctx":"lavarropas|lavasecarropas","c":"electro"},{"id":"patas_niveladoras","n":"Patas niveladoras","a":["patas? niveladoras?","patas? regulables?"],"q":"Son las patas que se enroscan o desenroscan para que el artefacto quede derecho y no salte al centrifugar.","d":"Abajo, en las esquinas del lavarropas o de la heladera.","c":"electro"},{"id":"desagote_heladera","n":"Desagote de la heladera","a":["desagotes?","orificio de desagote","canaleta"],"q":"Es el agujerito al fondo de la heladera por donde se va el agua del hielo que se derrite. Si se tapa, se junta agua abajo de los cajones.","d":"Adentro, en la pared del fondo, abajo de todo. Se destapa con un hisopo o una pajita con agua tibia.","ctx":"heladera|refrigerador","c":"electro"},{"id":"serpentina_heladera","n":"Rejilla de atrás de la heladera","a":["serpentinas?","parrilla de atr[aá]s","condensador"],"q":"Es la parrilla de caños negros atrás de la heladera que larga el calor. Si junta polvo, la heladera enfría menos.","d":"Atrás de la heladera. Desenchufala antes de limpiarla con un cepillo suave o la aspiradora.","ctx":"heladera|refrigerador|freezer","c":"electro"},{"id":"lavavajillas","c":"electro","n":"Lavavajillas","a":["lavavajillas","lavaplatos"],"q":"Es el electrodoméstico que lava la vajilla.","d":"En la cocina, en general debajo de la mesada."},{"id":"brazo_aspersor","c":"electro","n":"Brazo aspersor del lavavajillas","a":["brazos? aspersor(es)?","aspersor(es)?"],"q":"Es la hélice con agujeritos que gira y tira agua sobre la vajilla.","d":"Adentro del lavavajillas, abajo y en el medio. Los agujeritos se tapan con restos.","ctx":"lavavajillas|lavaplatos"},{"id":"lavarropas","c":"electro","n":"Lavarropas","a":["lavarropas","lavasecarropas","lavadora"],"q":"Es el electrodoméstico que lava la ropa.","d":"En el lavadero o el baño, conectado a una canilla y a un desagüe."},{"id":"tambor_lav","c":"electro","n":"Tambor del lavarropas","a":["tambor(es)?"],"q":"Es el cilindro de acero con agujeritos donde va la ropa.","d":"Adentro del lavarropas. A veces se traban monedas o broches entre el tambor y la cuba.","ctx":"lavarropas|lavadora"},{"id":"cajon_jabon","c":"electro","n":"Cajón del jabón","a":["caj[oó]n del jab[oó]n","jabonera del lavarropas"],"q":"Es el cajoncito donde va el jabón y el suavizante.","d":"Arriba a la izquierda del lavarropas. Se saca entero para lavarlo.","ctx":"lavarropas|lavadora"},{"id":"secarropas","c":"electro","n":"Secarropas","a":["secarropas","secadora"],"q":"Es el electrodoméstico que seca la ropa con aire caliente o centrifugado.","d":"En el lavadero."},{"id":"filtro_pelusa","c":"electro","n":"Filtro de pelusas","a":["filtros? de pelusas?","filtro del secarropas"],"q":"Es la malla que junta la pelusa de la ropa en el secarropas. Hay que limpiarlo después de cada uso.","d":"En la boca o en la puerta del secarropas.","ctx":"secarropas|secadora"},{"id":"heladera","c":"electro","n":"Heladera","a":["heladeras?","refrigerador"],"q":"Es el electrodoméstico que conserva los alimentos fríos.","d":"En la cocina. Necesita espacio atrás para largar el calor."},{"id":"lampara_heladera","c":"electro","n":"Lamparita de la heladera","a":["l[aá]mpara de la heladera","luz de la heladera"],"q":"Es la lamparita chica que se prende al abrir la puerta.","d":"Adentro, arriba o al costado, detrás de una tapita transparente.","ctx":"heladera|refrigerador"},{"id":"perilla_termostato","c":"electro","n":"Perilla de temperatura de la heladera","a":["perilla de (la )?temperatura","termostato de la heladera"],"q":"Es la ruedita que regula cuánto enfría la heladera.","d":"Adentro de la heladera, arriba. El número más alto enfría más.","ctx":"heladera|refrigerador"},{"id":"bandeja_deshielo","c":"electro","n":"Bandeja de deshielo","a":["bandeja de deshielo","bandeja de agua de la heladera"],"q":"Es la bandejita donde cae el agua del hielo que se derrite; se evapora sola con el calor del motor.","d":"Abajo y atrás de la heladera, cerca del motor.","ctx":"heladera|refrigerador"},{"id":"freezer","c":"electro","n":"Freezer","a":["freezers?","congelador"],"q":"Es el compartimento o equipo que congela a menos de 18 grados bajo cero.","d":"Arriba o abajo de la heladera, o como equipo aparte."},{"id":"microondas","c":"electro","n":"Microondas","a":["microondas"],"q":"Es el horno que calienta con ondas.","d":"En la cocina. Si chispea o hace ruido raro, desenchufalo y no lo uses."},{"id":"horno_electrico","c":"electro","n":"Horno eléctrico","a":["horno el[eé]ctrico","horno de mesa"],"q":"Es el horno que funciona con electricidad, sin gas.","d":"En la cocina."},{"id":"aspiradora","c":"electro","n":"Aspiradora","a":["aspiradoras?"],"q":"Es el aparato que junta polvo con succión.","d":"Revisá el filtro y la bolsa cuando pierde fuerza."},{"id":"bolsa_aspiradora","c":"electro","n":"Bolsa de la aspiradora","a":["bolsas? de (la )?aspiradora","dep[oó]sito de la aspiradora"],"q":"Es la bolsa o depósito donde se junta el polvo.","d":"Adentro de la aspiradora, detrás de la tapa."},{"id":"plancha","c":"electro","n":"Plancha","a":["planchas?"],"q":"Es la plancha de ropa. El sarro tapa los agujeros del vapor.","d":"Se limpia con la función de autolimpieza o vinagre diluido."},{"id":"pava_electrica","c":"electro","n":"Pava eléctrica","a":["pavas? el[eé]ctricas?"],"q":"Es la pava que calienta el agua sola. Junta sarro en la resistencia.","d":"Se descalcifica con vinagre y agua."},{"id":"cafetera","c":"electro","n":"Cafetera","a":["cafeteras?"],"q":"Es la máquina de café. Hay que descalcificarla cada tanto.","d":"En la cocina."},{"id":"tostadora","c":"electro","n":"Tostadora","a":["tostadoras?"],"q":"Es el aparato para tostar pan; tiene una bandeja de migas.","d":"La bandeja de migas está abajo y se saca."},{"id":"licuadora","c":"electro","n":"Licuadora","a":["licuadoras?"],"q":"Es el aparato con vaso y cuchillas para licuar.","d":"Si pierde líquido, revisá la junta de goma del vaso."},{"id":"secador_pelo","c":"electro","n":"Secador de pelo","a":["secador(es)? de pelo"],"q":"Es el secador de pelo; tiene un filtro atrás que se tapa con pelusa.","d":"El filtro está en la parte de atrás."},{"id":"televisor","c":"electro","n":"Televisor","a":["televisor(es)?","tele","tv"],"q":"Es el televisor. Muchos problemas se arreglan desenchufando un minuto.","d":"En el living o dormitorio."},{"id":"soporte_tv","c":"electro","n":"Soporte de TV","a":["soportes? de (tv|televisor|tele)"],"q":"Es el soporte de metal que sostiene el televisor en la pared.","d":"Atornillado a la pared con tarugos para mucho peso."},{"id":"router","c":"electro","n":"Router de internet","a":["router(s)?","m[oó]dem","wifi"],"q":"Es el aparato que da internet y wifi a la casa.","d":"Cerca de la entrada del cable. Reiniciarlo resuelve muchos problemas."},{"id":"control_tv","c":"electro","n":"Control remoto de TV","a":["control(es)? (remoto )?de la (tele|tv)"],"q":"Es el control para manejar el televisor.","d":"Si no anda, probá cambiarle las pilas."},{"id":"calefon","c":"gas","n":"Calefón","a":["calefones?"],"q":"Es el artefacto a gas que calienta el agua en el momento en que abrís la canilla.","d":"Colgado en la pared de la cocina o el baño, con un conducto de salida. Lo revisa un gasista matriculado."},{"id":"llave_gas","c":"gas","n":"Llave de paso del gas","a":["llaves? de(l)? paso del gas","llave del gas","llave de gas"],"q":"Es la llave que corta el gas de un artefacto o de toda la casa. Con la palanca cruzada al caño está cerrada.","d":"Al lado de cada artefacto y en el medidor. Ante olor a gas, cerrala."},{"id":"flexible_gas","c":"gas","n":"Conexión flexible de gas","a":["flexibles? de gas","conexi[oó]n flexible de gas","manguera de gas"],"q":"Es el caño flexible que conecta un artefacto a la instalación de gas. Tiene vencimiento.","d":"Detrás de la cocina, el calefón o la estufa. Lo cambia un gasista matriculado."},{"id":"regulador_garrafa","c":"gas","n":"Regulador de la garrafa","a":["regulador(es)?","regulador de (la )?garrafa"],"q":"Es la pieza que se enrosca en la garrafa y baja la presión del gas.","d":"Arriba de la garrafa. Si huele a gas, cerrá la válvula de la garrafa y ventilá.","ctx":"garrafa|gas"},{"id":"garrafa","c":"gas","n":"Garrafa","a":["garrafas?"],"q":"Es el envase de gas envasado que se usa donde no llega gas natural.","d":"Siempre parada, en un lugar ventilado y lejos del calor."},{"id":"piloto","c":"gas","n":"Piloto","a":["piloto","llamita piloto"],"q":"Es la llamita chica que queda siempre prendida para encender el quemador.","d":"Adentro del artefacto, detrás de una ventanita. Para prenderlo, seguí el manual del artefacto.","ctx":"gas|calef[oó]n|termotanque|estufa"},{"id":"quemador","c":"gas","n":"Quemador","a":["quemador(es)?","hornalla"],"q":"Es la parte por donde sale el gas y se forma la llama. La llama tiene que ser azul.","d":"En la cocina, el horno, el calefón o la estufa.","ctx":"gas|cocina|anafe"},{"id":"perilla_cocina","c":"gas","n":"Perilla de la cocina","a":["perillas? de la cocina","perillas? del anafe"],"q":"Son las perillas que abren el gas de cada hornalla.","d":"En el frente de la cocina o el anafe. Se sacan tirando para limpiarlas."},{"id":"anafe","c":"gas","n":"Anafe","a":["anafes?"],"q":"Es la parte de arriba de la cocina con las hornallas, o una cocina de embutir sin horno.","d":"En la mesada de la cocina."},{"id":"cocina_gas","c":"gas","n":"Cocina a gas","a":["cocinas? a gas"],"q":"Es la cocina con hornallas y horno que funciona a gas.","d":"En la cocina, conectada con una conexión flexible de gas."},{"id":"estufa_tiro","c":"gas","n":"Estufa de tiro balanceado","a":["estufas? de tiro balanceado","tiro balanceado"],"q":"Es la estufa a gas que toma el aire de afuera y larga los gases afuera, por un conducto en la pared.","d":"Contra una pared exterior. La revisa un gasista matriculado una vez por año."},{"id":"conducto_evacuacion","c":"gas","n":"Conducto de evacuación","a":["conductos? de evacuaci[oó]n","ca[ñn]o de salida del calef[oó]n","tiraje"],"q":"Es el caño que lleva los gases del calefón o la estufa hacia afuera.","d":"Sale por arriba del artefacto hacia el techo o la pared. Si está tapado, hay riesgo de monóxido."},{"id":"sombrerete","c":"gas","n":"Sombrerete","a":["sombreretes?"],"q":"Es el remate del conducto de gases arriba del techo, que evita que entre agua o viento.","d":"En el techo o la terraza, en la punta del conducto."},{"id":"medidor_gas","c":"gas","n":"Medidor de gas","a":["medidor(es)? de gas"],"q":"Es el aparato que mide cuánto gas usás; al lado está la llave general.","d":"En la entrada de la casa o en un nicho del edificio."},{"id":"termica","n":"Térmica (tablero)","a":["t[eé]rmicas?","tablero"],"q":"Es la palanquita que corta la luz de una parte de la casa. Si la bajás, en ese sector no hay corriente.","d":"En el tablero eléctrico: una cajita con tapa, cerca de la entrada o de la cocina. Cada palanquita suele tener escrito qué sector corta.","c":"elec"},{"id":"buscapolo","n":"Buscapolo","a":["buscapolos?"],"q":"Es un destornillador con una lucecita. Si lo apoyás en un enchufe y se prende, hay corriente: no toques.","d":"En cualquier ferretería. Es barato y conviene tenerlo siempre.","c":"elec"},{"id":"frente_enchufe","n":"Frente del enchufe","a":["el frente","frente del enchufe"],"q":"Es la tapa de plástico que se ve del enchufe. Atrás están los cables y los tornillos.","d":"En la pared. Se saca aflojando uno o dos tornillos, con la térmica bajada.","ctx":"enchufe|tomacorriente|toma","c":"elec"},{"id":"portalamparas","n":"Portalámparas","a":["portal[aá]mparas"],"q":"Es la pieza donde se enrosca la lámpara.","d":"Colgando del techo o adentro de la lámpara de mesa.","c":"elec"},{"id":"zapatilla_elec","n":"Zapatilla eléctrica","a":["zapatillas?","alargues?","prolongador(es)?"],"q":"Es un alargue con varios enchufes. Si se calienta o tiene marcas negras, no la uses más.","d":"Conectada a un tomacorriente de la pared. Comprá una con llave y protección, con sello de seguridad.","ctx":"enchufe|el[eé]ctric|cable|toma|corriente|luz","c":"elec"},{"id":"interruptor","n":"Llave de luz (interruptor)","a":["llaves? de luz","interruptor(es)?","teclas?"],"q":"Es la tecla de la pared que prende y apaga la luz.","d":"En la pared, al lado de la puerta, a la altura de la mano.","c":"elec"},{"id":"disyuntor","n":"Disyuntor (diferencial)","a":["disyuntor(es)?","diferencial(es)?"],"q":"Es la llave del tablero con un botón de prueba. Corta la luz si hay una fuga de corriente y te protege de una descarga.","d":"En el tablero eléctrico, junto a las térmicas. Tiene un botón que dice \"T\" o \"Test\".","c":"elec"},{"id":"ficha","n":"Ficha (enchufe del cable)","a":["fichas?","enchufe macho"],"q":"Es la punta del cable con las patitas de metal que se mete en el tomacorriente.","d":"En la punta del cable del artefacto. Las nuevas son de tres patas planas.","ctx":"enchufe|cable|el[eé]ctric|toma|velador","c":"elec"},{"id":"cinta_aisladora","n":"Cinta aisladora","a":["cintas? aisladoras?","cinta de aislar"],"q":"Es una cinta plástica negra que cubre empalmes de cables para que no queden metales a la vista.","d":"En ferreterías y casas de electricidad.","c":"elec"},{"id":"lamparita","n":"Lamparita LED","a":["lamparitas?","focos?","bombitas?"],"q":"Es la lámpara que se enrosca. Las LED gastan poco y casi no calientan. Fijate la rosca (E27 gruesa, E14 fina) y la luz: cálida o fría.","d":"En cualquier ferretería o supermercado. Llevá la vieja para comparar.","ctx":"l[aá]mpara|luz|portal|velador|ara[ñn]a|plaf[oó]n","c":"elec"},{"id":"tablero","c":"elec","n":"Tablero eléctrico","a":["tableros?","tablero el[eé]ctrico","caja de t[eé]rmicas"],"q":"Es la caja donde están la térmica general, las térmicas de cada circuito y el disyuntor.","d":"Cerca de la entrada, en un pasillo o la cocina. Por dentro lo toca solo un electricista."},{"id":"fusible","c":"elec","n":"Fusible","a":["fusibles?"],"q":"Es una pieza que se quema y corta la luz si hay un problema; las casas viejas los tienen en lugar de térmicas.","d":"En tableros antiguos. Si se quema seguido, llamá a un electricista."},{"id":"toma_corriente","c":"elec","n":"Tomacorriente","a":["tomacorrientes?","tomas? de corriente","enchufes? de (la )?pared"],"q":"Es el enchufe de la pared donde conectás los aparatos.","d":"En las paredes. Si está flojo, caliente o manchado, no lo uses y cortá la térmica."},{"id":"toma_20a","c":"elec","n":"Tomacorriente de 20 A","a":["toma de 20"],"q":"Es un toma más grande para aparatos que consumen mucho, como el aire acondicionado.","d":"Cerca del aire, el horno eléctrico o el termotanque.","ctx":"aire|horno|termotanque"},{"id":"toma_doble","c":"elec","n":"Toma doble","a":["tomas? dobles?"],"q":"Es una tapa con dos enchufes en el mismo lugar.","d":"En las paredes, en general cerca de la mesa de luz o la mesada."},{"id":"tecla_combinada","c":"elec","n":"Llave combinada","a":["llaves? combinadas?","llave de combinaci[oó]n","llave de escalera"],"q":"Es una tecla que prende la misma luz desde dos lugares distintos.","d":"En pasillos, escaleras y dormitorios, una en cada punta.","ctx":"luz|luces|l[aá]mpara|pasillo|escalera|prende|apaga|tecla|interruptor|el[eé]ctric"},{"id":"modulo_electrico","c":"elec","n":"Módulo (tecla o toma suelta)","a":["m[oó]dulos?","modulo el[eé]ctrico"],"q":"Es cada teclita o enchufe suelto que se encastra en el bastidor.","d":"Detrás de la tapa de la llave de luz. Se cambia con la térmica baja."},{"id":"bastidor","c":"elec","n":"Bastidor","a":["bastidor(es)?"],"q":"Es el soporte donde se encastran las teclas y los tomas, atornillado a la caja de la pared.","d":"Detrás de la tapa de las llaves de luz."},{"id":"caja_electrica","c":"elec","n":"Caja eléctrica de pared","a":["caja rectangular","caja de luz","caja octogonal","caja de paso"],"q":"Es la caja metálica o plástica embutida en la pared donde llegan los cables.","d":"Detrás de las llaves, los tomas o en el techo para la luz. Por dentro, la toca un electricista."},{"id":"plafon","c":"elec","n":"Plafón","a":["plafones?"],"q":"Es la luminaria que va pegada al techo, con una tapa de vidrio o acrílico.","d":"En el techo. Para cambiar la lamparita, se saca la tapa con la luz cortada."},{"id":"aplique","c":"elec","n":"Aplique","a":["apliques?"],"q":"Es la lámpara que va fijada a la pared.","d":"En paredes de pasillos, dormitorios o el exterior."},{"id":"lampara_e14","c":"elec","n":"Lamparita de rosca fina (E14)","a":["e14","rosca fina","lamparita chica"],"q":"Es la lamparita de rosca chica que usan veladores y arañas.","d":"En veladores y lámparas decorativas. Llevá la vieja para comparar."},{"id":"dicroica","c":"elec","n":"Lámpara dicroica","a":["dicroicas?","gu10","spot"],"q":"Es la lamparita chica de los spots embutidos del techo, con dos patitas o encastre.","d":"En spots de techo o rieles. Se saca girando un cuarto de vuelta."},{"id":"tubo_led","c":"elec","n":"Tubo LED","a":["tubos? led","tubos? fluorescentes?"],"q":"Es la lámpara larga en forma de tubo.","d":"En cocinas, lavaderos y garajes. Se saca girando un cuarto de vuelta."},{"id":"cable_unipolar","c":"elec","n":"Cable unipolar","a":["cables? unipolar(es)?"],"q":"Es el cable de un solo hilo que va por adentro de las paredes. El color indica para qué es.","d":"Dentro de los caños de la pared. Los toca solo un electricista."},{"id":"cable_taller","c":"elec","n":"Cable de alargue (tipo taller)","a":["cable taller","cable bipolar","cable de alargue"],"q":"Es el cable con funda gruesa que se usa para alargues y aparatos.","d":"En alargues, zapatillas y aparatos."},{"id":"ficha_hembra","c":"elec","n":"Ficha hembra","a":["fichas? hembras?"],"q":"Es la punta del alargue con los agujeros, donde enchufás un aparato.","d":"En la punta de un alargue."},{"id":"adaptador","c":"elec","n":"Adaptador de enchufe","a":["adaptador(es)?","triple","adaptador de patas"],"q":"Es la pieza que permite enchufar una ficha de patas redondas en un toma de patas planas, o al revés.","d":"En casas de electricidad. No los encadenes uno con otro.","ctx":"enchufe|ficha|toma"},{"id":"conector_empalme","c":"elec","n":"Conector de empalme","a":["conectores? de empalme","bornera","conector a palanca"],"q":"Es una pieza que une cables sin pelarlos de más ni usar cinta.","d":"En casas de electricidad. Los empalmes los hace un electricista."},{"id":"timbre","c":"elec","n":"Timbre","a":["timbres?","campanilla"],"q":"Es el aparato que suena cuando tocan el botón de la puerta.","d":"Adentro de la casa, en la pared. Algunos andan a pilas."},{"id":"pulsador_timbre","c":"elec","n":"Botón del timbre","a":["bot[oó]n del timbre","pulsador del timbre"],"q":"Es el botón de afuera que se aprieta para tocar el timbre.","d":"Al lado de la puerta de entrada."},{"id":"portero","c":"elec","n":"Portero eléctrico","a":["porteros? el[eé]ctricos?","intercom"],"q":"Es el teléfono de la pared para hablar con la puerta de calle y abrirla.","d":"En la cocina o el pasillo. El frente de calle lo arregla un técnico."},{"id":"sensor_movimiento","c":"elec","n":"Sensor de movimiento","a":["sensor(es)? de movimiento"],"q":"Es un sensor que prende la luz cuando detecta a alguien.","d":"En pasillos, garajes y entradas."},{"id":"fotocelula","c":"elec","n":"Fotocélula","a":["fotoc[eé]lulas?"],"q":"Es un sensor que prende la luz cuando oscurece y la apaga de día.","d":"En luces exteriores y de jardín."},{"id":"reflector","c":"elec","n":"Reflector LED","a":["reflector(es)?"],"q":"Es un foco potente para iluminar patios, jardines y garajes.","d":"En paredes exteriores, alto."},{"id":"ventilador_techo","c":"elec","n":"Ventilador de techo","a":["ventilador(es)? de techo"],"q":"Es el ventilador colgado del techo con aspas, muchas veces con luz.","d":"En el techo. Si se mueve o hace ruido, revisá que esté bien ajustado."},{"id":"dimmer","c":"elec","n":"Dimmer","a":["dimmers?","regulador de luz"],"q":"Es una perilla que sube o baja la intensidad de la luz.","d":"En lugar de la llave de luz. No todas las lamparitas LED funcionan con dimmer."},{"id":"toma_usb","c":"elec","n":"Toma con USB","a":["tomas? con usb","cargador de pared"],"q":"Es un toma que tiene además salidas USB para cargar el celular.","d":"En dormitorios y escritorios."},{"id":"prolongador","c":"elec","n":"Prolongador","a":["prolongador(es)?"],"q":"Es un alargue simple, con una sola salida.","d":"Entre el aparato y el toma. No lo uses para estufas o pavas eléctricas.","ctx":"el[eé]ctric|enchufe|toma"},{"id":"rosca","n":"Rosca de la lámpara","a":["rosca e27","e27","e14"],"q":"Es la parte de metal que se enrosca. Las comunes son E27 (gruesa) y E14 (fina): tenés que comprar la misma.","d":"En la base de la lámpara. Llevá la vieja a la ferretería para comparar.","ctx":"l[aá]mpara|lamparita|foco|portal","c":"elec"},{"id":"filtro_aire","n":"Filtro del aire acondicionado","a":["filtros?"],"q":"Son dos mallas plásticas finitas que atrapan el polvo antes de que el aire entre al equipo. Si están sucios, el aire enfría menos, gasta más luz y puede largar olor.","d":"Adentro del split de la pared: levantás la tapa del frente (se abre hacia arriba) y quedan a la vista. Salen deslizándolos hacia abajo.","ctx":"aire acondicionado|split|acondicionado|\\baire\\b|fr[ií]o|calor","c":"clima"},{"id":"unidad_interior","n":"Unidad interior (split)","a":["unidad interior","splits?","equipo de adentro"],"q":"Es la parte del aire acondicionado que está adentro de la casa, colgada en la pared. Es la que tira el aire frío o caliente.","d":"En la pared de la habitación, arriba. Es la caja blanca alargada con aletas abajo.","c":"clima"},{"id":"unidad_exterior","n":"Unidad exterior","a":["unidad exterior","condensadora","equipo de afuera","la parte de afuera"],"q":"Es la caja con ventilador que está afuera de la casa. Saca el calor que el equipo junta adentro.","d":"En el balcón, la terraza o colgada en la pared exterior. No la abras: tiene electricidad y gas refrigerante.","ctx":"aire|split|acondicionado","c":"clima"},{"id":"aletas_aire","n":"Aletas del aire","a":["aletas?","deflector(es)?","rejilla de salida"],"q":"Son las paletas que se mueven abajo del split y dirigen el aire hacia arriba, abajo o los costados.","d":"En la salida de aire, en la parte de abajo del split. Se manejan con el control remoto (botón \"swing\").","ctx":"aire|split|acondicionado","c":"clima"},{"id":"desagote_aire","n":"Manguera de desagote del aire","a":["mangueras? de desag[oü]e","mangueras? de desagote","el desagote","drenaje"],"q":"Es una manguerita que saca el agua que el aire acondicionado junta al enfriar. Si se tapa o se dobla, el split gotea dentro de la casa.","d":"Sale por abajo o por el costado del split y va hacia afuera, a un desagüe o a una maceta.","ctx":"aire|split|acondicionado|gotea agua del aire","c":"clima"},{"id":"serpentina_aire","n":"Serpentina (evaporador)","a":["serpentinas?","evaporador","panal de aluminio"],"q":"Es el panal de chapitas de aluminio finitas que está detrás de los filtros. Por ahí pasa el aire para enfriarse. Se limpia con espuma especial, nunca con cepillo duro.","d":"Adentro del split, detrás de los filtros. Las chapitas se doblan fácil: tratala con cuidado.","ctx":"aire|split|acondicionado","c":"clima"},{"id":"control_remoto","n":"Control remoto","a":["control remoto","el control"],"q":"Es el control a pilas que prende el equipo, cambia el modo (frío, calor, deshumidificar) y la temperatura.","d":"Suele estar en un soporte en la pared. Si no responde, primero probá con pilas nuevas.","ctx":"aire|split|acondicionado|televi|tele","c":"clima"},{"id":"rejilla_vent","n":"Rejilla de ventilación","a":["rejillas? de ventilaci[oó]n","ventilaciones?"],"q":"Es la rejilla en la pared que deja entrar aire de afuera. En ambientes con artefactos de gas es obligatoria: nunca la tapes.","d":"En la parte de abajo o de arriba de la pared, en cocina, baño o donde hay estufa o calefón.","c":"clima"},{"id":"estufa_electrica","c":"clima","n":"Estufa eléctrica","a":["estufas? el[eé]ctricas?","panel calefactor"],"q":"Es una estufa que calienta con electricidad, sin gas.","d":"Enchufada en un toma, nunca en un alargue."},{"id":"caloventor","c":"clima","n":"Caloventor","a":["caloventor(es)?","turbo calefactor"],"q":"Es una estufa eléctrica chica con ventilador que tira aire caliente.","d":"Enchufado en un toma directo. Limpiá el polvo de la rejilla."},{"id":"radiador","c":"clima","n":"Radiador de calefacción","a":["radiador(es)?","calefacci[oó]n central"],"q":"Es el panel de metal por donde circula agua caliente para calefaccionar.","d":"Debajo de las ventanas. Si calienta solo abajo, hay que purgarlo."},{"id":"purgador","c":"clima","n":"Purgador del radiador","a":["purgador(es)?","purgar el radiador"],"q":"Es el tornillito del costado del radiador que se abre para sacar el aire.","d":"Arriba, en un costado del radiador. Tené un trapo y un vasito a mano.","ctx":"radiador"},{"id":"llave_radiador","c":"clima","n":"Llave del radiador","a":["llave del radiador","v[aá]lvula termost[aá]tica"],"q":"Es la perilla que abre o cierra el agua caliente de cada radiador.","d":"Abajo de un costado del radiador.","ctx":"radiador"},{"id":"caldera","c":"clima","n":"Caldera","a":["calderas?"],"q":"Es el equipo a gas que calienta el agua de la calefacción y a veces la de la casa.","d":"En la cocina, el lavadero o un patio. La revisa un gasista matriculado."},{"id":"termostato_ambiente","c":"clima","n":"Termostato de ambiente","a":["termostatos? de ambiente","termostato de la calefacci[oó]n"],"q":"Es el aparato de pared que prende y apaga la calefacción según la temperatura.","d":"En la pared del living o un pasillo."},{"id":"ventilador_pie","c":"clima","n":"Ventilador de pie","a":["ventilador(es)? de pie","ventilador de mesa"],"q":"Es el ventilador con aspas protegidas por una rejilla.","d":"Se limpia desenchufado, sacando la rejilla de adelante."},{"id":"soporte_aire","c":"clima","n":"Soporte de la unidad exterior","a":["soporte(s)? del aire","m[eé]nsulas? del aire"],"q":"Son las ménsulas de metal que sostienen la unidad exterior en la pared.","d":"Afuera, en la pared. Si están oxidadas o flojas, lo revisa un técnico.","ctx":"aire|split|unidad exterior"},{"id":"canos_cobre","c":"clima","n":"Caños de cobre del aire","a":["ca[ñn]os? de cobre","ca[ñn]er[ií]a del aire"],"q":"Son los caños que llevan el gas refrigerante entre la unidad de adentro y la de afuera.","d":"Recubiertos con aislante, por la pared. Los toca solo un técnico.","ctx":"aire|split"},{"id":"deshumidificador","c":"clima","n":"Deshumidificador","a":["deshumidificador(es)?"],"q":"Es un aparato que saca la humedad del aire de un ambiente.","d":"En ambientes húmedos; el agua se junta en un tanquecito que hay que vaciar."},{"id":"estufa_halogena","c":"clima","n":"Estufa halógena","a":["estufas? hal[oó]genas?","estufa de cuarzo"],"q":"Es una estufa eléctrica con tubos que se ponen rojos.","d":"Lejos de cortinas y muebles."},{"id":"panel_calefactor","c":"clima","n":"Panel calefactor","a":["panel(es)? calefactor(es)?","panel el[eé]ctrico"],"q":"Es un panel eléctrico que se cuelga en la pared y da
