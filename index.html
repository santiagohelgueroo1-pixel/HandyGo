<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandyGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26573F">
<meta name="description" content="Te ayudamos a resolverlo, te conectamos si hace falta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo teléfono; en compu se muestra dentro de un marco de celular.
   Identidad HandyGo: verde bosque, verde menta, ámbar para botones y alertas; Poppins + Inter. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --sunk:#EAEFE8; --ink:#1E2A24; --mut:#5C6B62; --line:#D8E0D9;
  --pri:#26573F; --priInk:#FFFFFF; --priSoft:#E3F0E5; --mint:#B1D8B7;
  --acc:#F2B33D; --accInk:#1E2A24;
  --warnSoft:#FDF1D8; --warnInk:#7A4E00;
  --bad:#B8381F; --badSoft:#FBEAE5; --ok:#2E7D4F; --okSoft:#E3F2E8;
  --desk:#DCE4DD; --frame:#1E2A24; --head:#26573F; --headInk:#FFFFFF; --dark:#1E2A24;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#7FD39E; --okSoft:#16301F;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#7FD39E; --okSoft:#16301F;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.r1>span{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.device{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){
  body{display:grid;place-items:center;padding-block:20px}
  .device{width:400px;height:min(860px,100%);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 80px -30px rgba(20,40,30,.55)}
}

/* ---------- encabezado con borde de cinta métrica ---------- */
.top{position:relative;flex:none;background:var(--head);color:var(--headInk);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 7px no-repeat}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{display:block;flex:none;border-radius:22%;object-fit:cover}
.top .mark{width:36px;height:36px;box-shadow:0 0 0 1.5px var(--mint)}
.top h1{margin:0;font:700 20px/1.1 var(--f-display);letter-spacing:-.01em}
.top small{display:block;font:500 12.5px/1.3 var(--f-body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:99px;padding:7px 12px;font:700 13px/1 var(--f-body);background:var(--acc);color:var(--accInk);display:inline-flex;gap:6px;align-items:center}
.pill.off{background:rgba(255,255,255,.16);color:var(--headInk)}
body.prov .top{background:var(--dark)}

/* ---------- vista y navegación ---------- */
#view{flex:1;min-height:0;overflow-y:auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font:600 11.5px/1 var(--f-body);position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--f-body)}

/* ---------- tipografía y piezas ---------- */
h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 6px;text-wrap:balance}
h3{font:700 17px/1.25 var(--f-body);margin:0}
.eyebrow{font:700 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mut{color:var(--mut)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-top:26px}
.sec>.eyebrow{display:block;margin-bottom:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:12px 16px;font:700 15.5px/1.1 var(--f-body);text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.g{border-color:var(--line);color:var(--mut);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12.5px/1 var(--f-body);padding:5px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.v{background:var(--okSoft);color:var(--ok)}
.tag.r{background:var(--warnSoft);color:var(--warnInk)}
.tag.b{background:var(--priSoft);color:var(--pri)}
.tag.y{background:var(--acc);color:var(--accInk)}
.stars{color:var(--acc);letter-spacing:1px}
.num{font-variant-numeric:tabular-nums}

label.f{display:block;font:600 14px/1.3 var(--f-body)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pri);outline:none}
.hint{font-size:13px;color:var(--mut);font-weight:400;margin-top:4px;display:block}
.err{color:var(--bad);font-weight:600;font-size:14.5px;min-height:20px}

/* ---------- bienvenida ---------- */
.hero{background:var(--head);color:var(--headInk);margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) 34px max(20px,env(safe-area-inset-left,0px));position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.hero .mark{width:64px;height:64px;box-shadow:0 0 0 2px var(--mint)}
.hero h2{font-size:38px;line-height:1.05;margin:22px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;opacity:.9;max-width:32ch}
.pillars{display:grid;gap:10px;margin:22px 0 18px}
.pillar{display:flex;gap:12px;align-items:flex-start}
.pillar .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.pillar .ico.r{background:var(--warnSoft);color:var(--warnInk)}
.pillar .ico.v{background:var(--okSoft);color:var(--ok)}
.pillar svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font-size:15.5px}
.pillar span{font-size:14px;color:var(--mut)}
.role{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.role:hover{border-color:var(--pri)}
.role .ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.role .ico.y{background:var(--acc);color:var(--accInk)}
.role svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role b{display:block;font-size:17px;margin-bottom:2px}
.role span{font-size:14px;color:var(--mut)}

/* ---------- chat ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;align-self:flex-start;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);border-color:var(--pri);color:var(--priInk);border-radius:18px 18px 6px 18px}
.m.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
.m img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:6px}
.m.sys{align-self:center;background:transparent;border:0;font-size:13px;color:var(--mut);padding:2px}
.who{display:flex;align-items:center;gap:6px;font:700 12px/1 var(--f-body);color:var(--mut);margin:4px 0 -4px 2px}
.who .mark{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .m,.chips{animation:in .22s ease-out}
}
@keyframes blink{50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chips button{border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:99px;padding:8px 14px;font:600 14.5px/1.15 var(--f-body);text-align:left}
.chips button.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);max-height:110px;line-height:1.35}
.composer textarea:focus{outline:none;border-color:var(--pri)}
.recbar{display:flex;align-items:center;gap:10px}
.recbar .t{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1s infinite}}
.m audio{display:block;width:230px;max-width:100%;height:40px}
.m .tr{font-size:14px;opacity:.9;margin-top:6px;font-style:italic}
.iconbtn{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--mut);display:grid;place-items:center}
.iconbtn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attach{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;color:var(--mut)}
.attach img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.attach button{border:0;background:none;color:var(--bad);font-weight:700}
.chatbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.chatbar b{color:var(--ink)}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.off i{background:var(--mut)}

/* ---------- freno de seguridad ---------- */
.stop{border:2px solid var(--acc);background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:100%;align-self:stretch}
.stop .stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1E2A24 12px 24px)}
.stop .in{padding:14px}
.stop h4{margin:0 0 6px;font:700 22px/1 var(--f-display);color:var(--warnInk);display:flex;gap:8px;align-items:center}
.stop h4 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stop p{margin:6px 0;font-size:15px}
.stop .now{background:var(--warnSoft);color:var(--warnInk);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:10px 0}
.stop .rule{font-size:12.5px;color:var(--mut);margin-top:6px}

/* ---------- tutorial ---------- */
.tut{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:stretch}
.tut .hd{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.tut .hd h4{margin:6px 0 8px;font:700 19px/1.1 var(--f-display);font-stretch:110%}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.steps{list-style:none;margin:0;padding:6px 0}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 12px;align-items:center;padding:9px 14px}
.stimg{grid-column:2;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(100deg,var(--sunk) 30%,var(--priSoft) 50%,var(--sunk) 70%) 0 0/300% 100%}
@media (prefers-reduced-motion:no-preference){.stimg:empty{animation:shim 1.4s linear infinite}}
@keyframes shim{to{background-position:-150% 0}}
.stimg img{display:block;width:100%;height:100%;object-fit:cover}
.steps li+li{border-top:1px dashed var(--line)}
.steps .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.steps label{flex:1;display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.steps .n{font:700 12px/1 var(--f-mono);color:var(--mut);margin-top:4px}
.steps input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin:0 0 0 auto}
.steps li.done span.t{text-decoration:line-through;color:var(--mut)}
.warn{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:var(--warnSoft);color:var(--warnInk);font-size:14px;font-weight:600}
.tut .ft{padding:12px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--line);background:var(--sunk)}

/* ---------- orden de caso ---------- */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;font-size:14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.m .ticket::before,.m .ticket::after{background:var(--bg)}
.ticket .tk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 12px/1 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ticket h4{margin:8px 0 12px;font:700 17px/1.25 var(--f-body)}
.ticket dl{margin:0;padding-top:12px;border-top:2px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.ticket dt{font:700 11.5px/1.5 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ticket dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ticket .photo{width:64px;height:64px;object-fit:cover;border-radius:8px}

/* ---------- prestadores y pedidos ---------- */
.offer{display:grid;gap:10px}
.offer .top2{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--priSoft);color:var(--pri)}
.av.lg{width:64px;height:64px;font-size:22px}
.price{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.quote{font-size:14.5px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px}
.list{display:grid;gap:10px}
.jobcard{display:grid;gap:8px;text-align:left;width:100%;color:var(--ink)}
.jobcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{text-align:center;padding:30px 14px;color:var(--mut)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.thread .m{font-size:15px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface)}
.back{border:0;background:none;color:var(--pri);font-weight:700;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.ratebtns{display:flex;gap:6px}
.ratebtns button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font:700 18px/1 var(--f-display)}
.ratebtns button.on{border-color:var(--acc);background:var(--warnSoft);color:var(--warnInk)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card b{display:block;font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat .card span{font-size:13px;color:var(--mut)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--ok)}.tg.on::after{left:25px}
details.offerf{margin-top:4px}
details.offerf summary{list-style:none;cursor:pointer}
details.offerf summary::-webkit-details-marker{display:none}
details.offerf[open] summary{display:none}

/* ---------- materiales ---------- */
.mat{display:flex;gap:12px;align-items:flex-start}
.mat .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--sunk);color:var(--ink);display:grid;place-items:center}
.ask{margin-top:6px;font:500 13px/1.4 var(--f-mono);background:var(--sunk);border-radius:8px;padding:6px 8px;display:block}
.ad{display:flex;gap:12px;align-items:center;border:1px dashed var(--mut);border-radius:var(--r);padding:12px;background:var(--surface)}

.pin{width:30px;height:38px}

.me-dot{width:18px;height:18px;border-radius:50%;background:var(--pri);border:3px solid #fff;box-shadow:0 0 0 6px rgba(38,87,63,.25)}
.leaflet-container{font-family:var(--f-body)}

.ferl{display:grid;gap:6px}

/* ---------- hojas y avisos ---------- */
.scrim{position:absolute;inset:0;background:rgba(14,24,19,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.adfull{position:absolute;inset:0;z-index:30;background:#1E2A24;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 24px;gap:14px}
.adfull .big{font:700 40px/1 var(--f-display);color:var(--acc)}
.adfull .cd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;font:700 13px/1 var(--f-mono);background:rgba(255,255,255,.12);padding:8px 12px;border-radius:99px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);box-shadow:0 8px 24px -8px rgba(0,0,0,.4);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;max-width:90%;text-align:center}
.tag svg,.btn svg,.back svg,.hint svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
img.av{object-fit:cover;background:var(--sunk)}
.avpick{display:flex;gap:14px;align-items:center}
.avpick label.av{cursor:pointer;border:2px dashed var(--pri);background:var(--priSoft);overflow:hidden}
.avpick label.av svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avpick label.av img{width:100%;height:100%;object-fit:cover}
.avpick b{display:block}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.port .ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.port .ph img{width:100%;height:100%;object-fit:cover;display:block}
.port .ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.port .ph button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5}
.port label.add{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mut);cursor:pointer;font-size:13px;text-align:center;padding:6px}
.port label.add svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.bio{font-size:15px;margin:12px 0 0}
.review{border-top:1px solid var(--line);padding-top:10px}
.review:first-child{border-top:0;padding-top:0}
</style>

function readPhoto(file, max) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    if (max <= 300) { const side = Math.min(img.width, img.height); c.width = c.height = Math.min(max, side); c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height); }
    else { c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); }
    res(c.toDataURL('image/jpeg', .82)); }; img.src = r.result; }; r.readAsDataURL(file); });
}

let REC = null;
ACT.mic = async () => {
  if (REC) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') { toast('Este navegador no permite grabar audio'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { toast('Para mandar audios, permití el uso del micrófono'); return; }
  let mr; try { mr = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(t => t.stop()); toast('No se pudo empezar a grabar'); return; }
  REC = {mr, stream, chunks:[], t0:Date.now(), cancel:false};
  mr.ondataavailable = e => { if (e.data && e.data.size) REC && REC.chunks.push(e.data); };
  mr.onstop = async () => {
    const r = REC; REC = null; stream.getTracks().forEach(t => t.stop()); clearInterval(r.timer); recUI(false);
    if (r.cancel) return;
    const dur = (Date.now() - r.t0) / 1000;
    if (dur < 1) { toast('El audio es muy corto'); return; }
    const blob = new Blob(r.chunks, {type:mr.mimeType || 'audio/webm'});
    let audio;
    try { audio = await toWav(blob); } catch (e) { audio = {mime:(blob.type || 'audio/webm').split(';')[0], data:await b64(await blob.arrayBuffer())}; }
    sendAudio(blob, audio, dur);
  };
  REC.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - REC.t0) / 1000); const el = chatEl.querySelector('#recT'); if (el) el.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (sec >= 60) ACT.recStop();
  }, 250);
  mr.start(); recUI(true);
};
ACT.recStop = () => { if (REC && REC.mr.state !== 'inactive') REC.mr.stop(); };
ACT.recCancel = () => { if (REC) { REC.cancel = true; if (REC.mr.state !== 'inactive') REC.mr.stop(); } };
function recUI(on) { if (!chatEl) return; chatEl.querySelector('.composer .bar').hidden = on; chatEl.querySelector('#recbar').hidden = !on; if (on) chatEl.querySelector('#recT').textContent = '0:00'; }

    const d = await r.json(); if (!r.ok || !d.ok) throw new Error('places');
    st = d.items.map(x => ({...x, d:dist(c, x)})).sort((a, b) => a.d - b.d);
  } catch (e) {
    if (my === STORE_REQ && $('#ferList')) $('#ferList').innerHTML = '<div class="card"><b>No pudimos cargar los comercios.</b><div class="small mut">Revisá tu conexión e intentá de nuevo.</div><button class="btn sm" style="margin-top:8px" data-a="retryStores">Reintentar</button></div>';
    return;
  }
  if (my !== STORE_REQ || !$('#ferList') || !MAP) return;
  if (!st.length) { $('#ferList').innerHTML = '<div class="card mut small">No encontramos ferreterías registradas cerca. Probá moviéndote o actualizando la ubicación.</div>'; return; }
  const bounds = [[c.lat, c.lon]];
  const goUrl = x => `https://www.google.com/maps/dir/?api=1&destination=${x.lat},${x.lon}`;
  st.forEach(x => {
    L.marker([x.lat, x.lon], {icon:L.divIcon({className:'pin', html:PIN('#F2B33D'), iconSize:[30, 38], iconAnchor:[15, 37], popupAnchor:[0, -32]})}).addTo(MAP)
      .bindPopup(`<div class="ferl"><b>${esc(x.n)}</b>${x.dir ? `<span>${esc(x.dir)}</span>` : ''}<span>${fmtD(x.d)}</span><a href="${goUrl(x)}" target="_blank" rel="noopener">Cómo llegar</a></div>`);
    if (x.d < 2500) bounds.push([x.lat, x.lon]);
  });
  if (bounds.length > 1) MAP.fitBounds(bounds, {padding:[30, 30], maxZoom:16});
  $('#ferList').innerHTML = st.map(x => `<div class="card"><div class="jobcard"><div class="r1"><h3>${esc(x.n)}</h3><span class="num mut small">${fmtD(x.d)}</span></div>
      <div class="small mut">${esc(SHOPTYPE[x.shop] || 'Comercio')}${x.dir ? ' · ' + esc(x.dir) : ''}</div>
      <div class="meta">${x.h ? `<span class="tag">${esc(String(x.h).slice(0, 40))}</span>` : ''}<a class="tag b" href="${goUrl(x)}" target="_blank" rel="noopener" style="text-decoration:none">${ico('pin')} Cómo llegar</a></div></div></div>`).join('');
}
ACT.retryStores = () => loadStores(LOC || CABA);
ACT.locate = () => {
  const msg = t => { const el = $('#locMsg'); if (el) el.textContent = t; };
  if (!navigator.geolocation) { msg('Este dispositivo no permite compartir la ubicación'); return; }
  msg('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(pos => {
    LOC = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    try { localStorage.setItem('hg_loc', '1'); } catch (e) {}
    const b = $('#locBtn'); if (b) b.innerHTML = ico('pin') + ' Actualizar ubicación';

    try { if (err.code === 1) localStorage.removeItem('hg_loc'); } catch (e) {}
    msg(err.code === 1 ? 'No diste permiso. Podés activarlo en los ajustes del navegador.' : 'No pudimos obtener tu ubicación. Probá de nuevo.');

};

  const cur = {nombre:keep('e_nombre') ?? u.nombre, tel:keep('e_tel') ?? (u.tel || ''), zona:keep('e_zona') ?? u.zona, dir:keep('e_dir') ?? (u.dir || ''),
    bio:keep('e_bio') ?? (u.bio || ''), esp:keep('e_esp') ?? (u.esp || []).join(', '), hor:keep('e_hor') ?? (u.hor || ''), mat:keep('e_mat') ?? (u.mat || ''), anios:keep('e_anios') ?? (u.anios || '')};
  const inp = (id, l, v, t = 'text', ph = '', hint = '') => `<label class="f" for="${id}">${l}<input id="${id}" type="${t}" value="${esc(v)}" placeholder="${esc(ph)}" autocomplete="off">${hint ? `<span class="hint">${hint}</span>` : ''}</label>`;
  view(`<button class="back" data-a="cancelEdit">${ico('back')} Perfil</button><h2>Editar perfil</h2>
   <div class="stack" style="margin-top:14px">
    ${fotoPicker('editFoto', 'edit', EDIT.foto)}
    ${inp('e_nombre', 'Nombre y apellido', cur.nombre)}
    ${inp('e_tel', 'Celular', cur.tel, 'tel', '11 2345 6789', 'Solo se comparte cuando confirmás un trabajo')}
    ${inp('e_zona', p ? 'Zona donde trabajás' : 'Barrio', cur.zona)}
    ${p ? `
    ${inp('e_mat', 'Matrícula', cur.mat, 'text', '', ['Gas', 'Electricidad'].includes(u.rubro) ? 'Obligatoria para ' + u.rubro : 'Opcional en ' + u.rubro)}
    ${inp('e_anios', 'Años de experiencia', cur.anios, 'number')}
    <label class="f" for="e_bio">Sobre vos<textarea id="e_bio" rows="3" placeholder="Contá tu experiencia y cómo trabajás">${esc(cur.bio)}</textarea></label>
    ${inp('e_esp', 'Especialidades', cur.esp, 'text', 'Ej: pérdidas, destapaciones, griferías', 'Separalas con comas')}
    <label class="f" for="e_hor">Horario de atención<select id="e_hor">${['Lunes a viernes, 8 a 18 h', 'Lunes a sábado, 8 a 19 h', 'Todos los días, 8 a 20 h', 'Urgencias 24 h'].map(o => `<option ${o === cur.hor ? 'selected' : ''}>${o}</option>`).join('')}</select></label>
    <div><span class="eyebrow" style="display:block;margin-bottom:8px">Fotos de trabajos realizados</span>
     <div class="port">${(EDIT.port || []).map((x, i) => `<div class="ph"><img src="${x}" alt="Trabajo ${i + 1}"><button data-a="quitarPort" data-v="${i}" aria-label="Quitar foto">${ico('x')}</button></div>`).join('')}
      ${(EDIT.port || []).length < 6 ? `<label class="add" for="e_port">${ico('plus')}<span>Agregar foto</span></label><input type="file" id="e_port" accept="image/*" data-ph="port" hidden>` : ''}</div>
     <span class="hint">Hasta 6 fotos. Los clientes las ven en tu perfil.</span></div>`
    : `${inp('e_dir', 'Dirección', cur.dir, 'text', 'Ej: Av. Medrano 1200, 3.º B', 'Solo la ve el prestador que contrates')}`}
    <div class="err" id="err" role="alert"></div>
    <button class="btn p w" data-a="saveEdit">Guardar cambios</button>
    <button class="btn g w" data-a="cancelEdit">Cancelar</button></div>`);
}
ACT.saveEdit = () => {
  const u = me(), p = DB.cur.t === 'p', v = id => ($('#' + id)?.value || '').trim();
  if (!v('e_nombre') || !v('e_zona')) { $('#err').textContent = 'Completá tu nombre y tu zona.'; return; }
  if (p && ['Gas', 'Electricidad'].includes(u.rubro) && !v('e_mat')) { $('#err').textContent = `Para ${u.rubro} la matrícula es obligatoria.`; return; }
  Object.assign(u, {nombre:v('e_nombre'), tel:v('e_tel'), zona:v('e_zona'), foto:EDIT.foto});
  if (p) Object.assign(u, {mat:v('e_mat'), anios:+v('e_anios') || 0, bio:v('e_bio'), esp:v('e_esp').split(',').map(x => x.trim()).filter(Boolean).slice(0, 8), hor:v('e_hor'), port:EDIT.port});
  else u.dir = v('e_dir');
  try { save(); } catch (e) {}
  V.edit = false; EDIT = null; toast('Perfil actualizado'); render();
};
function tail() {
  return `<div class="sec stack"><button class="btn w" data-a="logout">Cerrar sesión</button><button class="btn g w" data-a="reset">Borrar datos del dispositivo</button>
   <p class="hint" style="text-align:center">HandyGo · Te ayudamos a resolverlo, te conectamos si hace falta.</p></div>`;
}

/* ---------- arranque ---------- */
render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
