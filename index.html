<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandyGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26573F">
<meta name="description" content="Te ayudamos a resolverlo, te conectamos si hace falta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: una sola columna tipo teléfono; en compu se muestra dentro de un marco de celular.
   Identidad HandyGo: verde bosque, verde menta, ámbar para botones y alertas; Poppins + Inter. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --sunk:#EAEFE8; --ink:#1E2A24; --mut:#5C6B62; --line:#D8E0D9;
  --pri:#26573F; --priInk:#FFFFFF; --priSoft:#E3F0E5; --mint:#B1D8B7;
  --acc:#F2B33D; --accInk:#1E2A24;
  --warnSoft:#FDF1D8; --warnInk:#7A4E00;
  --bad:#B8381F; --badSoft:#FBEAE5; --ok:#26573F; --okSoft:#E3F0E5;
  --desk:#DCE4DD; --frame:#1E2A24; --head:#26573F; --headInk:#FFFFFF; --dark:#1E2A24;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.r1>span{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.device{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){
  body{display:grid;place-items:center;padding-block:20px}
  .device{width:400px;height:min(860px,100%);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 80px -30px rgba(20,40,30,.55)}
}

/* ---------- encabezado con borde de cinta métrica ---------- */
.top{position:relative;flex:none;background:var(--head);color:var(--headInk);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}

.top .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.mark{display:block;flex:none;border-radius:22%;object-fit:cover}
.top .mark{display:none}
.top h1{margin:0;font:600 24px/1.15 var(--f-display);letter-spacing:-.01em}
small#hs{display:none}
small#hs.on{display:flex;align-items:center;gap:6px;margin-top:2px}
small#hs.on i{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
small#hs.on.off i{background:rgba(255,255,255,.4)}
.hacts{display:flex;gap:4px;flex:none}
.hacts[hidden]{display:none}
.hbtn{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--headInk);display:grid;place-items:center;cursor:pointer}
.hbtn:hover,.hbtn:focus-visible{background:rgba(255,255,255,.14)}
.hbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.top small{display:block;font:500 12px/1.3 var(--f-body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:99px;padding:8px 12px;font:600 14px/1 var(--f-body);background:var(--mint);color:#1E2A24;display:inline-flex;gap:8px;align-items:center}
.pill.off{background:rgba(255,255,255,.16);color:var(--headInk)}
body.prov .top{background:var(--dark)}

/* ---------- vista y navegación ---------- */
#view{flex:1;min-height:0;overflow-y:auto;padding-block:16px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;background:none;padding:8px 1px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font:600 12px/1 var(--f-body);position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
nav .dot.sm{min-width:9px;width:9px;height:9px;padding:0;top:8px;left:calc(50% + 10px);background:var(--acc)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:600 12px/17px var(--f-body)}

/* ---------- tipografía y piezas ---------- */
h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 8px;text-wrap:balance}
h3{font:600 16px/1.3 var(--f-display);margin:0}
.eyebrow{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mut{color:var(--mut)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-top:24px}
.sec>.eyebrow{display:block;margin-bottom:12px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:12px 16px;font:600 16px/1.1 var(--f-body);text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.stickbar{position:sticky;bottom:-24px;z-index:3;margin:16px -16px -24px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);box-shadow:0 -1px 0 var(--line),0 -8px 16px -12px rgba(20,40,30,.25);display:flex;flex-direction:column;gap:8px}
.stickbar .row{display:flex;gap:8px;flex-wrap:nowrap}
.stickbar .row .btn{flex:1}
.stickbar .row .btn.g{flex:0 0 auto}
.stickbar .hint{text-align:center;margin:0}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.g{border-color:var(--line);color:var(--mut);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(30,42,36,.05),0 0 0 1px rgba(30,42,36,.04)}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--f-body);padding:4px 8px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.v{background:var(--okSoft);color:var(--ok)}
.tag.r{background:var(--warnSoft);color:var(--warnInk)}
.tag.b{background:var(--priSoft);color:var(--pri)}
.tag.y{background:var(--acc);color:var(--accInk)}
.stars{color:var(--acc);letter-spacing:1px}
.num{font-variant-numeric:tabular-nums}

label.f{display:block;font:600 14px/1.3 var(--f-body)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:8px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pri);outline:none}
.telrow{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.telrow input{margin-top:0!important;flex:1;min-width:0}
.telrow .btn{flex:none;padding:8px 14px;font-size:14px}
.hint.ok{color:var(--ok);font-weight:600}
#code{letter-spacing:.4em;font-variant-numeric:tabular-nums}
#sms{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:70;background:var(--surface);color:var(--ink);border-radius:18px;padding:12px 14px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.45);display:flex;gap:12px;align-items:flex-start;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer}
#sms.in{transform:none}
#sms .si{flex:none;width:36px;height:36px;border-radius:10px;background:#34C759;color:#fff;display:grid;place-items:center}
#sms .si svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75}
#sms small{display:block;color:var(--mut);font-size:12px}
#sms b{font-size:14px}
#sms p{margin:2px 0 0;font-size:14px;line-height:1.35}
.hint{font-size:14px;color:var(--mut);font-weight:400;margin-top:4px;display:block}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px}

/* ---------- bienvenida ---------- */
.splash{flex:1;min-height:0;overflow-y:auto;background:var(--head);color:var(--headInk);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(24px,env(safe-area-inset-left,0px))}
.splash .brandc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding-block:24px}
.splash .mark{width:116px;height:116px;border-radius:26%;box-shadow:0 0 0 3px var(--mint),0 18px 40px -16px rgba(0,0,0,.45)}
.splash h1{margin:0;font:700 42px/1 var(--f-display);letter-spacing:-.02em;color:#FFFFFF}
.splash .slogan{margin:0;font:500 16px/1.45 var(--f-body);color:var(--mint);max-width:26ch;text-wrap:balance}
.splash .tape{height:9px;margin:0 calc(-1 * max(24px,env(safe-area-inset-left,0px))) 24px;background:linear-gradient(var(--acc),var(--acc)) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) top/100% 9px no-repeat}
.splash .acts{display:grid;gap:12px}
.splash .btn.o{background:transparent;border-color:#FFFFFF;color:#FFFFFF}
@media (prefers-reduced-motion:no-preference){.splash .brandc>*{animation:rise .5s ease-out both}.splash .brandc>*:nth-child(2){animation-delay:.08s}.splash .brandc>*:nth-child(3){animation-delay:.16s}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hero{background:var(--head);color:var(--headInk);margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 32px) max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px));position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.hero .mark{width:64px;height:64px;box-shadow:0 0 0 2px var(--mint)}
.hero h2{font-size:38px;line-height:1.05;margin:24px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;opacity:.9;max-width:32ch}
.pillars{display:grid;gap:12px;margin:24px 0 16px}
.pillar{display:flex;gap:12px;align-items:flex-start}
.pillar .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.pillar .ico.r{background:var(--warnSoft);color:var(--warnInk)}
.pillar .ico.v{background:var(--okSoft);color:var(--ok)}
.pillar svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font:600 16px/1.3 var(--f-display)}
.pillar span{font-size:14px;color:var(--mut)}
.role{display:flex;gap:16px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.role:hover{border-color:var(--pri)}
.role .ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.role .ico.y{background:var(--acc);color:var(--accInk)}
.role svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.role b{display:block;font:600 18px/1.3 var(--f-display);margin-bottom:2px}
.role span{font-size:14px;color:var(--mut)}

/* ---------- chat ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px}
.m{max-width:84%;padding:10px 14px;border-radius:18px;background:var(--priSoft);border:0;font-size:16px;line-height:1.45;align-self:flex-start;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);color:var(--priInk);border-radius:18px}
.bot + .m.u,.m.u + .bot,.m.u + .chips,.chips + .m.u{margin-top:8px}
.m.bot:has(+ .m.bot){border-bottom-left-radius:6px}
.m.bot + .m.bot{border-top-left-radius:6px}
.m.u:has(+ .m.u){border-bottom-right-radius:6px}
.m.u + .m.u{border-top-right-radius:6px}
.chips.bot{margin-top:4px}
.m.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
.m img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:8px}
.m.sys{align-self:center;background:transparent;border:0;font-size:14px;color:var(--mut);padding:2px}
.who{display:flex;align-items:center;gap:8px;font:600 12px/1 var(--f-body);color:var(--mut);margin:12px 0 2px 2px}
.who:first-child{margin-top:0}
.who .mark{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .m,.chips{animation:in .22s ease-out}
}
@keyframes blink{50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chips button{border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:99px;padding:8px 16px;font:600 14px/1.15 var(--f-body);text-align:left}
.chips button.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:12px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.pillin{flex:1;min-width:0;display:flex;align-items:flex-end;background:var(--sunk);border-radius:24px;padding:4px 4px 4px 16px;border:1px solid transparent;transition:border-color .15s,background .15s}
.pillin:focus-within{border-color:var(--line);background:var(--surface)}
.composer textarea{flex:1;min-width:0;resize:none;border:0;background:transparent;padding:12px 0;max-height:110px;line-height:1.35;font-size:16px}
.composer textarea:focus{outline:none}
.pillin .cam{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mut);cursor:pointer}
.pillin .cam:hover{color:var(--pri)}
.pillin .cam svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.actbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--pri);color:var(--priInk);display:grid;place-items:center;position:relative;transition:transform .12s}
.actbtn:active{transform:scale(.92)}
.actbtn svg{position:absolute;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;transition:transform .18s ease,opacity .18s ease}
.actbtn .i-send{opacity:0;transform:scale(.4) rotate(-45deg)}
.actbtn.send .i-mic{opacity:0;transform:scale(.4)}
.actbtn.send .i-send{opacity:1;transform:none}
.recbar{display:flex;align-items:center;gap:8px}
.recbar .t{flex:1;min-width:0;display:flex;align-items:center;gap:12px;font-weight:600;font-variant-numeric:tabular-nums;border-radius:24px;padding:12px 16px;background:var(--badSoft);color:var(--bad)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.wave{display:flex;align-items:center;gap:4px;height:18px;flex:1;min-width:0;overflow:hidden}
.wave i{width:3px;height:30%;border-radius:2px;background:currentColor;opacity:.75}
@media (prefers-reduced-motion:no-preference){.wave i{animation:wv .9s ease-in-out infinite}}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}.wave i:nth-child(5n){animation-delay:.45s}
@keyframes wv{50%{height:100%}}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1s infinite}}
.m audio{display:block;width:230px;max-width:100%;height:40px}
.m .tr{font-size:14px;opacity:.9;margin-top:8px;font-style:italic}
.iconbtn{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:transparent;color:var(--mut);display:grid;place-items:center}
.iconbtn:hover{background:var(--sunk)}
.iconbtn.p{background:var(--pri);color:var(--priInk)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.attach{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:14px;color:var(--mut)}
.attach img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.attach button{border:0;background:none;color:var(--bad);font-weight:700}
.mode{display:inline-flex;align-items:center;gap:8px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.off i{background:var(--mut)}

/* ---------- freno de seguridad ---------- */
.stop{border:2px solid var(--acc);background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:100%;align-self:stretch}
.stop .stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1E2A24 12px 24px)}
.stop .in{padding:16px}
.stop h4{margin:0 0 8px;font:700 24px/1 var(--f-display);color:var(--warnInk);display:flex;gap:8px;align-items:center}
.stop h4 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.stop p{margin:8px 0;font-size:16px}

#launch p{margin:0;font:500 16px/1.45 var(--f-body);color:var(--mint);max-width:26ch}
#launch .tape{position:absolute;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);height:10px;width:100%;
  background:linear-gradient(var(--acc),var(--acc)) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) top/100% 10px no-repeat}
@media (prefers-reduced-motion:no-preference){
  #launch .lm{animation:lpop .45s cubic-bezier(.2,1.5,.4,1) both}
  #launch .lm img{animation:ltwist .4s ease-in-out .35s both}
  #launch .lm::after{animation:lring .7s ease-out .3s both}
  #launch h1 span{animation:lup .35s cubic-bezier(.2,.8,.2,1) both}
  #launch p{animation:lfade .35s ease-out .55s both}
  #launch .tape{animation:ltape .7s cubic-bezier(.6,0,.2,1) .1s both}
}
@keyframes lpop{from{opacity:0;transform:scale(.4) rotate(-10deg)}}
@keyframes ltwist{0%,100%{transform:rotate(0)}35%{transform:rotate(-14deg)}70%{transform:rotate(6deg)}}
@keyframes lring{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.5)}}
@keyframes lup{from{opacity:0;transform:translateY(110%)}}
@keyframes lfade{from{opacity:0;transform:translateY(8px)}}
@keyframes ltape{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.a-fade{animation:vfade .22s ease-out}
.a-right{animation:vright .28s cubic-bezier(.2,.8,.2,1)}
.a-left{animation:vleft .28s cubic-bezier(.2,.8,.2,1)}
@keyframes vfade{from{opacity:0}}
@keyframes vright{from{opacity:0;transform:translateX(28px)}}
@keyframes vleft{from{opacity:0;transform:translateX(-28px)}}
@media (prefers-reduced-motion:no-preference){
  .scrim{animation:sfade .22s ease-out}
  .scrim .sheet{animation:sup .32s cubic-bezier(.2,.9,.25,1)}
  .scrim.out{animation:sfade .2s ease-in reverse forwards}
  .scrim.out .sheet{animation:sdown .2s ease-in forwards}
}
@media (prefers-reduced-motion:reduce){.a-fade,.a-right,.a-left{animation:none}}
@keyframes sfade{from{opacity:0}}
@keyframes sup{from{transform:translateY(100%)}}
@keyframes sdown{to{transform:translateY(100%)}}
.ahead{position:relative;background:var(--head);color:#FFFFFF;margin:-16px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 16px calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px))}
.ahead::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.ahead .back{color:var(--mint);margin-bottom:16px}
.ahead .ar{display:flex;align-items:center;gap:16px}
.ahead .mark{width:48px;height:48px;box-shadow:0 0 0 2px var(--mint)}
.ahead h2{margin:0;color:#FFFFFF;font-size:24px}
.ahead p{margin:4px 0 0;color:var(--mint);font-size:14px}
.ahead .stepper{display:flex;gap:8px;margin-top:16px}
.ahead .stepper i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.22)}
.ahead .stepper i.on{background:var(--acc)}
.empty svg.illo{width:132px;height:110px;margin:0 auto 12px;display:block;stroke:none;fill:none}
.empty .btn{margin-top:16px}
.skel{position:relative;overflow:hidden;background:var(--sunk);border-radius:8px}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent)}
@media (prefers-reduced-motion:no-preference){.skel::after{animation:shim2 1.3s infinite}}
@keyframes shim2{to{transform:translateX(100%)}}
.skcard{display:grid;gap:12px}
.skrow{display:flex;gap:12px;align-items:center}

.maplibregl-popup-content{border-radius:14px;padding:12px 16px;box-shadow:0 10px 26px -10px rgba(0,0,0,.35);font-size:14px;color:#1E2A24}

.pinm svg{width:30px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));transition:transform .15s}
.pinm.on svg{transform:scale(1.25)}
.fercard{cursor:pointer}
.sub{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}

.sub .ok{color:var(--ok);font-weight:600}
.sub .warn{color:var(--warnInk);font-weight:600}
.sub .sep::before{content:"·";margin-right:8px;color:var(--line)}
.stagetxt{font:600 14px/1.2 var(--f-body);color:var(--mut);display:inline-flex;align-items:center;gap:8px}
.stagetxt::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.stagetxt.y::before{background:var(--acc)}.stagetxt.v::before{background:var(--ok)}.stagetxt.r::before{background:var(--bad)}.stagetxt.n::before{background:var(--pri)}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block}
.textlink{color:var(--pri);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.review{border-top:1px solid var(--line);padding-top:12px}
.review:first-child{border-top:0;padding-top:0}
</style>

function normTel(s) {
  let d = String(s || '').replace(/\D/g, '');
  if (d.startsWith('54')) d = d.slice(2);
  if (d.startsWith('9') && d.length === 11) d = d.slice(1);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.length === 12) for (const n of [2, 3, 4]) if (d.slice(n, n + 2) === '15') { d = d.slice(0, n) + d.slice(n + 2); break; }
  return /^\d{10}$/.test(d) ? d : '';
}

function readPhoto(file, max) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');

    else { c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); }
    res(c.toDataURL('image/jpeg', .82)); }; img.src = r.result; }; r.readAsDataURL(file); });
}

ACT.mic = async () => {

async function ai(txt, img, t, audio, bub) {

    let d = null, lastErr = null;
    for (let intento = 0; intento < 2 && !d; intento++) {
      if (intento) await new Promise(r => setTimeout(r, 1500));
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 32000);
      try {
        const res = await apiFetch(API_URL, {method:'POST', headers:{'content-type':'application/json'}, signal:ctl.signal, body});
        const j = await res.json().catch(() => null);
        if (res.status === 429 || res.status === 401) { lastErr = new Error(res.status === 429 ? 'limite' : 'sin_sesion'); break; }
        if (res.ok && j && j.ok) d = j; else { lastErr = new Error((j && j.error) || 'api'); if (j && j.detail) console.warn('IA:', j.detail); }
      } catch (err) { lastErr = err; }

    }
    if (!d) throw lastErr || new Error('api');
    if (d.audioPerdido && audio) { th.remove(); CH.h.pop(); CH.resp.pop(); say('Ahora no puedo escuchar audios. Escribime con palabras qué pasa y te ayudo igual.'); return; }
    th.remove(); if (AI_OK !== true) { AI_OK = true; setMode(); }

    th.remove(); console.warn('IA no disponible:', e);

/* ---------- reglas (sin conexión) ---------- */
function rules(t, img) {
  if (CH.pend) { // respuesta a la pregunta de acotado
    const tut = TUT[CH.pend]; CH.pend = null;
    const o = tut.o.find(x => x[0].toLowerCase() === t);
    if (o && o[1] === 'ok') return showTut(tut);
    if (o && o[1] === 'pro') { say('Con eso, <b>conviene que lo vea un profesional</b>.'); return derivar(); }
  }
  const tut = findTut(t);
  if (!tut) {
    say(img && !t ? 'Recibí la foto. Para orientarte sin conexión necesito que me cuentes con palabras qué pasa, por ejemplo “la canilla gotea” o “la puerta no cierra”.'
                 : 'No llegué a entender qué se rompió. Probá con otras palabras, por ejemplo “la canilla gotea”, “la puerta roza”, “el inodoro pierde agua” o “se quemó la lámpara”.');
    return;
  }
  if (CH.topic && CH.topic !== tut.id) { const keep = CH.resp[CH.resp.length - 1]; if (!useCredit(true)) { CH.resp.pop(); return; } resetTopic(); CH.resp = [keep]; }
  CH.topic = tut.id; CH.caso = tut.n; CH.rubro = tut.rubro; CH.pend = tut.id;
  say(`Entendido: <b>${esc(tut.n)}</b>. Una pregunta para acotar:<br>${esc(tut.q)}`);

}

s."}, {"id": "guias", "n": "Guías o rieles del cajón", "a": ["gu[ií]as?", "riel(es)?"], "q": "Son las piezas de metal a los costados del cajón por donde corre.", "d": "Adentro del mueble, a los costados del cajón. Se ven al sacarlo.", "ctx": "caj[oó]n|cajones"}, {"id": "silicona_aer", "n": "Silicona en aerosol", "a": ["silicona en aerosol"], "q": "Es un spray que deja una capa resbaladiza. No mancha como el aceite.", "d": "En ferreterías y casas de repuestos."}, {"id": "allen", "n": "Llave Allen", "a": ["llaves? allen"], "q": "Es una llave de metal con forma de L y seis lados, para tornillos con agujero hexagonal (muy común en muebles para armar).", "d": "Suele venir con los muebles. Si no, se venden en juegos."}, {"id": "regaton", "n": "Regatón", "a": ["regat[oó]n(es)?", "fieltros?"], "q": "Es una tapita de goma o fieltro que va en la punta de las patas. Protege el piso y nivela.", "d": "En ferreterías, en bolsitas. Hay que medir el grosor de la pata."}, {"id": "escuadra", "n": "Escuadra metálica", "a": ["escuadras?"], "q": "Es una pieza de metal en forma de L con agujeros, que refuerza una unión de madera.", "d": "En ferreterías, con sus tornillos."}, {"id": "nivel", "n": "Nivel", "a": ["un nivel"], "q": "Es una regla con una burbuja adentro. Cuando la burbuja queda en el medio, está derecho.", "d": "En ferreterías. También hay apps de nivel en el celular."}, {"id": "mecha", "n": "Mecha de widia", "a": ["mechas?", "widia"], "q": "Es la punta del taladro que hace el agujero. La de widia tiene la punta más ancha y sirve para pared de ladrillo.", "d": "Se compra por número: la número 6 va con el tarugo número 6."}, {"id": "taladro", "n": "Taladro", "a": ["taladros?", "perfor[aá]"], "q": "Es la herramienta eléctrica que hace agujeros en la pared o la madera.", "d": "Si no tenés, se puede pedir prestado o alquilar en ferreterías."}, {"id": "tarugo", "n": "Tarugo", "a": ["tarugos?"], "q": "Es un taquito de plástico que va adentro del agujero de la pared. Al meter el tornillo, se abre y queda firme.", "d": "En ferreterías, con el número del agujero: tarugo del 6 para mecha del 6.", "ctx": "pared|taladr|colgar|agujero|cuadro|estante|repisa|espejo|barral|mecha"}, {"id": "sopapa", "n": "Sopapa", "a": ["sopapas?"], "q": "Es una ventosa de goma con un palo. Al empujar y tirar, destapa el inodoro o la pileta.", "d": "En ferreterías y supermercados. Para inodoro, mejor la de fuelle."}, {"id": "pistola", "n": "Pistola de silicona", "a": ["silicona ac[eé]tica", "silicona antihongos", "pistola"], "q": "Es un aplicador donde se pone el cartucho de silicona para sacar un cordón parejo.", "d": "En ferreterías, junto con los cartuchos de silicona."}, {"id": "cinta_papel", "n": "Cinta de papel", "a": ["cintas? de papel", "cinta de enmascarar"], "q": "Es una cinta que se despega fácil y no deja marca. Sirve para que la silicona o la pintura queden prolijas.", "d": "En ferreterías y librerías."}, {"id": "junta_bano", "n": "Junta de la bañera", "a": ["la junta"], "q": "Es la línea entre la bañera (o la bacha) y los azulejos, que se sella con silicona para que no pase agua.", "d": "En el borde donde la bañera toca la pared.", "ctx": "ba[ñn]era|silicona|ducha|bacha|azulejo"}, {"id": "burlete", "n": "Burlete", "a": ["burletes?"], "q": "Es una tira de goma o espuma autoadhesiva que tapa el espacio entre la ventana y el marco para que no entre aire.", "d": "Se pega en el marco de la ventana o de la puerta.", "ctx": "ventana|chiflete|aire que entra|corriente de aire|puerta de calle|puerta de entrada|marco", "neg": "heladera|freezer|lavarropas"}, {"id": "grafito", "n": "Grafito en polvo", "a": ["grafito"], "q": "Es un polvo negro que lubrica las cerraduras sin juntar tierra como el aceite.", "d": "En ferreterías y cerrajerías, en un tubito con pico."}, {"id": "pestillo", "n": "Pestillo", "a": ["pestillos?"], "q": "Es la lengüeta de metal que sale de la puerta y entra en el marco para que quede cerrada.", "d": "En el canto de la puerta, al lado del picaporte."}, {"id": "enduido", "n": "Enduido", "a": ["enduidos?"], "q": "Es una pasta blanca para tapar agujeros chicos y grietas finitas en la pared antes de pintar.", "d": "En ferreterías y pinturerías, en potes."}, {"id": "espatula", "n": "Espátula", "a": ["esp[aá]tulas?"], "q": "Es una paleta de metal finita para poner y alisar el enduido.", "d": "En ferreterías y pinturerías."}, {"id": "filtro_lav", "n": "Filtro del lavarropas", "a": ["filtros?"], "q": "Es una pieza que junta pelusas, monedas y cosas de los bolsillos para que no tapen la bomba.", "d": "Abajo, al frente del lavarropas, detrás de una tapita chica.", "ctx": "lavarropas|lavasecarropas|lavadora"}, {"id": "aireador", "n": "Aireador", "a": ["aireador(es)?", "mallita"], "q": "Es la puntita de la canilla con una mallita que mezcla aire con el agua para que no salpique.", "d": "En la punta de la canilla. Se desenrosca a mano.", "ctx": "canilla|grifo|chorro|salpica"}, {"id": "enrollador", "n": "Enrollador de persiana", "a": ["enrollador(es)?"], "q": "Es la cajita en la pared donde se enrolla la cinta de la persiana.", "d": "En la pared al lado de la ventana, a la altura de la mano."}, {"id": "cinta_persiana", "n": "Cinta de persiana", "a": ["cintas? de (la )?persiana", "la cinta (vieja|nueva)"], "q": "Es la tira de tela que tirás para subir y bajar la persiana.", "d": "Sale del enrollador de la pared y sube hasta el rodillo de arriba."}, {"id": "tablillas", "n": "Tablillas", "a": ["tablillas?"], "q": "Son las tiras horizontales que forman la persiana.", "d": "Es la persiana en sí: cada \"listón\" es una tablilla."}, {"id": "destornillador", "n": "Destornillador Phillips y plano", "a": ["destornillador(es)?( phillips| plano)?", "phillips"], "q": "El Phillips tiene la punta en forma de cruz y el plano, una paleta recta. Usá el que coincida con la ranura del tornillo.", "d": "En cualquier ferretería. Conviene tener uno de cada uno."}, {"id": "filtro_aire", "n": "Filtro del aire acondicionado", "a": ["filtros?"], "q": "Son dos mallas plásticas finitas que atrapan el polvo antes de que el aire entre al equipo. Si están sucios, el aire enfría menos, gasta más luz y puede largar olor.", "d": "Adentro del split de la pared: levantás la tapa del frente (se abre hacia arriba) y quedan a la vista. Salen deslizándolos hacia abajo.", "ctx": "aire acondicionado|split|acondicionado|\\baire\\b|fr[ií]o|calor"}, {"id": "unidad_interior", "n": "Unidad interior (split)", "a": ["unidad interior", "splits?", "equipo de adentro"], "q": "Es la parte del aire acondicionado que está adentro de la casa, colgada en la pared. Es la que tira el aire frío o caliente.", "d": "En la pared de la habitación, arriba. Es la caja blanca alargada con aletas abajo."}, {"id": "unidad_exterior", "n": "Unidad exterior", "a": ["unidad exterior", "condensadora", "equipo de afuera", "la parte de afuera"], "q": "Es la caja con ventilador que está afuera de la casa. Saca el calor que el equipo junta adentro.", "d": "En el balcón, la terraza o colgada en la pared exterior. No la abras: tiene electricidad y gas refrigerante.", "ctx": "aire|split|acondicionado"}, {"id": "aletas_aire", "n": "Aletas del aire", "a": ["aletas?", "deflector(es)?", "rejilla de salida"], "q": "Son las paletas que se mueven abajo del split y dirigen el aire hacia arriba, abajo o los costados.", "d": "En la salida de aire, en la parte de abajo del split. Se manejan con el control remoto (botón \"swing\").", "ctx": "aire|split|acondicionado"}, {"id": "desagote_aire", "n": "Manguera de desagote del aire", "a": ["mangueras? de desag[oü]e", "mangueras? de desagote", "el desagote", "drenaje"], "q": "Es una manguerita que saca el agua que el aire acondicionado junta al enfriar. Si se tapa o se dobla, el split gotea dentro de la casa.", "d": "Sale por abajo o por el costado del split y va hacia afuera, a un desagüe o a una maceta.", "ctx": "aire|split|acondicionado|gotea agua del aire"}, {"id": "serpentina_aire", "n": "Serpentina (evaporador)", "a": ["serpentinas?", "evaporador", "panal de aluminio"], "q": "Es el panal de chapitas de aluminio finitas que está detrás de los filtros. Por ahí pasa el aire para enfriarse. Se limpia con espuma especial, nunca con cepillo duro.", "d": "Adentro del split, detrás de los filtros. Las chapitas se doblan fácil: tratala con cuidado.", "ctx": "aire|split|acondicionado"}, {"id": "control_remoto", "n": "Control remoto", "a": ["control remoto", "el control"], "q": "Es el control a pilas que prende el equipo, cambia el modo (frío, calor, deshumidificar) y la temperatura.", "d": "Suele estar en un soporte en la pared. Si no responde, primero probá con pilas nuevas.", "ctx": "aire|split|acondicionado|televi|tele"}, {"id": "filtro_campana", "n": "Filtro de la campana", "a": ["filtros?"], "q": "Es una malla de metal o una lámina que junta la grasa del vapor de la cocina. Si se satura, la campana chupa menos y gotea grasa.", "d": "Abajo de la campana o del extractor, arriba del anafe. Se saca con una trabita o un clip.", "ctx": "campana|extractor|purificador de cocina|grasa|anafe"}, {"id": "filtro_agua", "n": "Filtro de agua (cartucho)", "a": ["filtros?", "cartuchos? del filtro", "cartuchos?"], "q": "Es un cartucho que limpia el agua de la canilla: retiene tierra, cloro y sarro. Pierde efecto con el uso y hay que cambiarlo cada algunos meses.", "d": "Debajo de la mesada, enroscado en la canilla o en una jarra filtrante. Llevá el viejo a la ferretería para comprar el mismo modelo.", "ctx": "purificador|filtro de agua|agua de la canilla|agua potable|agua filtrada|sabor del agua"}, {"id": "filtro_aspiradora", "n": "Filtro de la aspiradora", "a": ["filtros?"], "q": "Es la pieza (de esponja, tela o papel plisado) que atrapa el polvo fino para que no vuelva al aire. Si está tapado, la aspiradora chupa menos.", "d": "Adentro de la aspiradora, junto al depósito de mugre o detrás de una tapa en la parte de atrás.", "ctx": "aspiradora|robot aspirador"}, {"id": "filtro_lavavajillas", "n": "Filtro del lavavajillas", "a": ["filtros?"], "q": "Es un cilindro con malla en el fondo del lavavajillas que junta restos de comida. Si se tapa, los platos salen sucios y queda agua abajo.", "d": "Abajo de todo, adentro del lavavajillas, debajo de la bandeja inferior. Se desenrosca girándolo.", "ctx": "lavavajillas|lavaplatos"}, {"id": "rejilla_vent", "n": "Rejilla de ventilación", "a": ["rejillas? de ventilaci[oó]n", "ventilaciones?"], "q": "Es la rejilla en la pared que deja entrar aire de afuera. En ambientes con artefactos de gas es obligatoria: nunca la tapes.", "d": "En la parte de abajo o de arriba de la pared, en cocina, baño o donde hay estufa o calefón."}, {"id": "manija_puerta", "n": "Picaporte", "a": ["picaportes?", "manijas?"], "q": "Es la manija que bajás para abrir la puerta. Mueve el pestillo que la traba en el marco.", "d": "En la puerta, a la altura de la mano, de los dos lados. Se ajusta con los tornillos de la roseta o con un tornillito allen al costado.", "ctx": "puerta|cerradura|pestillo|marco", "neg": "ventana|caj[oó]n|mueble|alacena"}, {"id": "manija_ventana", "n": "Manija de la ventana", "a": ["manijas?", "cremonas?"], "q": "Es la manija que gira para trabar y destrabar la ventana. En las de abrir se llama cremona.", "d": "En el marco de la hoja de la ventana. Se sujeta con dos tornillos que quedan tapados por una tapita que gira.", "ctx": "ventana|corrediz|aluminio|abertura"}, {"id": "manija_mueble", "n": "Tirador del mueble", "a": ["manijas?", "tirador(es)?"], "q": "Es la manija o perilla de donde tirás para abrir el cajón o la puerta del mueble. Se sujeta con uno o dos tornillos desde adentro.", "d": "En el frente del cajón o de la puerta. El tornillo se ajusta desde la parte de adentro.", "ctx": "caj[oó]n|cajones|mueble|placard|alacena|c[oó]moda|ropero"}, {"id": "junta_ceramica", "n": "Juntas de los cerámicos (pastina)", "a": ["juntas?", "pastina", "las juntas", "la junta"], "q": "Son las líneas finitas entre cerámico y cerámico, rellenas con pastina. Si se ponen negras o se salen, entra agua y aparecen hongos.", "d": "Entre los cerámicos del piso o de la pared. La pastina se compra en pinturerías, del color de la que ya tenés.", "ctx": "cer[aá]mic|azulejo|porcelanato|baldosa|pastina|piso del ba[ñn]o|revestimiento"}, {"id": "burlete_heladera", "n": "Burlete de la heladera", "a": ["burletes?", "goma de la puerta"], "q": "Es la goma con imán alrededor de la puerta de la heladera. Hace que cierre bien y no se escape el frío. Si está roto o sucio, se forma hielo y gasta más.", "d": "En todo el borde interno de la puerta. Se limpia con agua tibia y detergente.", "ctx": "heladera|freezer|refrigerador"}, {"id": "fuelle_lav", "n": "Fuelle del lavarropas", "a": ["fuelles?", "burletes?", "goma de la puerta"], "q": "Es la goma gruesa alrededor de la boca del lavarropas de carga frontal. Ahí se junta agua, pelusa y hongos.", "d": "En la boca del tambor, al abrir la puerta. Doblá el pliegue hacia afuera para limpiarlo.", "ctx": "lavarropas|lavasecarropas|lavadora"}, {"id": "rodillo_pintura", "n": "Rodillo de pintar", "a": ["rodillos?"], "q": "Es la herramienta con un cilindro de lana o espuma que se carga de pintura y se pasa por la pared para pintar parejo y rápido.", "d": "En pinturerías y ferreterías. Para paredes, uno de lana de 22 cm; para esmalte, uno de espuma.", "ctx": "pint|pared|techo|l[aá]tex|enduido|esmalte"}, {"id": "flotante_tanque", "n": "Flotante del tanque de agua", "a": ["flotantes?", "boya"], "q": "Es una boya con una válvula que corta la entrada de agua cuando el tanque está lleno. Si falla, el tanque rebalsa o no se llena.", "d": "Adentro del tanque de agua de la casa, en la terraza o el techo. Si hay que subir alto, mejor que lo haga un plomero.", "ctx": "tanque de agua|tanque|cisterna de la terraza"}, {"id": "bisagra_mueble", "n": "Bisagra de mueble (cazoleta)", "a": ["bisagras?", "cazoletas?"], "q": "Es la bisagra escondida de las puertas de muebles de cocina y placares. Tiene tornillitos para subir, bajar o acercar la puerta.", "d": "Adentro del mueble, del lado de las bisagras. Se ajusta con un destornillador Phillips.", "ctx": "alacena|placard|mueble|puertita|bajo mesada|ropero|vajillero"}, {"id": "rueda_ventana", "n": "Rueditas de la ventana corrediza", "a": ["ruedas?", "rueditas?", "roldanas?"], "q": "Son las ruedas chiquitas en la parte de abajo de la hoja, que corren sobre el riel. Si se gastan o se ensucian, la ventana se traba o hace ruido.", "d": "Abajo de la hoja de la ventana o de la puerta corrediza. Para verlas hay que levantar la hoja y sacarla del riel.", "ctx": "ventana|corrediz|placard|puerta corrediza|mampara"}, {"id": "riel_corrediza", "n": "Riel de la corrediza", "a": ["gu[ií]as?", "riel(es)?"], "q": "Es la canaleta por donde corren las ruedas de la ventana o la puerta corrediza. Si junta tierra, la hoja se traba.", "d": "Abajo (y a veces arriba) del marco. Se limpia con aspiradora y un pincel.", "ctx": "ventana|corrediz|placard|mampara|puerta corrediza"}, {"id": "riel_cortina", "n": "Riel de la cortina", "a": ["gu[ií]as?", "riel(es)?"], "q": "Es el perfil donde se cuelgan y corren los ganchitos de la cortina.", "d": "Arriba de la ventana, atornillado al techo o a la pared.", "ctx": "cortina|barral|rollers?"}, {"id": "tarugo_madera", "n": "Tarugo de madera (espiga)", "a": ["tarugos? de madera", "espigas?", "tarugos?"], "q": "Es un palito de madera cilíndrico con estrías que une dos piezas de un mueble. Va pegado con cola adentro de agujeros.", "d": "En las uniones de sillas, mesas y muebles armados. Se venden en bolsitas por diámetro (6, 8 o 10 mm).", "ctx": "mueble|madera|silla|mesa|cama|encastr|cola vin"}, {"id": "zapatilla_canilla", "n": "Zapatilla de la canilla", "a": ["zapatillas?"], "q": "Es la pieza donde va el cuerito, adentro de la canilla. Al cerrar, aprieta contra el asiento y corta el agua.", "d": "Adentro del cuerpo de la canilla. Se ve al sacar el vástago con la llave francesa.", "ctx": "canilla|grifo|gotea|cuerito"}, {"id": "zapatilla_elec", "n": "Zapatilla eléctrica", "a": ["zapatillas?", "alargues?", "prolongador(es)?"], "q": "Es un alargue con varios enchufes. Si se calienta o tiene marcas negras, no la uses más.", "d": "Conectada a un tomacorriente de la pared. Comprá una con llave y protección, con sello de seguridad.", "ctx": "enchufe|el[eé]ctric|cable|toma|corriente|luz"}, {"id": "cartucho_mono", "n": "Cartucho de la canilla monocomando", "a": ["cartuchos?"], "q": "Es la pieza de adentro de las canillas de una sola palanca. Mezcla agua fría y caliente. Cuando se gasta, la canilla gotea o cuesta mover la palanca.", "d": "Adentro de la canilla, debajo de la palanca. Se compra según la medida (35 o 40 mm): llevá el viejo.", "ctx": "monocomando|canilla de palanca|grifo de palanca"}, {"id": "cartucho_silicona", "n": "Cartucho de silicona", "a": ["cartuchos?"], "q": "Es el tubo de silicona que se pone en la pistola. Se le corta la punta en diagonal para sacar un cordón finito.", "d": "En ferreterías. Para baño y cocina, pedí silicona con antihongos.", "ctx": "silicona|sellador|pistola"}, {"id": "pulsador", "n": "Pulsador del inodoro", "a": ["pulsador(es)?", "bot[oó]n de la mochila", "bot[oó]n de descarga"], "q": "Es el botón que apretás para tirar la cadena. Por abajo mueve la válvula que larga el agua.", "d": "Arriba o al frente de la mochila. En las de embutir, en la pared."}, {"id": "valvula_descarga", "n": "Válvula de descarga", "a": ["v[aá]lvulas? de descarga", "sapitos?", "campana de la mochila"], "q": "Es la pieza en el fondo de la mochila que se levanta para soltar el agua y vuelve a cerrar. Si cierra mal, el agua corre sola.", "d": "Adentro de la mochila, en el medio del fondo.", "ctx": "inodoro|mochila|cisterna"}, {"id": "flexible", "n": "Flexible", "a": ["flexibles?", "manguera flexible", "conexi[oó]n flexible"], "q": "Es el caño mallado que conecta la canilla o la mochila con la llave de paso de la pared. Con los años se oxida y pierde.", "d": "Debajo de la bacha, de la pileta o al costado del inodoro. Se compra por largo (30 o 40 cm)."}, {"id": "tapon", "n": "Tapón de la pileta", "a": ["tap[oó]n(es)?", "sopapa de la pileta"], "q": "Es la pieza que tapa el desagüe de la bacha para juntar agua. Ahí se enganchan pelos y restos que tapan.", "d": "En el fondo de la bacha o de la bañera. Algunos se sacan girándolos.", "ctx": "bacha|pileta|ba[ñn]era|lavatorio"}, {"id": "sonda", "n": "Sonda destapacañerías", "a": ["sondas?", "destapador(es)? de cañer[ií]as?", "cinta destapadora"], "q": "Es un cable de acero flexible y largo que se mete por el caño para empujar o enganchar lo que tapa.", "d": "En ferreterías. Para la casa alcanza una de 5 metros."}, {"id": "vastago", "n": "Vástago de la canilla", "a": ["v[aá]stagos?"], "q": "Es la pieza de bronce que se mueve al girar la manija. En la punta lleva la zapatilla con el cuerito.", "d": "Adentro de la canilla. Se desenrosca con llave francesa después de sacar la manija."}, {"id": "interruptor", "n": "Llave de luz (interruptor)", "a": ["llaves? de luz", "interruptor(es)?", "teclas?"], "q": "Es la tecla de la pared que prende y apaga la luz.", "d": "En la pared, al lado de la puerta, a la altura de la mano."}, {"id": "disyuntor", "n": "Disyuntor (diferencial)", "a": ["disyuntor(es)?", "diferencial(es)?"], "q": "Es la llave del tablero con un botón de prueba. Corta la luz si hay una fuga de corriente y te protege de una descarga.", "d": "En el tablero eléctrico, junto a las térmicas. Tiene un botón que dice \"T\" o \"Test\"."}, {"id": "ficha", "n": "Ficha (enchufe del cable)", "a": ["fichas?", "enchufe macho"], "q": "Es la punta del cable con las patitas de metal que se mete en el tomacorriente.", "d": "En la punta del cable del artefacto. Las nuevas son de tres patas planas.", "ctx": "enchufe|cable|el[eé]ctric|toma|velador"}, {"id": "cinta_aisladora", "n": "Cinta aisladora", "a": ["cintas? aisladoras?", "cinta de aislar"], "q": "Es una cinta plástica negra que cubre empalmes de cables para que function cloudSave() { clearTimeout(SYNC_T); SYNC_T = setTimeout(cloudSync, 250); }
async function cloudSync() {
  if (!CLOUD || !DB.cur) return;
  if (SYNCING) { await SYNCING; }
  const ops = [];
  const m = me();
  if (m) { const s = JSON.stringify(m); if (s !== SNAP.me) {
    const old = SNAP.me ? JSON.parse(SNAP.me) : {}, patch = {};
    Object.keys(m).forEach(k => { if (k !== 'id' && k !== 'mail' && k !== 'pass' && JSON.stringify(m[k]) !== JSON.stringify(old[k])) patch[k] = m[k]; });
    const prevMe = SNAP.me; SNAP.me = s; if (Object.keys(patch).length) { ops.push(SB.rpc('profile_patch', {p_patch:patch})); UNDO_ME = () => { if (SNAP.me === s) SNAP.me = prevMe; }; } } }
  const undo = [];
  for (const j of DB.jobs) {
    const s = JSON.stringify(j), prev = SNAP.jobs[j.id];
    if (prev === s) continue;
    SNAP.jobs[j.id] = s; undo.push(() => { if (SNAP.jobs[j.id] === s) { if (prev === undefined) delete SNAP.jobs[j.id]; else SNAP.jobs[j.id] = prev; } });
    if (prev === undefined) {
      ops.push(SB.from('jobs').insert({id:j.id, uid:isUuid(j.uid) ? j.uid : null, demo_prov:j.uid === 'demo' ? DB.cur.id : null, rubro:j.rubro, estado:j.estado, prov:j.prov ? String(j.prov) : null, data:j}));
      continue;
    }
    const old = JSON.parse(prev), patch = {}, msgs = [], offers = [];
    Object.keys(j).forEach(k => {
      const a = JSON.stringify(j[k]), b = JSON.stringify(old[k]); if (a === b) return;
      if ((k === 'msgs' || k === 'offers') && Array.isArray(j[k]) && Array.isArray(old[k]) && j[k].length > old[k].length && JSON.stringify(j[k].slice(0, old[k].length)) === b) (k === 'msgs' ? msgs : offers).push(...j[k].slice(old[k].length));
      else patch[k] = j[k];
    });
    ops.push(SB.rpc('job_patch', {p_id:j.id, p_patch:patch, p_msgs:msgs, p_offers:offers}));
  }
  if (!ops.length) return;
  SYNCING = Promise.all(ops.map(p => Promise.resolve(p).catch(e => ({error:e}))));
  const res = await SYNCING; SYNCING = null;
  const bad = res.filter(r => r && r.error);
  if (bad.length) {
    console.warn('Sincronización:', bad.map(r => r.error));
    if (navigator.onLine === false || bad.some(r => /fetch|network|Failed/i.test(String((r.error && r.error.message) || r.error)))) { undo.forEach(f => f()); if (UNDO_ME) UNDO_ME(); netUI(); }
    else toast('No se pudo guardar un cambio. Intentá de nuevo.');
  }
  UNDO_ME = null;
}
async function upPhoto(dataUrl) {
  if (!CLOUD || !dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  try {
    const blob = await (await fetch(dataUrl)).blob(), path = DB.cur.id + '/' + uid() + '.jpg';
    const { error } = await SB.storage.from('fotos').upload(path, blob, {contentType:'image/jpeg', cacheControl:'31536000'});
    if (error) throw error;
    return SB.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  } catch (e) { console.warn('Foto:', e); return dataUrl; }
}

  const done = busy(btn, 'Creando cuenta…');
  try { await SB_P; } catch (e) { done(); $('#err').textContent = 'No hay conexión. Probá de nuevo en un momento.'; return; }
  const meta = {...d}; ['id', 'mail', 'pass', 'foto'].forEach(k => delete meta[k]); meta.t = REG.t;
  if (REG.t === 'u') Object.assign(meta, {cr:5, resueltos:0}); else Object.assign(meta, {rev:[], on:true, desc:[]});
  const { data, error } = await SB.auth.signUp({email:d.mail, password:d.pass, options:{data:meta, emailRedirectTo:location.origin}});
  done();
  if (error) { $('#err').textContent = authError(error); return; }
  if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) { $('#err').textContent = authError('already registered'); return; }
  if (!data.session) {
    view(`<div class="empty" style="padding-top:72px">${ico('chat')}<h2>Revisá tu mail</h2><p>Te mandamos un link a <b>${esc(d.mail)}</b> para confirmar tu cuenta. Después volvé y tocá “Ya tengo cuenta”.</p>
      <button class="btn p w" style="margin-top:16px" data-a="login">Ya confirmé, ingresar</button></div>`); return;
  }
  try { await cloudLoad(); } catch (e) { console.warn(e); $('#err') && ($('#err').textContent = authError(e)); return; }
  if (REG.foto) { me().foto = await upPhoto(REG.foto); }
  if (REG.t === 'p') seedProvJobs(me());
  save();
  if (REG.t === 'p') { view(`<div class="empty" style="padding-top:80px">${ico('shield')}<h2>Revisando tu perfil…</h2><p>Validamos tu identidad${d.mat ? ' y tu matrícula' : ''}.</p></div>`); setTimeout(enter, 1500); }
  else enter();
}
async function cloudLogin(mail, pass, btn) {
  const done = busy(btn, 'Ingresando…');
  try { await SB_P; } catch (e) { done(); $('#err').textContent = 'No hay conexión. Probá de nuevo en un momento.'; return; }
  if (mail.includes('@')) {
    const { error } = await SB.auth.signInWithPassword({email:mail, password:pass});
    if (error) { done(); $('#err').textContent = authError(error); return; }
  } else {
    // Usuario o celular: el servidor busca la cuenta y devuelve la sesión
    let r = null, d = null;
    try { r = await fetch('/api/login', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:mail, pass})}); d = await r.json().catch(() => null); } catch (e) {}
    if (!r || !d || !d.ok) { done(); $('#err').textContent = !r ? authError('') : r.status === 401 ? 'Los datos o la contraseña no coinciden. Revisalos e intentá de nuevo.'
      : r.status === 429 ? 'Hubo demasiados intentos seguidos. Esperá un minuto y probá de nuevo.' : r.status === 501 ? 'Por ahora ingresá con tu mail.' : authError(''); return; }
    const { error } = await SB.auth.setSession({access_token:d.access_token, refresh_token:d.refresh_token});
    if (error) { done(); $('#err').textContent = authError(error); return; }
  }
  try { await cloudLoad(); } catch (e) { done(); $('#err').textContent = authError(e); return; }
  enter();
}

function netUI() { const o = $('#offline'), top = $('#top'); o.hidden = navigator.onLine !== false;
  o.style.top = (top && !top.hidden ? top.offsetHeight : 0) + 'px'; }

/* ---------- arranque ---------- */
const T0 = performance.now(); let LAUNCH_ON = true;
function hideLaunch() {
  const el = $('#launch'); if (!el) { LAUNCH_ON = false; return; }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = Math.max(0, (reduce ? 300 : 1100) - (performance.now() - T0));
  setTimeout(() => { el.classList.add('out'); setTimeout(() => { el.remove(); LAUNCH_ON = false; }, 460); }, wait);
}
// Arranque: todo en paralelo. Si no hay sesión guardada, la bienvenida aparece sin esperar a la red.
async function boot() {
  const recovery = /type=recovery/.test(location.hash);
  let cfg = null; try { cfg = JSON.parse(localStorage.getItem('hg-cfg') || 'null'); } catch (e) {}
  const fresh = fetch('/api/config', {cache:'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null)
    .then(c => { if (c && c.ok) { try { localStorage.setItem('hg-cfg', JSON.stringify(c)); } catch (e) {} } return c; });
  if (!cfg || !cfg.ok) cfg = await fresh;
  if (!cfg || !cfg.ok) return render();                          // sin Supabase: modo local
  const localDB = DB;
  $('#top').hidden = true; $('#nav').hidden = true;
  CLOUD = true; DB = {users:[], provs:[], jobs:[], cur:null};
  SB_P = loadSB().then(() => {
    SB = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'handygo-auth'}});
    SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') vNewPass(); });
    return SB;
  });
  SB_P.catch(e => { console.warn('Nube:', e); if (!DB.cur) { CLOUD = false; DB = localDB; } });
  let saved = false; try { saved = !!localStorage.getItem('handygo-auth'); } catch (e) {}
  if (!saved && !recovery) return welcome();                     // sin sesión: directo a la bienvenida
  try {
    await SB_P;
    const { data:{ session } } = await SB.auth.getSession();
    if (recovery && session) { history.replaceState(null, '', location.pathname); return vNewPass(); }
    if (session && await cloudLoad()) return enter();
  } catch (e) { console.warn('Nube:', e); if (!CLOUD) return render(); }
  welcome();
}
boot().catch(e => console.warn(e)).finally(hideLaunch);
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
