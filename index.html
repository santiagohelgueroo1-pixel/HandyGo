<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HandyGo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#26573F">
<meta name="description" content="Te ayudamos a resolverlo, te conectamos si hace falta.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HandyGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: una sola columna tipo teléfono; en compu se muestra dentro de un marco de celular.
   Identidad HandyGo: verde bosque, verde menta, ámbar para botones y alertas; Poppins + Inter. */
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --sunk:#EAEFE8; --ink:#1E2A24; --mut:#5C6B62; --line:#D8E0D9;
  --pri:#26573F; --priInk:#FFFFFF; --priSoft:#E3F0E5; --mint:#B1D8B7;
  --acc:#F2B33D; --accInk:#1E2A24;
  --warnSoft:#FDF1D8; --warnInk:#7A4E00;
  --bad:#B8381F; --badSoft:#FBEAE5; --ok:#26573F; --okSoft:#E3F0E5;
  --desk:#DCE4DD; --frame:#1E2A24; --head:#26573F; --headInk:#FFFFFF; --dark:#1E2A24;
  --f-display:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1A2520; --sunk:#151F1A; --ink:#EEF3EE; --mut:#9DB0A4; --line:#2B3B33;
  --pri:#B1D8B7; --priInk:#1E2A24; --priSoft:#22382C; --mint:#B1D8B7;
  --warnSoft:#3A2E14; --warnInk:#F2B33D;
  --bad:#FF8C74; --badSoft:#381A14; --ok:#B1D8B7; --okSoft:#22382C;
  --desk:#0A0F0C; --frame:#000000; --head:#1C4230; --headInk:#FFFFFF; --dark:#0D1310; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
.r1>span{white-space:nowrap}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.device{position:relative;height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
@media (min-width:760px){
  body{display:grid;place-items:center;padding-block:20px}
  .device{width:400px;height:min(860px,100%);border:10px solid var(--frame);border-radius:44px;box-shadow:0 30px 80px -30px rgba(20,40,30,.55)}
}

/* ---------- encabezado con borde de cinta métrica ---------- */
.top{position:relative;flex:none;background:var(--head);color:var(--headInk);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;
  background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,
  repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 7px no-repeat}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.mark{display:block;flex:none;border-radius:22%;object-fit:cover}
.top .mark{width:36px;height:36px;box-shadow:0 0 0 1.5px var(--mint)}
.top h1{margin:0;font:700 20px/1.1 var(--f-display);letter-spacing:-.01em}
.top small{display:block;font:500 12.5px/1.3 var(--f-body);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;border:0;border-radius:99px;padding:7px 12px;font:700 13px/1 var(--f-body);background:var(--mint);color:#1E2A24;display:inline-flex;gap:6px;align-items:center}
.pill.off{background:rgba(255,255,255,.16);color:var(--headInk)}
body.prov .top{background:var(--dark)}

/* ---------- vista y navegación ---------- */
#view{flex:1;min-height:0;overflow-y:auto;padding-block:18px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view.flush{padding:0;display:flex;flex-direction:column;overflow:hidden}
nav{flex:none;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:0;border:0;background:none;padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut);font:600 11.5px/1 var(--f-body);position:relative}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri)}
nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--pri)}
nav .dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font:700 10.5px/17px var(--f-body)}

/* ---------- tipografía y piezas ---------- */
h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em;margin:4px 0 6px;text-wrap:balance}
h3{font:600 16.5px/1.3 var(--f-display);margin:0}
.eyebrow{font:700 11.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--mut)}
.mut{color:var(--mut)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec{margin-top:26px}
.sec>.eyebrow{display:block;margin-bottom:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:12px;padding:12px 16px;font:700 15.5px/1.1 var(--f-body);text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.y{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.btn.g{border-color:var(--line);color:var(--mut);background:transparent}
.btn.bad{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.w{width:100%}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tag{display:inline-flex;align-items:center;gap:4px;font:600 12.5px/1 var(--f-body);padding:5px 9px;border-radius:99px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.tag.v{background:var(--okSoft);color:var(--ok)}
.tag.r{background:var(--warnSoft);color:var(--warnInk)}
.tag.b{background:var(--priSoft);color:var(--pri)}
.tag.y{background:var(--acc);color:var(--accInk)}
.stars{color:var(--acc);letter-spacing:1px}
.num{font-variant-numeric:tabular-nums}

label.f{display:block;font:600 14px/1.3 var(--f-body)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:6px;border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);font-weight:400}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--pri);outline:none}
.hint{font-size:13px;color:var(--mut);font-weight:400;margin-top:4px;display:block}
.err{color:var(--bad);font-weight:600;font-size:14.5px;min-height:20px}

/* ---------- bienvenida ---------- */
.splash{flex:1;min-height:0;overflow-y:auto;background:var(--head);color:var(--headInk);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(24px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(24px,env(safe-area-inset-left,0px))}
.splash .brandc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding-block:24px}
.splash .mark{width:116px;height:116px;border-radius:26%;box-shadow:0 0 0 3px var(--mint),0 18px 40px -16px rgba(0,0,0,.45)}
.splash h1{margin:0;font:700 42px/1 var(--f-display);letter-spacing:-.02em;color:#FFFFFF}
.splash .slogan{margin:0;font:500 16px/1.45 var(--f-body);color:var(--mint);max-width:26ch;text-wrap:balance}
.splash .tape{height:9px;margin:0 calc(-1 * max(24px,env(safe-area-inset-left,0px))) 24px;background:linear-gradient(var(--acc),var(--acc)) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) top/100% 9px no-repeat}
.splash .acts{display:grid;gap:12px}
.splash .btn.o{background:transparent;border-color:#FFFFFF;color:#FFFFFF}
@media (prefers-reduced-motion:no-preference){.splash .brandc>*{animation:rise .5s ease-out both}.splash .brandc>*:nth-child(2){animation-delay:.08s}.splash .brandc>*:nth-child(3){animation-delay:.16s}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.hero{background:var(--head);color:var(--headInk);margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:calc(env(safe-area-inset-top,0px) + 28px) max(20px,env(safe-area-inset-right,0px)) 34px max(20px,env(safe-area-inset-left,0px));position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(var(--acc),var(--acc)) bottom/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--acc) 0 2px,transparent 2px 12px) bottom/100% 9px no-repeat}
.hero .mark{width:64px;height:64px;box-shadow:0 0 0 2px var(--mint)}
.hero h2{font-size:38px;line-height:1.05;margin:22px 0 12px;font-weight:700;letter-spacing:-.02em}
.hero h2 em{font-style:normal;color:var(--acc)}
.hero p{margin:0;opacity:.9;max-width:32ch}
.pillars{display:grid;gap:10px;margin:22px 0 18px}
.pillar{display:flex;gap:12px;align-items:flex-start}
.pillar .ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.pillar .ico.r{background:var(--warnSoft);color:var(--warnInk)}
.pillar .ico.v{background:var(--okSoft);color:var(--ok)}
.pillar svg,.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pillar b{display:block;font:600 15.5px/1.3 var(--f-display)}
.pillar span{font-size:14px;color:var(--mut)}
.role{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.role:hover{border-color:var(--pri)}
.role .ico{flex:none;width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--priSoft);color:var(--pri)}
.role .ico.y{background:var(--acc);color:var(--accInk)}
.role svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.role b{display:block;font:600 17px/1.3 var(--f-display);margin-bottom:2px}
.role span{font-size:14px;color:var(--mut)}

/* ---------- chat ---------- */
#log{flex:1;min-height:0;overflow-y:auto;padding:16px max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 14px;border-radius:18px 18px 18px 6px;background:var(--surface);border:1px solid var(--line);font-size:15.5px;align-self:flex-start;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--pri);border-color:var(--pri);color:var(--priInk);border-radius:18px 18px 6px 18px}
.m.wide{max-width:100%;width:100%;padding:0;overflow:hidden}
.m img{display:block;max-width:220px;width:100%;border-radius:12px;margin-bottom:6px}
.m.sys{align-self:center;background:transparent;border:0;font-size:13px;color:var(--mut);padding:2px}
.who{display:flex;align-items:center;gap:6px;font:700 12px/1 var(--f-body);color:var(--mut);margin:4px 0 -4px 2px}
.who .mark{width:18px;height:18px}
.typing{display:inline-flex;gap:4px;padding:4px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mut);opacity:.5}
@media (prefers-reduced-motion:no-preference){
  .typing i{animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  .m,.chips{animation:in .22s ease-out}
}
@keyframes blink{50%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(5px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-self:flex-start;max-width:100%}
.chips button{border:2px solid var(--pri);background:var(--surface);color:var(--pri);border-radius:99px;padding:8px 14px;font:600 14.5px/1.15 var(--f-body);text-align:left}
.chips button.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.composer{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 10px max(12px,env(safe-area-inset-left,0px))}
.composer .bar{display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:none;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg);max-height:110px;line-height:1.35}
.composer textarea:focus{outline:none;border-color:var(--pri)}
.recbar{display:flex;align-items:center;gap:10px}
.recbar .t{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;font-variant-numeric:tabular-nums;border:2px solid var(--line);border-radius:14px;padding:11px 12px;background:var(--bg)}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
@media (prefers-reduced-motion:no-preference){.recdot{animation:blink 1s infinite}}
.m audio{display:block;width:230px;max-width:100%;height:40px}
.m .tr{font-size:14px;opacity:.9;margin-top:6px;font-style:italic}
.iconbtn{flex:none;width:46px;height:46px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--mut);display:grid;place-items:center}
.iconbtn.p{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.attach{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13.5px;color:var(--mut)}
.attach img{width:46px;height:46px;object-fit:cover;border-radius:10px}
.attach button{border:0;background:none;color:var(--bad);font-weight:700}
.chatbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--mut)}
.chatbar b{color:var(--ink)}
.mode{display:inline-flex;align-items:center;gap:6px}
.mode i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mode.off i{background:var(--mut)}

/* ---------- freno de seguridad ---------- */
.stop{border:2px solid var(--acc);background:var(--surface);border-radius:16px;overflow:hidden;width:100%;max-width:100%;align-self:stretch}
.stop .stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1E2A24 12px 24px)}
.stop .in{padding:14px}
.stop h4{margin:0 0 6px;font:700 22px/1 var(--f-display);color:var(--warnInk);display:flex;gap:8px;align-items:center}
.stop h4 svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stop p{margin:6px 0;font-size:15px}
.stop .now{background:var(--warnSoft);color:var(--warnInk);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin:10px 0}
.stop .rule{font-size:12.5px;color:var(--mut);margin-top:6px}

/* ---------- tutorial ---------- */
.tut{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:stretch}
.tut .hd{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.tut .hd h4{margin:6px 0 8px;font:700 19px/1.2 var(--f-display)}
.prog{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .25s}
.steps{list-style:none;margin:0;padding:6px 0}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px 12px;align-items:center;padding:9px 14px}
.stimg{grid-column:2;aspect-ratio:16/10;max-width:100%;border-radius:12px;overflow:hidden;background:linear-gradient(100deg,var(--sunk) 30%,var(--priSoft) 50%,var(--sunk) 70%) 0 0/300% 100%}
@media (prefers-reduced-motion:no-preference){.stimg:empty{animation:shim 1.4s linear infinite}}
@keyframes shim{to{background-position:-150% 0}}
.stimg img{display:block;width:100%;height:100%;object-fit:cover}
.steps li+li{border-top:1px dashed var(--line)}
.steps .ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.steps label{flex:1;display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.steps .n{font:700 12px/1 var(--f-mono);color:var(--mut);margin-top:4px}
.steps input{width:22px;height:22px;flex:none;accent-color:var(--ok);margin:0 0 0 auto}
.steps li.done span.t{text-decoration:line-through;color:var(--mut)}
.warn{margin:0 14px 12px;padding:10px 12px;border-radius:10px;background:var(--warnSoft);color:var(--warnInk);font-size:14px;font-weight:600}
.tut .ft{padding:12px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--line);background:var(--sunk)}

/* ---------- orden de caso ---------- */
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;font-size:14px}
.ticket::before,.ticket::after{content:"";position:absolute;top:50px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.ticket::before{left:-9px}.ticket::after{right:-9px}
.m .ticket::before,.m .ticket::after{background:var(--bg)}
.ticket .tk{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font:700 12px/1 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.ticket h4{margin:8px 0 12px;font:600 17px/1.3 var(--f-display)}
.ticket dl{margin:0;padding-top:12px;border-top:2px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:6px 12px}
.ticket dt{font:700 11.5px/1.5 var(--f-mono);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.ticket dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ticket .photo{width:64px;height:64px;object-fit:cover;border-radius:8px}

/* ---------- prestadores y pedidos ---------- */
.offer{display:grid;gap:10px}
.offer .top2{display:flex;gap:12px;align-items:center}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--f-display);background:var(--priSoft);color:var(--pri)}
.av.lg{width:64px;height:64px;font-size:22px}
.price{font:700 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.quote{font-size:14.5px;color:var(--mut);border-left:3px solid var(--line);padding-left:10px}
.list{display:grid;gap:10px}
.jobcard{display:grid;gap:8px;text-align:left;width:100%;color:var(--ink)}
.jobcard .r1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.empty{text-align:center;padding:30px 14px;color:var(--mut)}
.empty svg{width:56px;height:56px;fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:8px}
.thread{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.thread .m{font-size:15px}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface)}
.back{border:0;background:none;color:var(--pri);font-weight:700;padding:0;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px}
.ratebtns{display:flex;gap:6px}
.ratebtns button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 0;font:700 18px/1 var(--f-display)}
.ratebtns button.on{border-color:var(--acc);background:var(--warnSoft);color:var(--warnInk)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat .card b{display:block;font:700 26px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat .card span{font-size:13px;color:var(--mut)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tg{width:52px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:var(--ok)}.tg.on::after{left:25px}
details.offerf{margin-top:4px}
details.offerf summary{list-style:none;cursor:pointer}
details.offerf summary::-webkit-details-marker{display:none}
details.offerf[open] summary{display:none}

/* ---------- materiales ---------- */
.mat{display:flex;gap:12px;align-items:flex-start}
.mat .ic{flex:none;width:44px;height:44px;border-radius:10px;background:var(--sunk);color:var(--ink);display:grid;place-items:center}
.ask{margin-top:6px;font:500 13px/1.4 var(--f-mono);background:var(--sunk);border-radius:8px;padding:6px 8px;display:block}
.ad{display:flex;gap:12px;align-items:center;border:1px dashed var(--mut);border-radius:var(--r);padding:12px;background:var(--surface)}
.ad .lg{flex:none;width:44px;height:44px;border-radius:10px;background:var(--mint);color:var(--accInk);display:grid;place-items:center;font:700 18px/1 var(--f-display)}
.mapbox{height:260px;width:100%;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);overflow:hidden;position:relative;z-index:0}
.mapfail{height:100%;display:grid;place-items:center;text-align:center;padding:20px;color:var(--mut);font-size:14px}
.pin{width:30px;height:38px}
.pin svg{width:30px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--pri);border:3px solid #fff;box-shadow:0 0 0 6px rgba(38,87,63,.25)}
.leaflet-container{font-family:var(--f-body)}
.leaflet-container a{color:var(--pri)}
.leaflet-popup-content{margin:10px 12px;font-size:14px}
.ferl{display:grid;gap:6px}
.ferl a{color:var(--pri);font-weight:700;text-decoration:none}

/* ---------- hojas y avisos ---------- */
.scrim{position:absolute;inset:0;background:rgba(14,24,19,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.adfull{position:absolute;inset:0;z-index:30;background:#1E2A24;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 24px;gap:14px}
.adfull .big{font:700 40px/1 var(--f-display);color:var(--acc)}
.adfull .cd{position:absolute;top:calc(env(safe-area-inset-top,0px) + 16px);right:16px;font:700 13px/1 var(--f-mono);background:rgba(255,255,255,.12);padding:8px 12px;border-radius:99px}
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);box-shadow:0 8px 24px -8px rgba(0,0,0,.4);z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;max-width:90%;text-align:center}
.tag svg,.btn svg,.back svg,.hint svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
img.av{object-fit:cover;background:var(--sunk)}
.avpick{display:flex;gap:14px;align-items:center}
.avpick label.av{cursor:pointer;border:2px dashed var(--pri);background:var(--priSoft);overflow:hidden}
.avpick label.av svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.avpick label.av img{width:100%;height:100%;object-fit:cover}
.avpick b{display:block}
.port{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.port .ph{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--sunk)}
.port .ph img{width:100%;height:100%;object-fit:cover;display:block}
.port .ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.port .ph button svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.5}
.port label.add{aspect-ratio:1;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--mut);cursor:pointer;font-size:13px;text-align:center;padding:6px}
.port label.add svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.bio{font-size:15px;margin:12px 0 0}
.track{list-style:none;margin:0;padding:4px 0 0;display:grid}
.track li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.track li:last-child{padding-bottom:0}
.track li::before{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}
.track li:last-child::before{display:none}
.track li.done::before{background:var(--pri)}
.track .dt{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--priInk);z-index:1}
.track .dt svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.track li.done .dt{background:var(--pri);border-color:var(--pri)}
.track li.cur .dt{border-color:var(--acc);background:var(--acc);color:var(--accInk);box-shadow:0 0 0 5px var(--warnSoft)}
.track b{display:block;font:600 15px/1.3 var(--f-display)}
.track span{font-size:13px;color:var(--mut)}
.track li.todo b{color:var(--mut);font-weight:500}
.m.sysl{align-self:center;max-width:100%;background:var(--sunk);border:0;color:var(--mut);font-size:13px;border-radius:99px;padding:6px 12px;text-align:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font:600 14px/1 var(--f-body);color:var(--mut)}
.seg button.on{background:var(--surface);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cmpwrap{overflow-x:auto;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.cmp{border-collapse:collapse;width:100%;min-width:440px;font-size:14px}
table.cmp th,table.cmp td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
table.cmp tr:last-child td{border-bottom:0}
table.cmp th{font:600 14px/1.25 var(--f-display)}
table.cmp td:first-child,table.cmp th:first-child{font:600 11.5px/1.3 var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);width:96px;position:sticky;left:0;background:var(--surface)}
table.cmp .best{color:var(--pri);font-weight:700}
table.cmp .best::after{content:" ★";color:var(--acc)}
.slots{display:grid;gap:8px}
.slot{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--surface);cursor:pointer;font-weight:600}
.slot input{width:20px;height:20px;accent-color:var(--pri);margin:0}
.slot:has(input:checked){border-color:var(--pri);background:var(--priSoft)}
.agrid{display:grid;grid-template-columns:64px 1fr 1fr;gap:8px;align-items:center}
.agrid .h{font:600 12px/1 var(--f-body);color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.agrid button{border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 4px;font:600 13.5px/1 var(--f-body);color:var(--mut)}
.agrid button.on{border-color:var(--pri);background:var(--pri);color:var(--priInk)}
.season{background:var(--head);color:var(--headInk);border-radius:16px;padding:16px;position:relative;overflow:hidden}
.season .eyebrow{color:var(--mint)}
.season h3{color:#FFFFFF;font-size:19px;margin:4px 0 2px}
.season p{margin:0;font-size:14px;opacity:.9}
.task{display:grid;gap:8px}
.task .r1{display:flex;gap:12px;align-items:flex-start}
.task .ic{flex:none;width:42px;height:42px;border-radius:10px;background:var(--priSoft);color:var(--pri);display:grid;place-items:center}
.task.done{opacity:.6}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center}
.hist .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.hist .ic.vos{background:var(--priSoft);color:var(--pri)}
.hist .ic.pro{background:var(--warnSoft);color:var(--warnInk)}

.cats button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.review{border-top:1px solid var(--line);padding-top:10px}

function slotLabel(k) { if (!k) return ''; const [d, f] = k.split('|'); const [y, m, dd] = d.split('-').map(Number); const dt = new Date(y, m - 1, dd);
  const t = new Date(); t.setHours(0, 0, 0, 0); const diff = Math.round((dt - t) / 864e5);

function bookedOf(pid) { return DB.jobs.filter(j => j.prov === pid && j.turno && !['finalizado', 'cancelado'].includes(j.estado)).map(j => j.turno); }

}

function advance(jid, k, actor) {
  const j = DB.jobs.find(x => x.id === jid); if (!j || j.estado === 'finalizado' || (j.etapa || 0) >= k) return;
  j.etapa = k; j.hist = j.hist || {}; j.hist[k] = Date.now();
  const pn = first(provInfo(j.prov).n), un = first(j.un);
  const txt = [null, `${pn} está en camino`, `${pn} empezó el trabajo`, `Trabajo terminado`][k];
  j.msgs.push({f:'s', t:txt});
  if (k === 3) { j.estado = 'finalizado'; j.fin = Date.now(); }
  const viewing = V.job === j.id;
  const act = actor || DB.cur.id; markUnseen(j, act === j.uid ? j.prov : j.uid);
  save();
  if (DB.cur && DB.cur.t === 'u' && DB.cur.id === j.uid) toast(k === 3 ? 'Trabajo terminado: contanos cómo te fue' : txt);
  if (DB.cur && DB.cur.t === 'p' && DB.cur.id === j.prov && k === 3 && j.uid === 'demo') toast(`${un} confirmó que el trabajo terminó`);
  if (DB.cur) { if (viewing || (V.tab === 'ped' && !V.job) || (V.tab === 'trab' && !V.job) || (V.tab === 'casa' && !V.job)) render(); else renderNav(); }
}
function demoProgress(jid) { const pv = () => (DB.jobs.find(x => x.id === jid) || {}).prov; setTimeout(() => advance(jid, 1, pv()), 7000); setTimeout(() => advance(jid, 2, pv()), 16000); }
function trackHTML(j) {
  const e = j.estado === 'finalizado' ? 3 : (j.etapa || 0), h = j.hist || {};
  const tm = ts => ts ? new Date(ts).toLocaleString('es-AR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : '';
  return `<ol class="track">${STAGES.map((n, i) => { const st = i < e || (i === e && i === 3) ? 'done' : i === e ? 'cur' : 'todo';
    return `<li class="${st}"><span class="dt">${st === 'done' ? ico('check').replace(/<circle[^>]*\/>/, '') : ''}</span><div><b>${n}</b><span>${h[i] ? tm(h[i]) : i === 0 && j.turno ? 'Turno: ' + slotLabel(j.turno) : STAGE_SUB[i]}</span></div></li>`; }).join('')}</ol>`;
}

function readPhoto(file, max) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onerror = rej; r.onload = () => { const img = new Image(); img.onerror = rej; img.onload = () => {
    const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas');
    if (max <= 300) { const side = Math.min(img.width, img.height); c.width = c.height = Math.min(max, side); c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, c.width, c.height); }
    else { c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); }
    res(c.toDataURL('image/jpeg', .82)); }; img.src = r.result; }; r.readAsDataURL(file); });
}

function onPic(e) {

      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);

let REC = null;
ACT.mic = async () => {
  if (REC) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') { toast('Este navegador no permite grabar audio'); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch (e) { toast('Para mandar audios, permití el uso del micrófono'); return; }
  let mr; try { mr = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(t => t.stop()); toast('No se pudo empezar a grabar'); return; }
  REC = {mr, stream, chunks:[], t0:Date.now(), cancel:false};
  mr.ondataavailable = e => { if (e.data && e.data.size) REC && REC.chunks.push(e.data); };
  mr.onstop = async () => {
    const r = REC; REC = null; stream.getTracks().forEach(t => t.stop()); clearInterval(r.timer); recUI(false);
    if (r.cancel) return;
    const dur = (Date.now() - r.t0) / 1000;
    if (dur < 1) { toast('El audio es muy corto'); return; }
    const blob = new Blob(r.chunks, {type:mr.mimeType || 'audio/webm'});
    let audio;
    try { audio = await toWav(blob); } catch (e) { audio = {mime:(blob.type || 'audio/webm').split(';')[0], data:await b64(await blob.arrayBuffer())}; }
    sendAudio(blob, audio, dur);
  };
  REC.timer = setInterval(() => {
    const sec = Math.floor((Date.now() - REC.t0) / 1000); const el = chatEl.querySelector('#recT'); if (el) el.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (sec >= 60) ACT.recStop();
  }, 250);
  mr.start(); recUI(true);
};
ACT.recStop = () => { if (REC && REC.mr.state !== 'inactive') REC.mr.stop(); };
ACT.recCancel = () => { if (REC) { REC.cancel = true; if (REC.mr.state !== 'inactive') REC.mr.stop(); } };
function recUI(on) { if (!chatEl) return; chatEl.querySelector('.composer .bar').hidden = on; chatEl.querySelector('#recbar').hidden = !on; if (on) chatEl.querySelector('#recT').textContent = '0:00'; }
async function b64(buf) { const u8 = new Uint8Array(buf); let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); }
async function toWav(blob) {
  const AC = window.AudioContext || window.webkitAudioContext; const ac = new AC();
  const ab = await blob.arrayBuffer();
  const buf = await new Promise((res, rej) => { const p = ac.decodeAudioData(ab, res, rej); if (p && p.then) p.then(res, rej); });
  try { ac.close(); } catch (e) {}
  const rate = 16000, len = Math.max(1, Math.ceil(buf.duration * rate));
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext; const off = new OAC(1, len, rate);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start(0);
  const out = await off.startRendering(); const d = out.getChannelData(0);
  const v = new DataView(new ArrayBuffer(44 + d.length * 2));
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + d.length * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, d.length * 2, true);
  for (let i = 0; i < d.length; i++) { const x = Math.max(-1, Math.min(1, d[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7FFF, true); }
  return {mime:'audio/wav', data:await b64(v.buffer)};
}
function sendAudio(blob, audio, dur) {
  LOG().querySelectorAll('.chips').forEach(c => c.remove());
  const url = URL.createObjectURL(blob);
  const bub = say(`<audio controls src="${url}"></audio><div class="tr" hidden></div>`, 'u');
  if (!CH.started) { if (!useCredit(false)) return; CH.started = true; CH.trans = CH.trans.filter(x => x.r !== 'b' || x.t.indexOf('Hola, ') !== 0); }
  CH.resp.push('(audio)');

}

async function ai(txt, img, t, audio, bub) {
  CH.h.push({role:'user', text:txt || (audio ? '(audio)' : 'Te mando una foto del problema.'), image:img ? {mime:'image/jpeg', data:img.split(',')[1]} : null, audio:audio || null});
  CH.bub = bub || null;

function handleAI(r, t) {
  const lastU = CH.h[CH.h.length - 1];
  if (lastU && lastU.audio) {
    const tx = (r.transcripcion || '').trim();

  }
  if (r.estado === 'preguntar') { say(msg); if ((r.opciones || []).length) chips(r.opciones.slice(0, 3).map(o => [String(o), () => go(String(o), true)])); return; }
  if (r.estado === 'guiar' && tut) { say(msg); return showTut(tut); }
  if (r.estado === 'guiar' && !tut && (r.pasos || []).length >= 2) {
    say(msg);
    return showTut({id:'gen', gen:true, n:r.caso || 'Tu arreglo', rubro:CH.rubro || 'Carpintería', lvl:r.nivel || 'Fácil', min:r.minutos || 20,

  }
  if (r.estado === 'guiar' && !tut) { say('Para esto no quiero improvisar pasos. Lo mejor es que lo vea un profesional.'); return derivar(); }
  if (r.estado === 'derivar') { say(msg); return derivar(); }
  say(msg);
}

/* ---------- reglas (sin conexión) ---------- */
function rules(t, img) {
  if (CH.pend) { // respuesta a la pregunta de acotado
    const tut = TUT[CH.pend]; CH.pend = null;
    const o = tut.o.find(x => x[0].toLowerCase() === t);
    if (o && o[1] === 'ok') return showTut(tut);
    if (o && o[1] === 'pro') { say('Con eso, <b>conviene que lo vea un profesional</b>.'); return derivar(); }
  }
  const tut = findTut(t);
  if (!tut) {
    say(img && !t ? 'Recibí la foto. Para orientarte sin conexión necesito que me cuentes con palabras qué pasa, por ejemplo “la canilla gotea” o “la puerta no cierra”.'
                 : 'No llegué a entender qué se rompió. Probá con otras palabras, por ejemplo “la canilla gotea”, “la puerta roza”, “el inodoro pierde agua” o “se quemó la lámpara”.');
    return;
  }
  if (CH.topic && CH.topic !== tut.id) { const keep = CH.resp[CH.resp.length - 1]; if (!useCredit(true)) { CH.resp.pop(); return; } resetTopic(); CH.resp = [keep]; }
  CH.topic = tut.id; CH.caso = tut.n; CH.rubro = tut.rubro; CH.pend = tut.id;
  say(`Entendido: <b>${esc(tut.n)}</b>. Una pregunta para acotar:<br>${esc(tut.q)}`);
  chips(tut.o.map(([lbl]) => [lbl, () => go(lbl, true)]));
}

ACT.locate = () => {
  const msg = t => { const el = $('#locMsg'); if (el) el.textContent = t; };
  if (!navigator.geolocation) { msg('Este dispositivo no permite compartir la ubicación'); return; }
  msg('Buscando tu ubicación…');
  navigator.geolocation.getCurrentPosition(pos => {
    LOC = {lat:pos.coords.latitude, lon:pos.coords.longitude};
    try { localStorage.setItem('hg_loc', '1'); } catch (e) {}
    const b = $('#locBtn'); if (b) b.innerHTML = ico('pin') + ' Actualizar ubicación';
    msg('Mostrando lo que hay cerca tuyo'); initMap();
  }, err => {
    try { if (err.code === 1) localStorage.removeItem('hg_loc'); } catch (e) {}
    msg(err.code === 1 ? 'No diste permiso. Podés activarlo en los ajustes del navegador.' : 'No pudimos obtener tu ubicación. Probá de nuevo.');
  }, {enableHighAccuracy:true, timeout:12000, maximumAge:300000});
};

ACT.stage = k => {

function bestOf(j) {
  const o = j.offers; if (o.length < 2) return {};
  const by = f => o.reduce((b, x, i) => f(x, i) < f(o[b], b) ? i : b, 0);
  const first_ = x => (x.slots && x.slots[0]) || 'z';
  const r = {precio:by(x => x.precio), cal:by(x => { const s = provInfo(x.pid).s; return -(typeof s === 'number' ? s : 0); }), turno:by(x => first_(x))};
  return r;
}

  if (error) { $('#err2').textContent = 'No se pudo eliminar la cuenta. Revisá tu conexión e intentá de nuevo.'; return; }
  closeSheet(); toast('Cuenta eliminada'); cloudLogout();
};
function tail() {
  const row = (a, ic, t) => `<button data-a="${a}">${ico(ic)}<span>${t}</span>${ico('back').replace('<svg', '<svg class="go"')}</button>`;
  return `<div class="sec"><h3 class="sh">Ajustes</h3><div class="settings">
   ${row('edit', 'edit', 'Editar perfil')}${row('legal', 'shield', 'Términos y privacidad')}${row('reset', 'trash', 'Borrar datos de este dispositivo')}${row('logout', 'user', 'Cerrar sesión')}</div>
   <button class="dangerlink" data-a="delAcc">Eliminar cuenta</button>
   <p class="hint" style="text-align:center;margin-top:10px">HandyGo · Te ayudamos a resolverlo, te conectamos si hace falta.</p></div>`;
}

/* ============================================================
   NUBE · Supabase (cuentas reales, pedidos compartidos, chat en tiempo real)
   Si no está configurado, la app funciona como antes, guardando en el dispositivo.
   ============================================================ */
let SB = null, SNAP = {jobs:{}, me:null}, SYNC_T = null, RT = null, SYNCING = null, UNDO_ME = null;
const isUuid = x => /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(String(x || ''));
const snapJob = j => { SNAP.jobs[j.id] = JSON.stringify(j); };
function loadSB() {
  if (window.supabase && window.supabase.createClient) return Promise.resolve();
  return new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
function busy(btn, txt) { if (!btn) return () => {}; const old = btn.innerHTML; btn.disabled = true; btn.textContent = txt; return () => { btn.disabled = false; btn.innerHTML = old; }; }
function authError(e) {
  const m = String((e && e.message) || e || '');
  if (/already registered|already exists/i.test(m)) return 'Ese mail ya tiene una cuenta. Probá con “Ya tengo cuenta”.';
  if (/invalid login/i.test(m)) return 'El mail o la contraseña no coinciden. Revisalos e intentá de nuevo.';
  if (/not confirmed/i.test(m)) return 'Todavía no confirmaste tu mail. Buscá el mail de HandyGo (fijate en spam) y tocá el link.';
  if (/rate limit|too many/i.test(m)) return 'Hubo demasiados intentos seguidos. Esperá unos minutos y probá de nuevo.';
  if (/password/i.test(m)) return 'La contraseña no es válida: usá al menos 6 caracteres.';
  return 'No pudimos conectarnos. Revisá tu conexión e intentá de nuevo.';
}
async function cloudLoad() {
  const { data:{ user } } = await SB.auth.getUser(); if (!user) return false;
  const [pr, js] = await Promise.all([SB.from('profiles').select('id,tipo,data'), SB.from('jobs').select('id,data').order('updated_at', {ascending:false})]);
  if (pr.error) throw pr.error; if (js.error) throw js.error;
  const mine = pr.data.find(x => x.id === user.id); if (!mine) throw new Error('Falta el perfil');
  DB = {users:[], provs:[], jobs:[], cur:{t:mine.tipo, id:user.id}};
  pr.data.forEach(addProfile);
  DB.jobs = js.data.map(r => ({...r.data, id:r.id}));
  SNAP = {jobs:{}, me:null}; DB.jobs.forEach(snapJob); SNAP.me = JSON.stringify(me());
  subscribe();
  return true;
}
function addProfile(r) {
  const o = {...r.data, id:r.id}; if (r.tipo === 'p') { o.rev = o.rev || []; o.agenda = o.agenda || defAgenda(); }
  const list = r.tipo === 'p' ? DB.provs : DB.users, i = list.findIndex(x => x.id === r.id);
  if (i >= 0) { if (r.id !== DB.cur.id) list[i] = o; } else list.push(o);
}
async function ensureProfiles(j) {
  const ids = [j.prov, ...(j.offers || []).map(o => o.pid), j.uid].filter(x => isUuid(x) && x !== DB.cur.id && ![...DB.users, ...DB.provs].some(p => p.id === x));
  if (!ids.length) return false;
  const r = await SB.from('profiles').select('id,tipo,data').in('id', [...new Set(ids)]);
  if (r.error || !r.data.length) return false; r.data.forEach(addProfile); return true;
}
function subscribe() {
  if (RT) SB.removeChannel(RT);
  RT = SB.channel('jobs-' + DB.cur.id).on('postgres_changes', {event:'*', schema:'public', table:'jobs'}, onJobChange).subscribe();
}
function onJobChange(ev) {
  if (!DB.cur) return;
  if (ev.eventType === 'DELETE') { const id = ev.old && ev.old.id; DB.jobs = DB.jobs.filter(j => j.id !== id); delete SNAP.jobs[id]; return softRender(); }
  const row = ev.new; if (!row || !row.data) return;
  const inc = {...row.data, id:row.id}, incS = JSON.stringify(inc), cur = DB.jobs.find(j => j.id === row.id);
  if (cur) {
    if (JSON.stringify(cur) !== SNAP.jobs[cur.id]) return;           // hay cambios propios sin guardar: los mandamos primero
    if (SNAP.jobs[cur.id] === incS) return;
    const old = JSON.parse(SNAP.jobs[cur.id]);
    Object.keys(cur).forEach(k => delete cur[k]); Object.assign(cur, inc); snapJob(cur);
    notify(old, cur);
  } else {
    DB.jobs.unshift(inc); snapJob(inc);
    if (DB.cur.t === 'p' && inc.estado === 'nuevo' && inc.uid !== 'demo') toast('Nuevo pedido de ' + String(inc.rubro || '').toLowerCase() + ' en tu zona');
  }
  ensureProfiles(cur || inc).then(ch => { if (ch) softRender(); });
  softRender();
}
function notify(old, j) {
  const mine = DB.cur.t === 'u' ? j.uid === DB.cur.id : j.prov === DB.cur.id;
  if ((j.offers || []).length > (old.offers || []).length && DB.cur.t === 'u' && j.uid === DB.cur.id) { const o = j.offers[j.offers.length - 1]; if (isUuid(o.pid)) toast('Nuevo presupuesto de ' + first(provInfo(o.pid).n)); }
  if ((j.msgs || []).length > (old.msgs || []).length && mine) {
    const m = j.msgs[j.msgs.length - 1];
    if (m.f === 's') toast(m.t); else if (m.f !== DB.cur.t) toast('Mensaje nuevo de ' + first(DB.cur.t === 'u' ? provInfo(j.prov).n : j.un));
  }
  if (DB.cur.t === 'p' && old.estado === 'nuevo' && j.estado === 'aceptado' && j.prov === DB.cur.id) toast(first(j.un) + ' aceptó tu presupuesto');
}
function softRender() {
  if (!DB.cur) return;
  if ($('#scrim') || (V.tab === 'chat' && !V.job) || V.edit) return renderNav();
  const mi = $('#mi'), val = mi ? mi.value : '', foc = document.activeElement === mi, sc = $('#view').scrollTop;
  const active = document.activeElement && document.activeElement.id && document.activeElement.id !== 'mi' && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (active) return renderNav();
  render();
  const mi2 = $('#mi'); if (mi2 && val) mi2.value = val; if (mi2 && foc) mi2.focus();
  $('#view').scrollTop = sc;
}
function cloudSave() { clearTimeout(SYNC_T); SYNC_T = setTimeout(cloudSync, 250); }
async function cloudSync() {
  if (!CLOUD || !DB.cur) return;
  if (SYNCING) { await SYNCING; }
  const ops = [];
  const m = me();
  if (m) { const s = JSON.stringify(m); if (s !== SNAP.me) {
    const old = SNAP.me ? JSON.parse(SNAP.me) : {}, patch = {};
    Object.keys(m).forEach(k => { if (k !== 'id' && k !== 'mail' && k !== 'pass' && JSON.stringify(m[k]) !== JSON.stringify(old[k])) patch[k] = m[k]; });
    const prevMe = SNAP.me; SNAP.me = s; if (Object.keys(patch).length) { ops.push(SB.rpc('profile_patch', {p_patch:patch})); UNDO_ME = () => { if (SNAP.me === s) SNAP.me = prevMe; }; } } }
  const undo = [];
  for (const j of DB.jobs) {
    const s = JSON.stringify(j), prev = SNAP.jobs[j.id];
    if (prev === s) continue;
    SNAP.jobs[j.id] = s; undo.push(() => { if (SNAP.jobs[j.id] === s) { if (prev === undefined) delete SNAP.jobs[j.id]; else SNAP.jobs[j.id] = prev; } });
    if (prev === undefined) {
      ops.push(SB.from('jobs').insert({id:j.id, uid:isUuid(j.uid) ? j.uid : null, demo_prov:j.uid === 'demo' ? DB.cur.id : null, rubro:j.rubro, estado:j.estado, prov:j.prov ? String(j.prov) : null, data:j}));
      continue;
    }
    const old = JSON.parse(prev), patch = {}, msgs = [], offers = [];
    Object.keys(j).forEach(k => {
      const a = JSON.stringify(j[k]), b = JSON.stringify(old[k]); if (a === b) return;
      if ((k === 'msgs' || k === 'offers') && Array.isArray(j[k]) && Array.isArray(old[k]) && j[k].length > old[k].length && JSON.stringify(j[k].slice(0, old[k].length)) === b) (k === 'msgs' ? msgs : offers).push(...j[k].slice(old[k].length));
      else patch[k] = j[k];
    });
    ops.push(SB.rpc('job_patch', {p_id:j.id, p_patch:patch, p_msgs:msgs, p_offers:offers}));
  }
  if (!ops.length) return;
  SYNCING = Promise.all(ops.map(p => Promise.resolve(p).catch(e => ({error:e}))));
  const res = await SYNCING; SYNCING = null;
  const bad = res.filter(r => r && r.error);
  if (bad.length) {
    console.warn('Sincronización:', bad.map(r => r.error));
    if (navigator.onLine === false || bad.some(r => /fetch|network|Failed/i.test(String((r.error && r.error.message) || r.error)))) { undo.forEach(f => f()); if (UNDO_ME) UNDO_ME(); netUI(); }
    else toast('No se pudo guardar un cambio. Intentá de nuevo.');
  }
  UNDO_ME = null;
}
async function upPhoto(dataUrl) {
  if (!CLOUD || !dataUrl || !String(dataUrl).startsWith('data:')) return dataUrl;
  try {
    const blob = await (await fetch(dataUrl)).blob(), path = DB.cur.id + '/' + uid() + '.jpg';
    const { error } = await SB.storage.from('fotos').upload(path, blob, {contentType:'image/jpeg', cacheControl:'31536000'});
    if (error) throw error;
    return SB.storage.from('fotos').getPublicUrl(path).data.publicUrl;
  } catch (e) { console.warn('Foto:', e); return dataUrl; }
}
async function cloudRegister(d, btn) {
  const done = busy(btn, 'Creando cuenta…');
  const meta = {...d}; ['id', 'mail', 'pass', 'foto'].forEach(k => delete meta[k]); meta.t = REG.t;
  if (REG.t === 'u') Object.assign(meta, {cr:5, resueltos:0}); else Object.assign(meta, {rev:[], on:true, desc:[]});
  const { data, error } = await SB.auth.signUp({email:d.mail, password:d.pass, options:{data:meta, emailRedirectTo:location.origin}});
  done();
  if (error) { $('#err').textContent = authError(error); return; }
  if (data.user && Array.isArray(data.user.identities) && !data.user.identities.length) { $('#err').textContent = authError('already registered'); return; }
  if (!data.session) {
    view(`<div class="empty" style="padding-top:70px">${ico('chat')}<h2>Revisá tu mail</h2><p>Te mandamos un link a <b>${esc(d.mail)}</b> para confirmar tu cuenta. Después volvé y tocá “Ya tengo cuenta”.</p>
      <button class="btn p w" style="margin-top:16px" data-a="login">Ya confirmé, ingresar</button></div>`); return;
  }
  try { await cloudLoad(); } catch (e) { console.warn(e); $('#err') && ($('#err').textContent = authError(e)); return; }
  if (REG.foto) { me().foto = await upPhoto(REG.foto); }
  if (REG.t === 'p') seedProvJobs(me());
  save();
  if (REG.t === 'p') { view(`<div class="empty" style="padding-top:80px">${ico('shield')}<h2>Revisando tu perfil…</h2><p>Validamos tu identidad${d.mat ? ' y tu matrícula' : ''}.</p></div>`); setTimeout(enter, 1500); }
  else enter();
}
async function cloudLogin(mail, pass, btn) {
  const done = busy(btn, 'Ingresando…');
  const { error } = await SB.auth.signInWithPassword({email:mail, password:pass});
  if (error) { done(); $('#err').textContent = authError(error); return; }
  try { await cloudLoad(); } catch (e) { done(); $('#err').textContent = authError(e); return; }
  enter();
}
const DEMO_ACC = {
  u:{mail:'sofia.demo@handygo.app', meta:{t:'u', nombre:'Sofía Martínez', zona:'Almagro, CABA', cr:5, resueltos:2}},
  'Plomería':{mail:'daniel.demo@handygo.app', meta:{t:'p', nombre:'Daniel Ortiz', zona:'Almagro y alrededores', rubro:'Plomería', mat:'', anios:9, rev:[{s:5, from:'Inés', c:'Muy responsable.'}, {s:5, from:'Marcos', c:'Llegó con todo lo necesario.'}], on:true, desc:[], hor:'Lunes a sábado, 8 a 19 h'}},

};
const DEMO_PASS = 'HandyGo-demo-2026';
async function cloudDemo(v) {
  const a = DEMO_ACC[v]; toast('Ingresando…');
  let r = await SB.auth.signInWithPassword({email:a.mail, password:DEMO_PASS}), nuevo = false;
  if (r.error && /invalid login/i.test(r.error.message)) {

async function cloudLogout() {
  try { if (RT) SB.removeChannel(RT); RT = null; await SB.auth.signOut(); } catch (e) {}
  DB = {users:[], provs:[], jobs:[], cur:null}; SNAP = {jobs:{}, me:null}; CH = null; chatEl = null; welcome();
}

/* ---------- sin conexión ---------- */
function netUI() { const o = $('#offline'), top = $('#top'); o.hidden = navigator.onLine !== false;
  o.style.top = (top && !top.hidden ? top.offsetHeight : 0) + 'px'; }
window.addEventListener('offline', netUI);
window.addEventListener('online', () => { netUI(); if (CLOUD) cloudSave(); toast('Conexión recuperada'); });
setTimeout(netUI, 0);

/* ---------- arranque ---------- */
async function boot() {
  let cfg = null;
  try { const r = await fetch('/api/config', {cache:'no-store'}); if (r.ok) cfg = await r.json(); } catch (e) {}
  if (!cfg || !cfg.ok) return render();                          // sin Supabase: modo local
  $('#top').hidden = true; $('#nav').hidden = true;
  view(`<div class="splash"><div class="brandc">${MARK}<h1>HandyGo</h1><p class="slogan">Cargando…</p></div></div>`, true);
  try {
    await loadSB();
    SB = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'handygo-auth'}});
    CLOUD = true;
    DB = {users:[], provs:[], jobs:[], cur:null};
    const recovery = /type=recovery/.test(location.hash);
    SB.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') vNewPass(); });
    const { data:{ session } } = await SB.auth.getSession();
    if (recovery && session) { history.replaceState(null, '', location.pathname); return vNewPass(); }
    if (session && await cloudLoad()) return enter();
  } catch (e) { console.warn('Nube:', e); if (!CLOUD) return render(); }
  welcome();
}
boot();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
